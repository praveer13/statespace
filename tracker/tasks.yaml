    workstream: "Spikes"
    kind: work
    origin: spine
    description: >-
      Stand up the instrument origin on its own custom subdomain (OD-5) and show that Z3 runs there
      cross-origin in Chromium, Firefox and WebKit while the parent's storage stays unreadable. Extend
      the executed origin result [X RUN-browser-origin] to the real hosting plan: same-site framing,
      the MessagePort handshake, and whether the framed origin's Cache API and service worker persist
      across desktop sessions (ARCHITECTURE.md section 20, issue 16). Write the decision record with
      its fallback: another static host for the instrument origin; I6 is never relaxed, and features
      that parse untrusted input wait.
    deliverables:
      - "docs/spikes/W0-S01.md"
      - "runs/RUN-origin-subdomain.json"
      - "scripts/spikes/W0-S01/"
    acceptance:
      - "RUN-origin-subdomain: Z3 runs cross-origin in three engines; parent storage unreadable"
      - "decision record names the fallback and whether the framed cache persists across sessions"
    implements: ["I6", "OD-5"]
    size: S
    model: opus
    model_reason: "Open question whose decision record shapes later content; needs judgment."
    depends_on: []
    status: done
    notes: >-
      Passed on a local stand-in labeled emulated (.test origins over HTTPS, three engines in the
      Playwright image). Owner: set up the real instrument subdomain (OD-5), re-record
      RUN-origin-subdomain there and check Safari by hand, and review decision record section 5.
      Owner accepted on 2026-10-25 (UTC), on the review page.
      Reopened 2026-10-25 by OD-6 (changed): decision 2 of section 5 says consent is asked once per
      engine and device, and section 6 says consent is asked again after a lost cache, but no download
      asks first now. An addendum restates both for the loader, with section 1's question and the
      harness's consent step; the OD-5 decision, the other decisions and the runs stand.
      The addendum was applied on 2026-10-25, with the status line and three short dated notes that
      point to it. The re-review covers only these; the rest of the record stays accepted.
      Owner accepted on 2026-10-25 (UTC) in conversation (review round 2).
