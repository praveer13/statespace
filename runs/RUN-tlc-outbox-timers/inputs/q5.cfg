\* CL-8.2: each command the client commits is charged at most once.
\* [M] TLC over Spec: one command, two attempts, one crash before the send.
\* [A] no timer re-sends an unanswered request (Timeouts = FALSE).
CONSTANTS Cmds = {c1}  MaxCrashes = 1  MaxAttempts = 2  CrashWindows = {"CW1"}
          Dedup = FALSE  FreshKey = FALSE  Forgets = "never"  Timeouts = FALSE
INIT Init
NEXT Next
INVARIANT NoDoubleCharge
