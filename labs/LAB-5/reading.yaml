# LAB-5.1: read the run of the provided DoubleSpend configuration.
#
# Run `uv run statespace check lab5.1` (or `statespace check lab5.1` inside the devcontainer). It runs TLC on
# challenge/DoubleSpend.tla and challenge/DoubleSpend.cfg, unchanged, and writes a receipt under
# receipts/LAB-5.1/. Open the receipt and the folder beside it, which holds TLC's whole output (tlc.out) and
# its JSON trace, and copy what TLC printed into the fields below. Copy, never type from memory: the check
# compares each field with TLC's own output.
#
# TODO(you): fill in every field from the run, then run the check again.

# The flags that change what TLC checks, as the receipt's tlc section lists them under flags.
flags: []

# TLC's result line, without the "Error: " prefix.
result: ""

# From the line "<generated> states generated, <distinct> distinct states found, ...".
distinct_states: null

# From the line "The depth of the complete state graph search is <depth>."
depth: null

# The trace's actions in order, by name only (Read or Write), one per step after the initial state.
trace: []
