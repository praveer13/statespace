# LAB-8's simulator crate (labs/LAB-8/README.md). Course-supplied; you write src/machine.rs, src/faults.rs and
# src/specimen.rs. No dependencies, so it builds offline: `cargo build --release`.
[package]
name = "outbox-sim"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "outbox-sim"
path = "src/main.rs"

[profile.release]
debug = false
