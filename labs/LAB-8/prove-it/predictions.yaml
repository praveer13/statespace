# LAB-8 Prove-it: predict first, with your agent closed (labs/README.md section 13).
#
# After the lab, `uv run python -m statespace.labs.lab8 defend` seeds each mutation below into a copy of your
# own artifacts and lets the right checker grade it: TLC for the spec, your simulator's suite for the machine,
# TLC again for the traces. It refuses to run until every prediction is written. Nothing here is graded by a
# model, and it writes nothing under receipts/.
#
# TODO(you): one prediction per line, in your own words, before you run it.

# Make the provider ignore keys (LAB-8.2). In which windows does NoDoubleCharge fail?
provider-ignores-keys: ""

# Write the intent after the commit instead of with it (LAB-8.2). Does NoLostIntent hold?
intent-after-commit: ""

# Set MaxCrashes to 0 (LAB-8.3). Does the liveness check pass, and what must its stamp say about crashes?
no-crashes: ""

# Remove the provider's fairness (LAB-8.3). Which of EventuallyDispatched and EventuallyAcked still holds?
no-provider-fairness: ""

# Mint the key at send time (LAB-8.4). On which seeds does the suite fail?
key-at-send: ""

# Make restart re-send stored intents (LAB-8.4). Does the suite pass, and does LAB-8.6 accept the traces?
resend-stored: ""

# Write the key row in its own transaction after the capture (LAB-8.5). What does a re-delivery after a
# crash between the two commits do?
key-row-after-capture: ""

# Drop the key from the Dispatch log lines (LAB-8.6). Is the fresh-key mutant accepted or rejected, and what
# flags it?
unlogged-key: ""
