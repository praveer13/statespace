# Your miniplinth check (labs/LAB-4/README.md). No dependencies, so it builds offline, and later to a wasm
# module with no imports (`cargo build --release --target wasm32-unknown-unknown`; drawer D-14).
[package]
name = "miniplinth-check"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "miniplinth-check"
path = "src/main.rs"
