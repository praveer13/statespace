# claims/declassify.yaml: what the system releases on purpose, one entry per release (LAB-7.7). TODO(you)
#
# Each entry states:
#   what:  a projection of the state, naming each field as documents.<field>, such as
#          "documents.title of a document d"; release state, not output fields (non-occlusion)
#   to:    who receives it
#   who:   who decides to release it (the command's guard)
#   where: which commands release it, and which views show it
#   when:  from when until when; what was delivered stays delivered
#   requirement: the requirement the release serves
#
# The set of documents.<field> projections across the entries must equal the release list in
# claims/observer.yaml, as the LAB-7.5 receipt pinned it. A channel you keep on purpose that no entry
# releases (such as the globally unique slug of S7.L4) goes in `kept`, as an [N] line.
releases: []
kept: []
