# claims/revocation.yaml: the pinned statements of LAB-7.6 (S7.L8). The course ships them; their hash goes
# into every LAB-7.6 receipt, and a changed hash voids what cites them to [?]. Do not edit this file.
statements:
  - id: S-new
    words: after revocation, no new read succeeds
    formula: "[][ReadOK(u, d) => canread(u, d)]_vars"
    kind: safety
    expected: holds on single-copy traces; a trace in which a read the state does not allow succeeds refutes it
  - id: S-past
    words: revocation removes what was already read
    formula: "[][Revoke(u, d) => d \\notin delivered'[u]]_vars"
    kind: safety
    expected: refuted by Share, Open, Revoke on one document, because delivered stays delivered
  - id: monotone-knowledge
    words: what was delivered stays delivered
    formula: "[](d \\in delivered[u] => [](d \\in delivered[u]))"
    kind: safety
    expected: holds by construction of the interpreter's log
