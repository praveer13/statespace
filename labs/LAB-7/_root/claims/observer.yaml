# claims/observer.yaml: the observer and the release list of LAB-7.5 (CL-7.3). TODO(you)
#
# observe: the parts of a response the viewer sees, among `code` (the response code, error codes
#   included), `fields` (the page's fields) and `total` (the count the response carries). SEAM-10's
#   observer is the response body, error codes included.
# release: the fields of a shared document that its owner released to the viewer's tenant, among
#   `title`, `body` and `internal_notes`: what Rel(L, R) keeps equal for a shared document.
#
# Its hash goes into the LAB-7.5 receipt, and LAB-7.7 compares claims/declassify.yaml with it.
observe: []
release: []
