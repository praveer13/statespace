# LAB-7.5's paired-state checker: the course's encoder (src/lib.rs, src/main.rs) and your product
# construction (src/noninterference.rs). No dependencies, so it builds offline:
#   cargo build --manifest-path labs/LAB-7/checker/Cargo.toml
# The same crate builds for the tab with --target wasm32-unknown-unknown.
[package]
name = "lab7-checker"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]

[[bin]]
name = "lab7-checker"
path = "src/main.rs"
