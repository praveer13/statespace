# LAB-7.6's revocation monitors: the course's trace reader (src/lib.rs, src/main.rs) and your two monitors
# (src/s_new.rs, src/s_past.rs). No dependencies, so it builds offline:
#   cargo build --manifest-path labs/LAB-7/monitors/Cargo.toml
[package]
name = "lab7-monitors"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]

[[bin]]
name = "lab7-monitors"
path = "src/main.rs"
