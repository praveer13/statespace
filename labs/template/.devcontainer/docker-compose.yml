# The Bench services of statespace-lab (ARCHITECTURE.md section 11.1): the Bench image, named by digest, and a
# PostgreSQL 18.6 service container beside it. The two digests are the pins; change them through the template.
#
# STATESPACE_BENCH_IMAGE carries the same reference into the container, because a container cannot read its own
# image digest, and `statespace doctor` copies it into every receipt's environment.

x-bench-image: &bench-image statespace-bench@sha256:701be043775cc261e84a92fe985ef94d524617fdb3d53e2255187932d2ec0f9a
x-postgres-image: &postgres-image postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336

services:
  bench:
    image: *bench-image
    platform: linux/amd64
    command: sleep infinity
    init: true
    volumes:
      - ..:/workspaces/statespace-lab:cached
    environment:
      STATESPACE_BENCH_IMAGE: *bench-image
      STATESPACE_PG_DSN: postgresql://postgres@postgres:5432/postgres
      STATESPACE_PG_IMAGE: *postgres-image
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: *postgres-image
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD", "pg_isready", "--username", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
