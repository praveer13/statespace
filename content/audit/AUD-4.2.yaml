        - { id: s2, text: "the result bal_p = 3, held_p = 5", answer: false, key_line: "[q4 s2 bal_p=3 held_p=5] ruled out: no", why: "held_p <= bal_p was the conjunct dropped, so the query allows more held than the balance. Inv forbids it." }
        - { id: s3, text: "the result bal_p = -1, held_p = 0", answer: true, key_line: "[q4 s3 bal_p=-1 held_p=0] ruled out: yes", why: "0 <= bal_p is still checked." }
        - { id: s4, text: "the result bal_p = 2, held_p = -1", answer: true, key_line: "[q4 s4 bal_p=2 held_p=-1] ruled out: yes", why: "0 <= held_p is still checked." }
