    key_run: RUN-z3-noguard-pair
    key_lines: ["[q4 check] unsat", "[q4 implied] sat held_p=1 bal_p=0", "[q4 full] unsat"]
    explain: "The dropped conjunct, held_p <= bal_p, does not follow from the other two: held_p = 1, bal_p = 0 meets both and breaks it. The unsat covers less than Capture's obligation. Capture does keep the full Inv (that query is unsat too), but this check is not the evidence for it."

  - id: v2-sound
    pair: v2
    operator: swap-quantifiers
    artifact: account-map-obligation
    claim: "Z3 proved Transfer's invariant obligation over the account map."
    key: none
    description: "Restates the conclusion over the account map, as the new emitter writes it. Still unsat."
    statement: |
      ; Transfer(x, y, amt)'s obligation over the account map. Inv: every account at 0 or above
      (declare-fun bal (Int) Int)
      (declare-fun bal_p (Int) Int)
      (declare-const x Int)
      (declare-const y Int)
      (declare-const amt Int)
      (assert (forall ((i Int)) (=> (and (<= 1 i) (<= i 2)) (>= (bal i) 0))))
      (assert (and (<= 1 x) (<= x 2) (<= 1 y) (<= y 2) (distinct x y)))
      (assert (and (> amt 0) (<= amt (bal x))))
      (assert (forall ((i Int)) (= (bal_p i) (ite (= i x) (- (bal i) amt) (ite (= i y) (+ (bal i) amt) (bal i))))))
      (assert (not (forall ((i Int)) (=> (and (<= 1 i) (<= i 2)) (>= (bal_p i) 0)))))
      (check-sat)
    diff: |
      --- a/obligations/transfer_map.smt2
      +++ b/obligations/transfer_map.smt2
      @@ -10,2 +10,2 @@
       (assert (forall ((i Int)) (= (bal_p i) (ite (= i x) (- (bal i) amt) (ite (= i y) (+ (bal i) amt) (bal i))))))
      -(assert (not (and (>= (bal_p 1) 0) (>= (bal_p 2) 0))))
      +(assert (not (forall ((i Int)) (=> (and (<= 1 i) (<= i 2)) (>= (bal_p i) 0)))))
    receipt: |
      z3 5.3.1
      [q5 check] unsat
    restatement:
      run: RUN-z3-noguard-exemplars
      scenarios: &v2-sound-scenarios
        - { id: s1, text: "the result bal_p(1) = 50, bal_p(2) = 30", answer: false, key_line: "[q5 s1 bal_p(1)=50 bal_p(2)=30] ruled out: no", why: "Both accounts at 0 or above: allowed." }
        - { id: s2, text: "the result bal_p(1) = -10, bal_p(2) = 90", answer: true, key_line: "[q5 s2 bal_p(1)=-10 bal_p(2)=90] ruled out: yes", why: "Account 1 below zero: the forall catches it." }
        - { id: s3, text: "the result bal_p(1) = -5, bal_p(2) = -5", answer: true, key_line: "[q5 s3 bal_p(1)=-5 bal_p(2)=-5] ruled out: yes", why: "Both below zero: ruled out." }
        - { id: s4, text: "the result bal_p(1) = 0, bal_p(2) = 80", answer: false, key_line: "[q5 s4 bal_p(1)=0 bal_p(2)=80] ruled out: no", why: "A balance of exactly 0 meets Inv: allowed." }
    evidence: { type: restatement, scenarios: *v2-sound-scenarios }
    key_run: RUN-z3-noguard-exemplars
    key_lines: ["[q5 check] unsat", "[q5 full] unsat", "[q5 without guard] sat"]
    explain: "The conclusion quantifies over both accounts with forall, so it is Inv after the step. Remove the guard and the query turns sat: it catches an overdraft, and with the guard in place it finds none."

