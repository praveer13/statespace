    key_run: RUN-z3-noguard-exemplars
    key_lines: ["[q6 check] unsat", "[q6 without guard] unsat", "[q5 without guard] sat"]
    explain: "The emitter wrote exists where Inv says every account: the unsat says only that some account ends at 0 or above, which the credited account always does. The same query stays unsat with the guard removed, where the forall form turns sat. Transfer does keep Inv ([q6 full] is unsat), but this check is not the evidence for it."

  - id: v3-flawed
    pair: v3
    operator: weaken-postcondition
    artifact: fee-obligation
    claim: "Z3 proved Transfer's invariant obligation, fee included."
    key: G1
    description: "Spells out Inv′ in Transfer's obligation and drops the conjunct the others imply. Still unsat."
    statement: |
      ; Transfer's obligation with its fee. Inv: a, b and the fee account f at 0 or above, f at most 100, total 100
      (define-fun Inv ((a Int) (b Int) (f Int)) Bool (and (>= a 0) (>= b 0) (>= f 0) (<= f 100) (= (+ a b f) 100)))
      (declare-const a Int)
      (declare-const b Int)
      (declare-const f Int)
      (declare-const amt Int)
      (declare-const a_p Int)
      (declare-const b_p Int)
      (declare-const f_p Int)
      (assert (Inv a b f))
      (assert (and (> amt 0) (<= (+ amt 1) a)))
      (assert (and (= a_p (- a amt 1)) (= b_p (+ b amt)) (= f_p (+ f 1))))
      (assert (not (and (>= b_p 0) (>= f_p 0) (<= f_p 100) (= (+ a_p b_p f_p) 100))))
      (check-sat)
    diff: |
      --- a/obligations/transfer_fee.smt2
      +++ b/obligations/transfer_fee.smt2
      @@ -12,2 +12,2 @@
       (assert (and (= a_p (- a amt 1)) (= b_p (+ b amt)) (= f_p (+ f 1))))
      -(assert (not (Inv a_p b_p f_p)))
      +(assert (not (and (>= b_p 0) (>= f_p 0) (<= f_p 100) (= (+ a_p b_p f_p) 100))))
    receipt: |
      z3 5.3.1
      [q8 check] unsat
    restatement:
      run: RUN-z3-noguard-exemplars
      scenarios:
        - { id: s1, text: "the result a_p = 60, b_p = 39, f_p = 1", answer: false, key_line: "[q8 s1 a_p=60 b_p=39 f_p=1] ruled out: no", why: "It meets every conjunct of Inv: allowed." }
        - { id: s2, text: "the result a_p = -5, b_p = 100, f_p = 5", answer: false, key_line: "[q8 s2 a_p=-5 b_p=100 f_p=5] ruled out: no", why: "a_p >= 0 was the conjunct dropped, so the query allows the sender below zero. Inv forbids it." }
        - { id: s3, text: "the result a_p = 50, b_p = 40, f_p = 20", answer: true, key_line: "[q8 s3 a_p=50 b_p=40 f_p=20] ruled out: yes", why: "The total is 110: still ruled out." }
        - { id: s4, text: "the result a_p = 30, b_p = 60, f_p = 0", answer: true, key_line: "[q8 s4 a_p=30 b_p=60 f_p=0] ruled out: yes", why: "The total is 90: still ruled out." }
    evidence: { type: scenario, load_bearing: ["statement:13", "diff:6"], reference: { run: RUN-z3-noguard-exemplars, line: "[q8 s2 a_p=-5 b_p=100 f_p=5] ruled out: no" } }
    key_run: RUN-z3-noguard-exemplars
    key_lines: ["[q8 check] unsat", "[q8 implied] sat a_p=-1 b_p=101 f_p=0", "[q8 full] unsat"]
    explain: "The dropped conjunct, a_p >= 0, does not follow from the four kept: a_p = -1, b_p = 101, f_p = 0 meets them all. The unsat covers less than Transfer's obligation. Transfer does keep the full Inv ([q8 full] is unsat), but this check is not the evidence for it."

