        - { id: s2, text: "the result bal_p(1) = -10, bal_p(2) = 90", answer: false, key_line: "[q6 s2 bal_p(1)=-10 bal_p(2)=90] ruled out: no", why: "Account 2 is at 90, so some account is at 0 or above, and the negated exists is false: the query never considers this overdraft." }
