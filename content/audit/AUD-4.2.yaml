# AUD-4.2 · S4 · sound anchor, flawed member G1 (docs/AUDIT-DESK.md section 3.2). The format is
# content/audit/README.md's. The sound member is keyed by RUN-z3-conservation-noguard (spine section 6.2's Key run):
# conservation over Int holds with no guard at all. Receipts, the flawed member, the variant pair and every step-3
# scenario are keyed by RUN-z3-noguard-pair, recorded in the Bench image. Its tags are neutral: q1 flawed, q2 sound,
# q3 v1-sound, q4 v1-flawed. Both pairs make an edit of the same shape with opposite effects: dropping a premise
# makes an obligation stronger, and dropping a conjunct of Inv′ makes it weaker.
id: AUD-4.2
stage: S4
class: none
medium: smt-lib
artifact: unguarded-transfer
subject: "an obligation checked without a guard (SMT-LIB)"
claim: "Z3 proved the invariant obligation, even without the guard."
requirement: >-
  The query Z3 checked implies the command's whole invariant obligation: from any state that meets Inv, as the ledger
  declares it, every step the command takes ends in a state that meets every conjunct of Inv.
scenario_question: "Does the query Z3 checked rule out this result?"
scheduled_after: [LAB-4]
kcs: [KC-4.vc-shape, KC-2.theorem-statement-reading]
based_on:
  incident: "Erdős problem #124: the Lean statement said \"= 1\" where the comment said \"≥ 1\", which made it weaker; the corrected form was also proved."
  date: "2025-11"
  date_marks: "the forum thread on the corrected statement"
  source: https://www.erdosproblems.com/forum/thread/124

cases:
  - id: sound
    key: none
    description: "Drops Transfer's guard, which this ledger does not need. miniplinth check still reports the obligation unsat."
    statement: |
      ; Transfer's obligation, as miniplinth check emits it; Inv is ledger.mp's
      (define-fun Inv ((x Int) (y Int)) Bool (= (+ x y) 100))
      (declare-fun a () Int)
      (declare-fun b () Int)
      (declare-fun amount () Int)
      (declare-fun a_p () Int)
      (declare-fun b_p () Int)
      (assert (Inv a b))
      (assert (> amount 0))
      (assert (and (= a_p (- a amount)) (= b_p (+ b amount))))
      (assert (not (= (+ a_p b_p) 100)))
      (check-sat)
    diff: |
      --- a/commands/transfer.mp
      +++ b/commands/transfer.mp
      @@ -1,4 +1,3 @@
       command Transfer:
      -  requires amount ≤ a;
         a := a − amount;
         b := b + amount
    receipt: |
      z3 5.3.1
      [q2 check] unsat
    restatement:
      run: RUN-z3-noguard-pair
      scenarios: &sound-scenarios
        - { id: s1, text: "from a = 70, b = 30 with amount 20, the result a_p = 50, b_p = 50", answer: false, key_line: "[q2 s1 a_p=50 b_p=50] ruled out: no", why: "The total is still 100: the query allows it, and so does Inv." }
        - { id: s2, text: "from a = 70, b = 30 with amount 90, the result a_p = -20, b_p = 120", answer: false, key_line: "[q2 s2 a_p=-20 b_p=120] ruled out: no", why: "This ledger's Inv asks only that the total stay 100, so an overdraft keeps it. The query allows it, as Inv does." }
        - { id: s3, text: "the result a_p = 50, b_p = 60", answer: true, key_line: "[q2 s3 a_p=50 b_p=60] ruled out: yes", why: "The total is 110: the query rules it out." }
        - { id: s4, text: "the result a_p = -20, b_p = 130", answer: true, key_line: "[q2 s4 a_p=-20 b_p=130] ruled out: yes", why: "The total is 110 again: ruled out." }
    evidence: { type: restatement, scenarios: *sound-scenarios }
    key_run: RUN-z3-conservation-noguard
    key_lines: ["[conservation without any guard, Int] proved"]
    explain: "Inv here is one conjunct, the total, and the query negates all of it. Dropping the guard removes a premise, so the obligation becomes stronger, and it is still unsat. The guarded obligation follows. Conservation over Int never depended on the guard."

  - id: flawed
    key: G1
    description: "Drops Transfer's guard, which this ledger does not need. miniplinth check still reports the obligation unsat."
    statement: |
      ; Transfer's obligation, as miniplinth check emits it; Inv is ledger.mp's
      (define-fun Inv ((x Int) (y Int)) Bool (and (>= x 0) (>= y 0) (= (+ x y) 100)))
      (declare-fun a () Int)
      (declare-fun b () Int)
      (declare-fun amount () Int)
      (declare-fun a_p () Int)
      (declare-fun b_p () Int)
      (assert (Inv a b))
      (assert (> amount 0))
      (assert (and (= a_p (- a amount)) (= b_p (+ b amount))))
      (assert (not (= (+ a_p b_p) 100)))
      (check-sat)
    diff: |
      --- a/commands/transfer.mp
      +++ b/commands/transfer.mp
      @@ -1,4 +1,3 @@
       command Transfer:
      -  requires amount ≤ a;
         a := a − amount;
         b := b + amount
    receipt: |
      z3 5.3.1
      [q1 check] unsat
    restatement:
      run: RUN-z3-noguard-pair
      scenarios:
        - { id: s1, text: "from a = 70, b = 30 with amount 20, the result a_p = 50, b_p = 50", answer: false, key_line: "[q1 s1 a_p=50 b_p=50] ruled out: no", why: "The total is still 100, and both balances are at zero or above." }
        - { id: s2, text: "from a = 70, b = 30 with amount 90, the result a_p = -20, b_p = 120", answer: false, key_line: "[q1 s2 a_p=-20 b_p=120] ruled out: no", why: "The query checks only the total, so it allows a = -20. The declared Inv forbids it." }
        - { id: s3, text: "the result a_p = 50, b_p = 60", answer: true, key_line: "[q1 s3 a_p=50 b_p=60] ruled out: yes", why: "The total is 110: ruled out." }
        - { id: s4, text: "the result a_p = -20, b_p = 130", answer: true, key_line: "[q1 s4 a_p=-20 b_p=130] ruled out: yes", why: "The total is 110, so the query rules it out, for the total and not for the sign." }
    evidence: { type: scenario, load_bearing: ["statement:2", "statement:11"], reference: { run: RUN-z3-noguard-pair, line: "[q1 s2 a_p=-20 b_p=120] ruled out: no" } }
    key_run: RUN-z3-noguard-pair
    key_lines: ["[q1 check] unsat", "[q1 full] sat", "[q1 full min amount] 1 (a=0 b=100 a_p=-1 b_p=101)"]
    explain: "The declared Inv has three conjuncts, but the last assertion negates only the total. The unsat covers conservation and nothing else. With every conjunct of Inv the same query is sat: without the guard, a transfer of 1 from a = 0 leaves a at -1. The dropped guard was the one thing keeping balances at zero or above."

variants:
  - id: v1-sound
    pair: v1
    operator: weaken-postcondition
    artifact: capture-obligation
    claim: "Z3 proved Capture's invariant obligation."
    key: none
    description: "Shortens Capture's obligation: drops the conjunct of Inv′ that the other two imply. Still unsat."
    statement: |
      ; Capture(n)'s obligation, as miniplinth check emits it. Inv: 0 <= held, held <= bal, 0 <= bal
      (declare-fun bal () Int)
      (declare-fun held () Int)
      (declare-fun n () Int)
      (declare-fun bal_p () Int)
      (declare-fun held_p () Int)
      (assert (and (<= 0 held) (<= held bal) (<= 0 bal)))
      (assert (and (> n 0) (<= n held)))
      (assert (and (= bal_p (- bal n)) (= held_p (- held n))))
      (assert (not (and (<= 0 held_p) (<= held_p bal_p))))
      (check-sat)
    diff: |
      --- a/obligations/capture.smt2
      +++ b/obligations/capture.smt2
      @@ -9,2 +9,2 @@
       (assert (and (= bal_p (- bal n)) (= held_p (- held n))))
      -(assert (not (and (<= 0 held_p) (<= held_p bal_p) (<= 0 bal_p))))
      +(assert (not (and (<= 0 held_p) (<= held_p bal_p))))
    receipt: |
      z3 5.3.1
      [q3 check] unsat
    restatement:
      run: RUN-z3-noguard-pair
      scenarios: &v1-sound-scenarios
        - { id: s1, text: "the result bal_p = 5, held_p = 2", answer: false, key_line: "[q3 s1 bal_p=5 held_p=2] ruled out: no", why: "It meets every conjunct of Inv: allowed." }
        - { id: s2, text: "the result bal_p = 3, held_p = 5", answer: true, key_line: "[q3 s2 bal_p=3 held_p=5] ruled out: yes", why: "More held than the balance: the query still checks held_p <= bal_p." }
        - { id: s3, text: "the result bal_p = -1, held_p = 0", answer: true, key_line: "[q3 s3 bal_p=-1 held_p=0] ruled out: yes", why: "0 <= bal_p is no longer written, but held_p <= bal_p fails at 0 and -1: still ruled out." }
        - { id: s4, text: "the result bal_p = 2, held_p = -1", answer: true, key_line: "[q3 s4 bal_p=2 held_p=-1] ruled out: yes", why: "A negative hold: ruled out by 0 <= held_p." }
    evidence: { type: restatement, scenarios: *v1-sound-scenarios }
    key_run: RUN-z3-noguard-pair
    key_lines: ["[q3 check] unsat", "[q3 implied] unsat", "[q3 full] unsat"]
    explain: "0 <= bal_p follows from 0 <= held_p and held_p <= bal_p: Z3 finds no state that meets those two and breaks it. Dropping it leaves the obligation as strong as before, and the full obligation is unsat as well."

  - id: v1-flawed
    pair: v1
    operator: weaken-postcondition
    artifact: capture-obligation
    claim: "Z3 proved Capture's invariant obligation."
    key: G1
    description: "Shortens Capture's obligation: drops the conjunct of Inv′ that the other two imply. Still unsat."
    statement: |
      ; Capture(n)'s obligation, as miniplinth check emits it. Inv: 0 <= held, held <= bal, 0 <= bal
      (declare-fun bal () Int)
      (declare-fun held () Int)
      (declare-fun n () Int)
      (declare-fun bal_p () Int)
      (declare-fun held_p () Int)
      (assert (and (<= 0 held) (<= held bal) (<= 0 bal)))
      (assert (and (> n 0) (<= n held)))
      (assert (and (= bal_p (- bal n)) (= held_p (- held n))))
      (assert (not (and (<= 0 held_p) (<= 0 bal_p))))
      (check-sat)
    diff: |
      --- a/obligations/capture.smt2
      +++ b/obligations/capture.smt2
      @@ -9,2 +9,2 @@
       (assert (and (= bal_p (- bal n)) (= held_p (- held n))))
      -(assert (not (and (<= 0 held_p) (<= held_p bal_p) (<= 0 bal_p))))
      +(assert (not (and (<= 0 held_p) (<= 0 bal_p))))
    receipt: |
      z3 5.3.1
      [q4 check] unsat
    restatement:
      run: RUN-z3-noguard-pair
      scenarios:
        - { id: s1, text: "the result bal_p = 5, held_p = 2", answer: false, key_line: "[q4 s1 bal_p=5 held_p=2] ruled out: no", why: "It meets every conjunct of Inv: allowed." }
        - { id: s2, text: "the result bal_p = 3, held_p = 5", answer: false, key_line: "[q4 s2 bal_p=3 held_p=5] ruled out: no", why: "held_p <= bal_p was the conjunct dropped, so the query allows more held than the balance. Inv forbids it." }
        - { id: s3, text: "the result bal_p = -1, held_p = 0", answer: true, key_line: "[q4 s3 bal_p=-1 held_p=0] ruled out: yes", why: "0 <= bal_p is still checked." }
        - { id: s4, text: "the result bal_p = 2, held_p = -1", answer: true, key_line: "[q4 s4 bal_p=2 held_p=-1] ruled out: yes", why: "0 <= held_p is still checked." }
    evidence: { type: scenario, load_bearing: ["statement:10", "diff:6"], reference: { run: RUN-z3-noguard-pair, line: "[q4 s2 bal_p=3 held_p=5] ruled out: no" } }
    key_run: RUN-z3-noguard-pair
    key_lines: ["[q4 check] unsat", "[q4 implied] sat held_p=1 bal_p=0", "[q4 full] unsat"]
    explain: "The dropped conjunct, held_p <= bal_p, does not follow from the other two: held_p = 1, bal_p = 0 meets both and breaks it. The unsat covers less than Capture's obligation. Capture does keep the full Inv (that query is unsat too), but this check is not the evidence for it."
