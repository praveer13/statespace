    pair: v2
    operator: swap-quantifiers
    artifact: account-map-obligation
    claim: "Z3 proved Transfer's invariant obligation over the account map."
    key: G1
    description: "Restates the conclusion over the account map, as the new emitter writes it. Still unsat."
    statement: |
