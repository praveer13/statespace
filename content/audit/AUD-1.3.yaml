  - id: v3-sound
    pair: v3
    operator: report-inconclusive-as-verdict
    artifact: fee-overdraft-budget-smt
    medium: smt-lib
    key: none
    description: "Sets a resource limit on the overdraft query so the CI step stays fast. Z3 found no counterexample."
    statement: |
      (set-option :rlimit 5000000)
      (declare-const a Int)
      (declare-const amount Int)
      (declare-const rate Int)
      (declare-const fee Int)
      (assert (and (>= a 0) (> amount 0)))
      (assert (and (>= rate 0) (<= rate 500)))                 ; the rate in basis points
      (assert (<= (* fee 10000) (* amount rate)))              ; fee = floor(amount * rate / 10000)
      (assert (< (* amount rate) (+ (* fee 10000) 10000)))
      (assert (<= (+ amount fee) a))                           ; the guard: the sender covers amount and fee
      (assert (< (- a amount fee) 0))                          ; the violation: the sender ends below zero
      (check-sat)
      (get-info :reason-unknown)
    diff: |
      --- a/checks/fee_query.smt2
      +++ b/checks/fee_query.smt2
      @@ -1,2 +1,3 @@
      +(set-option :rlimit 5000000)
       (declare-const a Int)
       (declare-const amount Int)
    receipt: |
      [q7 cli] unsat (:reason-unknown "")
    restatement:
      run: RUN-z3-inconclusive-pairs
      scenarios: &v3-sound-scenarios
