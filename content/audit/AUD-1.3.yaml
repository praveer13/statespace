    statement: |
      x, y, z = Ints('x y z')
      s = Solver()
      s.set('rlimit', 5000000)
      s.add(x > 2, y > 2)
      s.add(z <= 3)
      s.add(x*x*x + y*y*y == z*z*z)            # the violation: a cube that is a sum of two cubes
      r = s.check()
      print(r, s.reason_unknown() if r == unknown else '')
    diff: |
      --- a/checks/cube_query.py
      +++ b/checks/cube_query.py
      @@ -2,2 +2,3 @@
       s = Solver()
      +s.set('rlimit', 5000000)
       s.add(x > 2, y > 2)
    receipt: |
      z3 5.3.1
      [q10 violation] unsat
    restatement:
      run: RUN-z3-inconclusive-pairs
      scenarios: &v4-sound-scenarios
        - id: s1
          text: "x = 3, y = 3, z = 3"
