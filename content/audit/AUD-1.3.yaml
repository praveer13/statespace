    evidence: { type: restatement, scenarios: *v4-sound-scenarios }
    key_run: RUN-z3-inconclusive-pairs
    key_lines: ["[q10 violation] unsat"]
    explain: "With z at most 3 the bounds decide it: x and y above 2 make the left side too large, and Z3 answered unsat within the budget. The claim holds for what this statement states, z up to 3, and no further."
