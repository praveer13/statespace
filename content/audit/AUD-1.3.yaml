          why: "Amount plus fee is over the balance: the guard leaves it out."
        - id: s3
          text: "a = 5000, amount = 5000, rate = 0"
          answer: true
          key_line: "[q7 s3 a=5000 amount=5000 rate=0] established"
          why: "No fee, the whole balance: covered."
        - id: s4
          text: "a = 10, amount = 20, rate = 0"
          answer: false
          key_line: "[q7 s4 a=10 amount=20 rate=0] not established (the values fail a premise)"
          why: "An overdraft the guard refuses."
    evidence: { type: restatement, scenarios: *v3-sound-scenarios }
    key_run: RUN-z3-inconclusive-pairs
    key_lines: ["[q7 cli] unsat", "[q7 violation] unsat"]
    explain: "The command line answered unsat within an rlimit of 5000000, and the reason line is empty because the answer is not unknown. Stamped with its budget, the claim stands."

