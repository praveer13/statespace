# AUD-1.3 · S1 · G5 Bounded or inconclusive presented as proof (docs/AUDIT-DESK.md section 3.2). The format is
# content/audit/README.md's. Variant pair v4's flawed form is the tab's own budget query, keyed by RUN-z3-budget-pyodide
# (spine section 6.2's key run). The pair, the other variant pairs, every receipt and every scenario are keyed by
# RUN-z3-inconclusive-pairs, recorded in the Bench image (content/audit/tools/record-keys-s1s2.mjs), which runs each
# case's query exactly as the case states it, budget included. Its tags are neutral: q1 sound member, q2 flawed
# member, q3/q4 variant pair v1 (sound/flawed), q5/q6 v2 (sound/flawed), q7/q8 v3 (sound/flawed), q9/q10 v4
# (flawed/sound).
id: AUD-1.3
stage: S1
class: G5
medium: z3py
artifact: fee-overdraft-budget
subject: "an overdraft query with a fee (Z3Py)"
claim: "Z3 found no counterexample, so the property holds."
requirement: >-
  No transfer the service accepts leaves the sender below zero once the fee is taken, and the check that says so has
  answered: an unsat for the stated premises, not a result that ran out of budget or gave up.
scenario_question: "Does the recorded result establish the property for these values: did the check answer unsat, and do the values meet every premise?"
scheduled_after: [LAB-1, S1.L2]
kcs: [KC-1.three-answers, KC-1.unknown-fails-closed]
based_on:
  incident: "AWS's S3 Block Public Access: a policy whose SMT-based analysis returns unknown because of a time-out is treated as failing the check, so an inconclusive result fails closed instead of passing."
  date: "2020-11"
  date_marks: "the paper was presented at ESEC/FSE 2020"
  source: https://doi.org/10.1145/3368089.3409728

cases:
  - id: sound
    key: none
    description: "Sets a resource limit on the overdraft query so the CI step stays fast. Z3 found no counterexample."
    statement: |
      a, amount, rate, fee = Ints('a amount rate fee')
      s = Solver()
      s.set('rlimit', 5000000)
      s.add(a >= 0, amount > 0)
      s.add(rate >= 0, rate <= 500)                    # the rate in basis points
      s.add(fee * 10000 <= amount * rate)              # fee = floor(amount * rate / 10000)
      s.add(amount * rate < fee * 10000 + 10000)
      s.add(amount + fee <= a)                         # the guard: the sender covers amount and fee
      s.add(a - amount - fee < 0)                      # the violation: the sender ends below zero
      r = s.check()
      print(r, s.reason_unknown() if r == unknown else '')
    diff: |
      --- a/checks/fee_query.py
      +++ b/checks/fee_query.py
      @@ -1,3 +1,4 @@
       a, amount, rate, fee = Ints('a amount rate fee')
       s = Solver()
      +s.set('rlimit', 5000000)
       s.add(a >= 0, amount > 0)
    receipt: |
      z3 5.3.1
      [q1 violation] unsat
    restatement:
      run: RUN-z3-inconclusive-pairs
      scenarios: &sound-scenarios
        - id: s1
          text: "a = 1000, amount = 400, rate = 250"
          answer: true
          key_line: "[q1 s1 a=1000 amount=400 rate=250] established"
          why: "The check answered unsat, and these values meet every premise: the fee is 10 and the sender ends at 590."
        - id: s2
          text: "a = 100, amount = 100, rate = 100"
          answer: false
          key_line: "[q1 s2 a=100 amount=100 rate=100] not established (the values fail a premise)"
          why: "The fee is 1, so amount plus fee is 101, over the balance: the guard refuses it and the unsat says nothing about it."
        - id: s3
          text: "a = 5000, amount = 5000, rate = 0"
          answer: true
          key_line: "[q1 s3 a=5000 amount=5000 rate=0] established"
          why: "No fee, the whole balance: within the guard, and the unsat covers it."
        - id: s4
          text: "a = 10, amount = 20, rate = 0"
          answer: false
          key_line: "[q1 s4 a=10 amount=20 rate=0] not established (the values fail a premise)"
          why: "An overdraft the guard refuses: outside the premises."
    evidence: { type: restatement, scenarios: *sound-scenarios }
    key_run: RUN-z3-inconclusive-pairs
    key_lines: ["[q1 violation] unsat", "[q1 premises] sat"]
    explain: "Within its budget Z3 answered unsat, and the premises alone are sat, so the unsat is about real transfers. The honest stamp names the budget: unsat under rlimit 5000000, uncertified."

