        - id: s3
          text: "d = -1"
          answer: false
          key_line: "[q5 s3 d=-1] not established (the values fail a premise)"
          why: "d >= 0 leaves it out."
    evidence: { type: restatement, scenarios: *v2-sound-scenarios }
    key_run: RUN-z3-inconclusive-pairs
    key_lines: ["[q5 violation] unsat"]
    explain: "The rule ties every day directly to day 0, so one instantiation of the quantifier refutes the violation: Z3 answered unsat within the budget."

