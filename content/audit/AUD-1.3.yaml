  - id: v2-sound
    pair: v2
    operator: report-inconclusive-as-verdict
    artifact: fee-schedule
    key: none
    claim: "Z3 found no counterexample, so the property holds."
    description: "Encodes the fee schedule's rule and checks that no day has a negative fee. Z3 found no counterexample."
    statement: |
      fee_on = Function('fee_on', IntSort(), IntSort())
      k, d = Ints('k d')
      s = Solver()
      s.set('rlimit', 5000000)
      s.add(ForAll([k], Implies(k >= 0, fee_on(k) >= fee_on(0))))       # the schedule's rule
      s.add(fee_on(0) >= 0, d >= 0)
      s.add(fee_on(d) < 0)                     # the violation: some day's fee is negative
      r = s.check()
      print(r, s.reason_unknown() if r == unknown else '')
    diff: |
      --- a/checks/schedule_query.py
      +++ b/checks/schedule_query.py
      @@ -4,2 +4,3 @@
       s.set('rlimit', 5000000)
      +s.add(ForAll([k], Implies(k >= 0, fee_on(k) >= fee_on(0))))       # the schedule's rule
       s.add(fee_on(0) >= 0, d >= 0)
    receipt: |
      z3 5.3.1
      [q5 violation] unsat
    restatement:
      run: RUN-z3-inconclusive-pairs
      scenarios: &v2-sound-scenarios
        - id: s1
          text: "d = 0"
          answer: true
          key_line: "[q5 s1 d=0] established"
