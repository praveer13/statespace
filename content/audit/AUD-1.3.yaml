    key_lines: ["[q2 violation] unknown canceled"]
    explain: "The budget of 20000 ran out before Z3 decided the query: the raw answer is unknown, reason canceled. The agent read the absence of a model as the absence of a counterexample. Reported honestly it is [?] with its reason, and an unknown that guards a release fails closed."

variants:
  - id: v1-sound
    pair: v1
    operator: report-inconclusive-as-verdict
    artifact: shard-count
    key: none
    claim: "Z3 found no counterexample, so the property holds."
    description: "Adds config.toml's bounds to the shard-count query: no accepted configuration makes exactly 8 shards. Z3 found no counterexample."
    statement: |
      fanout, depth = Ints('fanout depth')     # the batcher makes fanout ** depth shards
      s = Solver()
      s.set('rlimit', 5000000)
      s.add(depth > 3)                         # config.toml: depth is at least 4
      s.add(fanout >= 2)                       # config.toml: fanout is at least 2
      s.add(fanout ** depth == 8)              # the violation: exactly 8 shards
      r = s.check()
      print(r, s.reason_unknown() if r == unknown else '')
    diff: |
      --- a/checks/shard_query.py
      +++ b/checks/shard_query.py
      @@ -3,2 +3,4 @@
       s.set('rlimit', 5000000)
      +s.add(depth > 3)                         # config.toml: depth is at least 4
      +s.add(fanout >= 2)                       # config.toml: fanout is at least 2
       s.add(fanout ** depth == 8)              # the violation: exactly 8 shards
    receipt: |
      z3 5.3.1
      [q3 violation] unsat
    restatement:
      run: RUN-z3-inconclusive-pairs
      scenarios: &v1-sound-scenarios
        - id: s1
          text: "fanout = 2, depth = 4"
          answer: true
          key_line: "[q3 s1 fanout=2 depth=4] established"
          why: "The check answered unsat and the values meet both premises: 16 shards, not 8."
        - id: s2
          text: "fanout = 3, depth = 5"
          answer: true
          key_line: "[q3 s2 fanout=3 depth=5] established"
          why: "Within the premises, and covered by the unsat."
        - id: s3
          text: "fanout = 1, depth = 6"
          answer: false
          key_line: "[q3 s3 fanout=1 depth=6] not established (the values fail a premise)"
          why: "fanout >= 2 leaves it out."
        - id: s4
          text: "fanout = 2, depth = 3"
          answer: false
          key_line: "[q3 s4 fanout=2 depth=3] not established (the values fail a premise)"
          why: "depth > 3 leaves it out; it would make exactly 8."
    evidence: { type: restatement, scenarios: *v1-sound-scenarios }
    key_run: RUN-z3-inconclusive-pairs
    key_lines: ["[q3 violation] unsat"]
    explain: "With fanout at least 2 and depth at least 4 Z3 decided the query: unsat, within the budget. The property holds for every configuration the premises admit."

