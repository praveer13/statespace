    evidence: { type: paired-states, load_bearing: ["statement:4", "diff:6", "diff:10"], reference: "RUN-lean-abort-blind [p7 store (10, 0) amt 5]: source Outcome.commit (5, 5), compiled Outcome.commit (15, -5); the statement's obs equal, outcomes not" }
    key_run: RUN-lean-abort-blind
    key_lines:
