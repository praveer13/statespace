        - { id: s2, text: "From (10, 0), transfer 5: both commit with (5, 5).", answer: false, key_line: "[q5 s2] not ruled out", why: "Equal outcomes: allowed." }
        - { id: s3, text: "From (10, 0), transfer 5: the source commits with (5, 5); the compiled code commits with (6, 4).", answer: true, key_line: "[q5 s3] ruled out", why: "Both balances differ." }
        - { id: s4, text: "From (3, 0), transfer 5: the source aborts with insufficient; the compiled code commits with (3, 0).", answer: true, key_line: "[q5 s4] ruled out", why: "obs sees the error code, so an abort and a commit differ." }
    evidence: { type: restatement, scenarios: *v2-sound-scenarios }
    key_run: RUN-lean-abort-blind
    key_lines:
      - { config: q5, line: "lean exit=0" }
      - { config: probe, line: "[p5 store (10, 0) amt 5] outcomes equal: true" }
    explain: "The dropped read loaded a2 into a register nothing used, so no write changes. obs sees the error code and both balances, and preservation builds under it."

