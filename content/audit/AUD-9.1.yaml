      - { config: probe, line: "[p7 store (10, 0) amt 5] the statement's obs equal: true" }
      - { config: probe, line: "[p7 store (10, 0) amt 5] outcomes equal: false" }
    explain: "obs keeps the error code and the total of the balances: conservation, not the transfer. The edit swaps the debit and the credit, so the money moves from a2 to a1. From (10, 0) with amount 5, the source leaves (5, 5) and the compiled code (15, -5); the totals are both 10, so the theorem builds."

