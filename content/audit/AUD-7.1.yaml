  - id: v2-flawed
    pair: v2
    operator: widen-or-narrow-observer
    artifact: slug-uniqueness
    medium: sql
    key: G10
    description: "Makes document slugs unique, then re-runs the pair check. frank's observations are equal in both worlds."
    statement: |
      CREATE TABLE documents (
        tenant text NOT NULL,
        slug   text NOT NULL UNIQUE,              -- one document per slug
        title  text NOT NULL
      );
      ALTER TABLE documents ENABLE ROW LEVEL SECURITY;
      CREATE POLICY own_tenant ON documents
        USING (tenant = current_setting('app.tenant'))
        WITH CHECK (tenant = current_setting('app.tenant'));

      -- the pair check: frank (Acme) runs his SELECT and his INSERT in world 1, where Birch has
      -- a private layoffs-memo, and in world 2, where it does not
      -- observe := the rows his SELECT returns
    diff: |
      --- a/db/documents.sql
      +++ b/db/documents.sql
      @@ -1,5 +1,5 @@
       CREATE TABLE documents (
         tenant text NOT NULL,
      -  slug   text NOT NULL,
      +  slug   text NOT NULL UNIQUE,              -- one document per slug
         title  text NOT NULL
       );
      @@ -11,3 +11,3 @@
       -- a private layoffs-memo, and in world 2, where it does not
      --- observe := what his client shows
      +-- observe := the rows his SELECT returns
    receipt: |
      [q5 w1] roadmap
      [q5 w2] roadmap
      [q5 pair] w1 and w2 observations equal
    receipt_run: RUN-pg-observer-pairs
    restatement:
      run: RUN-pg-observer-pairs
      scenarios:
        - { id: s1, text: "World 1: frank's SELECT returns roadmap, and his INSERT fails with 23505. World 2: the SELECT returns roadmap, and the INSERT succeeds.", answer: false, key_line: "[q5 s1] equal", why: "The observer keeps the rows only, and the rows are equal. frank's client sees an error in one world and success in the other." }
        - { id: s2, text: "World 1: the SELECT returns roadmap, and the INSERT succeeds. World 2: the SELECT returns q3-plan and roadmap, and the INSERT succeeds.", answer: true, key_line: "[q5 s2] apart", why: "The rows differ." }
        - { id: s3, text: "Both worlds: the SELECT returns roadmap, and the INSERT succeeds.", answer: false, key_line: "[q5 s3] equal", why: "Identical responses." }
    evidence:
      type: paired-states
      load_bearing: ["statement:3", "statement:13"]
      reference: "RUN-pg-rls-covert (cell3): frank's insert of slug layoffs-memo fails with 23505 against Birch's invisible row; in the paired world without that row it inserts"
    key_run: RUN-pg-rls-covert
    key_lines:
      - { config: cell3, line: 'psql:/q/S7.L4-cell3.sql:6: ERROR:  23505: duplicate key value violates unique constraint "documents_slug_key"' }
      - { config: cell3, line: "INSERT 0 1" }
    explain: "A unique constraint is checked against every row, including rows row security hides. frank's INSERT of layoffs-memo fails with 23505 in the world where Birch has that slug and succeeds where Birch does not, so the error tells him Birch's private document exists. The pair check compared his SELECT rows only, an observer blind to command outcomes. The PostgreSQL documentation names this covert channel."

