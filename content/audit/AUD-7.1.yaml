# AUD-7.1 · S7 · G10 Observer too weak (docs/AUDIT-DESK.md section 3.2). The format is content/audit/README.md's.
# Pair members are keyed by RUN-z3-count-channel (spine section 6.2's key run, SP-7.2): the same Search model, three
# document slots and the same Rel. The receipts, the variant pair and every step-3 scenario are keyed by
# RUN-z3-observer-pairs, recorded in the Bench image by content/audit/tools/record-keys-s7-s8.mjs. Its tags are
# neutral: q1 sound member, q2 flawed member, q3/q4 variant pair v1 (flawed/sound). Each statement is the case's
# query as observer.py runs it, with world(), rel() and count() as in that file.
id: AUD-7.1
stage: S7
class: G10
medium: z3py
artifact: search-result-count
subject: "a search view's noninterference check (Z3Py)"
claim: "Noninterference proved for the document view."
requirement: >-
  A client of an Acme user cannot tell apart two worlds that differ only in another tenant's private documents, by
  anything the response carries: its JSON body, its result count, its status code.
scenario_question: "Does the statement's observer tell these two responses apart?"
scheduled_after: [LAB-7, S7.L6]
kcs: [KC-7.observer-equivalence, KC-7.side-channels]
based_on:
  incident: "The PostgreSQL 18 row-security documentation warns that integrity checks such as unique constraints bypass row security, so an error can tell a user about rows they cannot see: a covert channel."
  date: "2026-10-23"
  date_marks: "the page was read"
  source: https://www.postgresql.org/docs/18/ddl-rowsecurity.html

cases:
  - id: sound
    key: none
    description: "Adds a result count to the search response, then re-runs the noninterference check. Z3 answers unsat."
    statement: |
      def search(W):                                       # Search(frank, "layoffs")
          hits  = count([And(e, r, m) for e, r, m in W])   # readable matches: the JSON body
          total = count([And(e, r, m) for e, r, m in W])   # the result count
          return hits, total

      def observe(hits, total):                            # what the proof compares
          return [hits, total]

      L, R = world('L'), world('R')                        # three document slots each
      s = Solver()
      s.add(rel(L, R))                                     # Rel: the worlds agree on what Acme may know
      s.add(Or([a != b for a, b in zip(observe(*search(L)), observe(*search(R)))]))
      print(s.check())
    diff: |
      --- a/checks/search_ni.py
      +++ b/checks/search_ni.py
      @@ -1,6 +1,7 @@
       def search(W):                                       # Search(frank, "layoffs")
           hits  = count([And(e, r, m) for e, r, m in W])   # readable matches: the JSON body
      -    return hits
      +    total = count([And(e, r, m) for e, r, m in W])   # the result count
      +    return hits, total

      -def observe(hits):                                   # what the proof compares
      -    return [hits]
      +def observe(hits, total):                            # what the proof compares
      +    return [hits, total]
    receipt: |
      z3 5.3.1 rlimit=5000000
      [q1 proof] unsat
      [q1 premises] sat
    restatement:
      run: RUN-z3-observer-pairs
      scenarios: &sound-scenarios
        - { id: s1, text: "Left: no hits, a count of 1. Right: no hits, a count of 0.", answer: true, key_line: "[q1 s1 L hits=0 total=1 R hits=0 total=0] apart", why: "The observer compares the count as well as the hits, and the counts differ." }
        - { id: s2, text: "Left: 1 hit, a count of 1. Right: no hits, a count of 0.", answer: true, key_line: "[q1 s2 L hits=1 total=1 R hits=0 total=0] apart", why: "The hits differ, and so do the counts." }
        - { id: s3, text: "Left: 1 hit, a count of 2. Right: 1 hit, a count of 2.", answer: false, key_line: "[q1 s3 L hits=1 total=2 R hits=1 total=2] equal", why: "Identical responses: no observer tells them apart." }
        - { id: s4, text: "Left: 2 hits, a count of 3. Right: 2 hits, a count of 2.", answer: true, key_line: "[q1 s4 L hits=2 total=3 R hits=2 total=2] apart", why: "Equal hits, different counts: this observer sees the count." }
    evidence: { type: restatement, scenarios: *sound-scenarios }
    key_run: RUN-z3-count-channel
    key_lines: ["self-composition, total counted after the filter: unsat", "premise witness: Rel and the lesson pair, layoffs-memo in one world only: sat"]
    explain: "The observer is the whole response, hits and count, and the count is taken after the read filter. Pairs that differ only in Birch's private documents give equal responses (unsat), and such pairs exist (the premise query is sat), so the unsat is about real pairs. Timing is outside both the model and the requirement; it would need its own check."

