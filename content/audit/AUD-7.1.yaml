variants:
  - id: v1-flawed
    pair: v1
    operator: widen-or-narrow-observer
    artifact: open-refusal-code
    key: G10
    description: "Adds a response code to Open, then re-runs the noninterference check. Z3 answers unsat."
    statement: |
      def open_doc(exists, mayread, body):                 # Open(frank, "layoffs-memo")
          code = If(Not(exists), 0, If(Not(mayread), 1, 2))   # 0 not_found, 1 forbidden, 2 page
          return code, If(code == 2, body, 0)

      def observe(code, body):                             # what the proof compares
          return [body]

      (L, R), rel = related()                              # exists, mayread, body in each world
      s = Solver()
      s.add(rel)                                           # Rel: the worlds agree on what Acme may know
      s.add(Or([a != b for a, b in zip(observe(*open_doc(*L)), observe(*open_doc(*R)))]))
      print(s.check())
    diff: |
      --- a/checks/open_ni.py
      +++ b/checks/open_ni.py
      @@ -1,6 +1,7 @@
       def open_doc(exists, mayread, body):                 # Open(frank, "layoffs-memo")
      -    return If(And(exists, mayread), body, 0)
      +    code = If(Not(exists), 0, If(Not(mayread), 1, 2))   # 0 not_found, 1 forbidden, 2 page
      +    return code, If(code == 2, body, 0)

      -def observe(body):                                   # what the proof compares
      -    return [body]
      +def observe(code, body):                             # what the proof compares
      +    return [body]
    receipt: |
      z3 5.3.1 rlimit=5000000
      [q3 proof] unsat
      [q3 premises] sat
    restatement:
      run: RUN-z3-observer-pairs
      scenarios:
        - { id: s1, text: "Left: code 1 (forbidden), no body. Right: code 0 (not_found), no body.", answer: false, key_line: "[q3 s1 L code=1 body=0 R code=0 body=0] equal", why: "The observer compares the body only, and both bodies are empty. The client sees two different codes." }
        - { id: s2, text: "Left: code 2, body 7. Right: code 2, body 7.", answer: false, key_line: "[q3 s2 L code=2 body=7 R code=2 body=7] equal", why: "Identical responses." }
        - { id: s3, text: "Left: code 2, body 7. Right: code 0 (not_found), no body.", answer: true, key_line: "[q3 s3 L code=2 body=7 R code=0 body=0] apart", why: "The bodies differ, so even this observer sees it." }
    evidence:
      type: paired-states
      load_bearing: ["statement:2", "statement:6"]
      reference: "RUN-z3-observer-pairs [q3 client]: code L=0 R=1, body L=0 R=0"
    key_run: RUN-z3-observer-pairs
    key_lines: ["[q3 proof] unsat", "[q3 premises] sat", "[q3 client] sat | code L=0 R=1 | body L=0 R=0"]
    explain: "Open now answers forbidden for a document that exists and not_found for one that does not, but the proof compares bodies only. Compare the whole response and Z3 finds the pair: code 0 in one world and 1 in the other, both bodies empty. The code tells frank whether Birch's layoffs-memo exists."

