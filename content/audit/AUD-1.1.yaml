# AUD-1.1 · S1 · G2 Vacuous premise (docs/AUDIT-DESK.md section 3.2). The format is content/audit/README.md's.
# Pair members are keyed by RUN-z3-vacuous-unsat (spine section 6.2's key run); the receipts the Desk shows, the two
# variant pairs and every step-3 scenario are keyed by RUN-z3-vacuous-variants, recorded in the Bench image. That
# run tags its queries q1 to q6 so a receipt line never names a case's key: q1 sound member, q2 flawed member,
# q3/q4 variant pair v1 (flawed/sound), q5/q6 variant pair v2 (sound/flawed).
id: AUD-1.1
stage: S1
class: G2
medium: z3py
artifact: guarded-transfer
subject: "a transfer query (Z3Py)"
claim: "unsat, therefore safe."
requirement: >-
  Every transfer the service accepts leaves the sender at zero or above, and the service does accept transfers: a
  positive amount, up to the sender's balance, within any configured cap.
scenario_question: "Does the statement speak about this transfer: do these values meet every premise it checks?"
scheduled_after: [LAB-1.3]
kcs: [KC-1.non-vacuity-check, KC-1.implication-vacuity]
based_on:
  incident: "PutnamBench issue #361: a readability refactor lost parentheses, an implication absorbed a chain of conjunctions, and the hypotheses became inconsistent; automated hypothesis-redundancy checks found it."
  date: "2026-10-12"
  date_marks: "the issue was opened"
  source: https://github.com/trishullab/PutnamBench/issues/361

cases:
  - id: sound
    key: none
    description: "Adds the per-transfer cap from config.toml to the query. Z3 still answers unsat: no accepted transfer overdraws the sender."
    statement: |
      MAX_TRANSFER = 100      # config.toml: the per-transfer cap
      a, b, amount = Ints('a b amount')
      s = Solver()
      s.add(a >= 0, b >= 0)
      s.add(amount > 0)
      s.add(amount <= MAX_TRANSFER)
      s.add(amount <= a)
      s.add(a - amount < 0)   # the violation: the sender ends below zero
      print(s.check())
    diff: |
      --- a/checks/transfer_query.py
      +++ b/checks/transfer_query.py
      @@ -1,3 +1,4 @@
      +MAX_TRANSFER = 100      # config.toml: the per-transfer cap
       a, b, amount = Ints('a b amount')
       s = Solver()
       s.add(a >= 0, b >= 0)
      @@ -5,2 +6,3 @@
       s.add(amount > 0)
      +s.add(amount <= MAX_TRANSFER)
       s.add(amount <= a)
    receipt: |
      z3 5.3.1 rlimit=5000000
      [q1 violation] unsat
    restatement:
      run: RUN-z3-vacuous-variants
      scenarios: &sound-scenarios
        - { id: s1, text: "a = 10, b = 0, amount = 3", answer: true, key_line: "[q1 s1 a=10 b=0 amount=3] sat (covered)", why: "Every premise holds, so the unsat speaks about this transfer: the sender ends at 7." }
        - { id: s2, text: "a = 10, b = 0, amount = 150", answer: false, key_line: "[q1 s2 a=10 b=0 amount=150] unsat (not covered)", why: "150 is over the cap of 100, so the query never considers it." }
        - { id: s3, text: "a = 2, b = 0, amount = 5", answer: false, key_line: "[q1 s3 a=2 b=0 amount=5] unsat (not covered)", why: "The guard amount <= a excludes it: an overdraft the service refuses is outside the statement." }
        - { id: s4, text: "a = 500, b = 7, amount = 100", answer: true, key_line: "[q1 s4 a=500 b=7 amount=100] sat (covered)", why: "Exactly at the cap, and within the balance: covered." }
    evidence: { type: restatement, scenarios: *sound-scenarios }
    key_run: RUN-z3-vacuous-unsat
    key_lines: ["[max100_guarded_violation] unsat", "[max100_guarded_premises] sat"]
    explain: "The premises are satisfiable (a = 1, amount = 1 meets them all), so the unsat is about real transfers: every accepted transfer of 1 to 100 within the sender's balance leaves the sender at zero or above."

  - id: flawed
    key: { class: G2, also: [G1] }
    description: "Adds the per-transfer cap from config.toml to the query. Z3 still answers unsat: no accepted transfer overdraws the sender."
    statement: |
      MAX_TRANSFER = 0        # config.toml: the per-transfer cap
      a, b, amount = Ints('a b amount')
      s = Solver()
      s.add(a >= 0, b >= 0)
      s.add(amount > 0)
      s.add(amount <= MAX_TRANSFER)
      s.add(amount <= a)
      s.add(a - amount < 0)   # the violation: the sender ends below zero
      print(s.check())
    diff: |
      --- a/checks/transfer_query.py
      +++ b/checks/transfer_query.py
      @@ -1,3 +1,4 @@
      +MAX_TRANSFER = 0        # config.toml: the per-transfer cap
       a, b, amount = Ints('a b amount')
       s = Solver()
       s.add(a >= 0, b >= 0)
      @@ -5,2 +6,3 @@
       s.add(amount > 0)
      +s.add(amount <= MAX_TRANSFER)
       s.add(amount <= a)
    receipt: |
      z3 5.3.1 rlimit=5000000
      [q2 violation] unsat
    restatement:
      run: RUN-z3-vacuous-variants
      scenarios:
        - { id: s1, text: "a = 10, b = 0, amount = 3", answer: false, key_line: "[q2 s1 a=10 b=0 amount=3] unsat (not covered)", why: "amount > 0 and amount <= 0 cannot both hold, so no transfer meets the premises, this one included." }
        - { id: s2, text: "a = 10, b = 0, amount = 150", answer: false, key_line: "[q2 s2 a=10 b=0 amount=150] unsat (not covered)", why: "Over the cap, and the premises admit no transfer anyway." }
        - { id: s3, text: "a = 2, b = 0, amount = 5", answer: false, key_line: "[q2 s3 a=2 b=0 amount=5] unsat (not covered)", why: "Refused by the guard, and the premises admit no transfer anyway." }
        - { id: s4, text: "a = 500, b = 7, amount = 100", answer: false, key_line: "[q2 s4 a=500 b=7 amount=100] unsat (not covered)", why: "With the cap at 0 the premises admit no transfer, so the unsat says nothing about this one." }
    evidence: { type: declaration, load_bearing: ["statement:1", "statement:5", "statement:6"] }
    key_run: RUN-z3-vacuous-unsat
    key_lines: ["[max0_guarded_violation] unsat", "[max0_guarded_premises] unsat", "[max0_guarded_core] unsat unsat_core=['amount_le_max_transfer', 'amount_positive']"]
    explain: "With MAX_TRANSFER = 0, amount > 0 and amount <= MAX_TRANSFER contradict each other: the premises alone are unsat, so the violation query is unsat for every property, true or absurd. The unsat is true of nothing."

variants:
  - id: v1-flawed
    pair: v1
    operator: add-contradictory-hypothesis
    artifact: guarded-transfer-refactor
    key: { class: G2, also: [G1] }
    description: "Refactor: inlines the guard helper's conditions into the query. Still unsat."
    statement: |
      a, b, amount = Ints('a b amount')
      s = Solver()
      s.add(a >= 0, b >= 0)
      s.add(amount > 0)
      s.add(amount <= a)
      s.add(a < amount)         # from the inlined guard helper
      s.add(a - amount < 0)     # the violation: the sender ends below zero
      print(s.check())
    diff: |
      --- a/checks/transfer_query.py
      +++ b/checks/transfer_query.py
      @@ -4,3 +4,4 @@
       s.add(amount > 0)
       s.add(amount <= a)
      +s.add(a < amount)         # from the inlined guard helper
       s.add(a - amount < 0)     # the violation: the sender ends below zero
    receipt: |
      z3 5.3.1 rlimit=5000000
      [q3 violation] unsat
    restatement:
      run: RUN-z3-vacuous-variants
      scenarios:
        - { id: s1, text: "a = 10, b = 0, amount = 3", answer: false, key_line: "[q3 s1 a=10 b=0 amount=3] unsat (not covered)", why: "amount <= a and a < amount cannot both hold: no transfer meets the premises." }
        - { id: s2, text: "a = 2, b = 0, amount = 5", answer: false, key_line: "[q3 s2 a=2 b=0 amount=5] unsat (not covered)", why: "It fails amount <= a, and no transfer meets the premises anyway." }
        - { id: s3, text: "a = 4, b = 4, amount = 4", answer: false, key_line: "[q3 s3 a=4 b=4 amount=4] unsat (not covered)", why: "a < amount fails at 4 and 4; nothing meets both guard lines." }
    evidence: { type: declaration, load_bearing: ["statement:5", "statement:6"] }
    key_run: RUN-z3-vacuous-variants
    key_lines: ["[q3 violation] unsat", "[q3 premises] unsat", "[q3 core] unsat_core=['a < amount', 'amount <= a']"]
    explain: "The inlined line a < amount contradicts amount <= a. The premises alone are unsat, and so is every query built on them."

  - id: v1-sound
    pair: v1
    operator: add-contradictory-hypothesis
    artifact: guarded-transfer-refactor
    key: none
    description: "Refactor: inlines the guard helper's conditions into the query. Still unsat."
    statement: |
      a, b, amount = Ints('a b amount')
      s = Solver()
      s.add(a >= 0, b >= 0)
      s.add(amount > 0)
      s.add(amount <= a)
      s.add(amount >= 1)        # from the inlined guard helper
      s.add(a - amount < 0)     # the violation: the sender ends below zero
      print(s.check())
    diff: |
      --- a/checks/transfer_query.py
      +++ b/checks/transfer_query.py
      @@ -4,3 +4,4 @@
       s.add(amount > 0)
       s.add(amount <= a)
      +s.add(amount >= 1)        # from the inlined guard helper
       s.add(a - amount < 0)     # the violation: the sender ends below zero
    receipt: |
      z3 5.3.1 rlimit=5000000
      [q4 violation] unsat
    restatement:
      run: RUN-z3-vacuous-variants
      scenarios: &v1-sound-scenarios
        - { id: s1, text: "a = 10, b = 0, amount = 3", answer: true, key_line: "[q4 s1 a=10 b=0 amount=3] sat (covered)", why: "Every premise holds; the inlined amount >= 1 is implied by amount > 0 over integers." }
        - { id: s2, text: "a = 2, b = 0, amount = 5", answer: false, key_line: "[q4 s2 a=2 b=0 amount=5] unsat (not covered)", why: "The guard amount <= a refuses it." }
        - { id: s3, text: "a = 4, b = 4, amount = 4", answer: true, key_line: "[q4 s3 a=4 b=4 amount=4] sat (covered)", why: "The whole balance, within the guard: covered." }
    evidence: { type: restatement, scenarios: *v1-sound-scenarios }
    key_run: RUN-z3-vacuous-variants
    key_lines: ["[q4 violation] unsat", "[q4 premises] sat"]
    explain: "The inlined line is redundant: over integers, amount > 0 already implies amount >= 1. The premises stay satisfiable and the unsat keeps its meaning."

  - id: v2-sound
    pair: v2
    operator: add-contradictory-hypothesis
    artifact: daily-limit-withdrawal
    key: none
    claim: "unsat, therefore safe."
    description: "Moves the daily-limit check into the withdrawal query. Z3 answers unsat: no withdrawal overdraws the account."
    statement: |
      LIMIT = 500                              # the daily withdrawal limit
      bal, w, amount = Ints('bal w amount')    # w: withdrawn so far today
      s = Solver()
      s.add(bal >= 0, w >= 0)
      s.add(amount > 0)
      s.add(amount <= bal)
      s.add(w + amount <= LIMIT)
      s.add(w <= LIMIT)                        # the day's limit check
      s.add(bal - amount < 0)                  # the violation: the balance ends below zero
      print(s.check())
    diff: |
      --- a/checks/withdraw_query.py
      +++ b/checks/withdraw_query.py
      @@ -6,2 +6,3 @@
       s.add(w + amount <= LIMIT)
      +s.add(w <= LIMIT)                        # the day's limit check
       s.add(bal - amount < 0)                  # the violation: the balance ends below zero
    receipt: |
      z3 5.3.1 rlimit=5000000
      [q5 violation] unsat
    restatement:
      run: RUN-z3-vacuous-variants
      scenarios: &v2-sound-scenarios
        - { id: s1, text: "bal = 100, w = 0, amount = 50", answer: true, key_line: "[q5 s1 bal=100 w=0 amount=50] sat (covered)", why: "Within the balance and the day's limit: covered." }
        - { id: s2, text: "bal = 100, w = 480, amount = 50", answer: false, key_line: "[q5 s2 bal=100 w=480 amount=50] unsat (not covered)", why: "480 + 50 is over the limit of 500, so the query never considers it." }
        - { id: s3, text: "bal = 20, w = 0, amount = 50", answer: false, key_line: "[q5 s3 bal=20 w=0 amount=50] unsat (not covered)", why: "More than the balance: refused by amount <= bal." }
        - { id: s4, text: "bal = 1000, w = 499, amount = 1", answer: true, key_line: "[q5 s4 bal=1000 w=499 amount=1] sat (covered)", why: "Reaches the limit exactly: covered." }
    evidence: { type: restatement, scenarios: *v2-sound-scenarios }
    key_run: RUN-z3-vacuous-variants
    key_lines: ["[q5 violation] unsat", "[q5 premises] sat"]
    explain: "w <= LIMIT is implied by w + amount <= LIMIT with amount > 0, so it changes nothing: the premises stay satisfiable (bal = 1, w = 0, amount = 1)."

  - id: v2-flawed
    pair: v2
    operator: add-contradictory-hypothesis
    artifact: daily-limit-withdrawal
    key: { class: G2, also: [G1] }
    claim: "unsat, therefore safe."
    description: "Moves the daily-limit check into the withdrawal query. Z3 answers unsat: no withdrawal overdraws the account."
    statement: |
      LIMIT = 500                              # the daily withdrawal limit
      bal, w, amount = Ints('bal w amount')    # w: withdrawn so far today
      s = Solver()
      s.add(bal >= 0, w >= 0)
      s.add(amount > 0)
      s.add(amount <= bal)
      s.add(w + amount <= LIMIT)
      s.add(w >= LIMIT)                        # the day's limit check
      s.add(bal - amount < 0)                  # the violation: the balance ends below zero
      print(s.check())
    diff: |
      --- a/checks/withdraw_query.py
      +++ b/checks/withdraw_query.py
      @@ -6,2 +6,3 @@
       s.add(w + amount <= LIMIT)
      +s.add(w >= LIMIT)                        # the day's limit check
       s.add(bal - amount < 0)                  # the violation: the balance ends below zero
    receipt: |
      z3 5.3.1 rlimit=5000000
      [q6 violation] unsat
    restatement:
      run: RUN-z3-vacuous-variants
      scenarios:
        - { id: s1, text: "bal = 100, w = 0, amount = 50", answer: false, key_line: "[q6 s1 bal=100 w=0 amount=50] unsat (not covered)", why: "w >= 500 fails at w = 0; and no withdrawal meets the premises anyway." }
        - { id: s2, text: "bal = 100, w = 480, amount = 50", answer: false, key_line: "[q6 s2 bal=100 w=480 amount=50] unsat (not covered)", why: "Over the limit, and no withdrawal meets the premises anyway." }
        - { id: s3, text: "bal = 20, w = 0, amount = 50", answer: false, key_line: "[q6 s3 bal=20 w=0 amount=50] unsat (not covered)", why: "More than the balance, and no withdrawal meets the premises anyway." }
        - { id: s4, text: "bal = 1000, w = 499, amount = 1", answer: false, key_line: "[q6 s4 bal=1000 w=499 amount=1] unsat (not covered)", why: "w >= 500 fails at 499. Any w that passes it leaves no room for a positive amount." }
    evidence: { type: declaration, load_bearing: ["statement:5", "statement:7", "statement:8"] }
    key_run: RUN-z3-vacuous-variants
    key_lines: ["[q6 violation] unsat", "[q6 premises] unsat", "[q6 core] unsat_core=['amount > 0', 'w + amount <= 500', 'w >= 500']"]
    explain: "The check is written the wrong way round: w >= LIMIT, beside w + amount <= LIMIT and amount > 0, leaves no withdrawal at all. The premises alone are unsat."
