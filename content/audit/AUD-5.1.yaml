  - id: v3-sound
    pair: v3
    operator: restate-property-kind
    artifact: settlement-retries
    key: none
    claim: "TLC finds no deadlock and no error: every submitted batch settles or fails."
    description: "Adds the TLC configuration for the settlement batch model. TLC finds no deadlock and no error."
    statement: |
      ---- MODULE Batch ----
      EXTENDS Naturals
      VARIABLES st, tries
      vars == <<st, tries>>
      Init == st = "open" /\ tries = 0
      Submit == st = "open"      /\ st' = "submitted" /\ UNCHANGED tries
      Fail   == st = "submitted" /\ tries < 2 /\ st' = "open" /\ tries' = tries + 1
      Settle == st = "submitted" /\ st' = "settled"   /\ UNCHANGED tries
      GiveUp == st = "submitted" /\ tries = 2 /\ st' = "failed" /\ UNCHANGED tries
      Done   == st \in {"settled", "failed"} /\ UNCHANGED vars
      Next == Submit \/ Fail \/ Settle \/ GiveUp \/ Done
      Spec == Init /\ [][Next]_vars /\ WF_vars(Submit) /\ WF_vars(Settle \/ GiveUp)
      TriesBound == tries <= 2
      SubmittedLeadsToEnd == (st = "submitted") ~> (st \in {"settled", "failed"})
      ====
      \* Batch.cfg, checked with TLC's default flags
      SPECIFICATION Spec
      PROPERTY SubmittedLeadsToEnd
    diff: |
      --- /dev/null
      +++ b/specs/Batch.cfg
      @@ -0,0 +1,2 @@
      +SPECIFICATION Spec
      +PROPERTY SubmittedLeadsToEnd
    receipt: |
      [q7] Model checking completed. No error has been found.
      [q7] 14 states generated, 10 distinct states found, 0 states left on queue.
    restatement:
      run: RUN-tlc-kind-exemplars
      scenarios: &v3-sound-scenarios
        - { id: t1, text: "The fairness conditions are deleted from Spec", answer: true, key_line: "[q7 t1] Error: Temporal property SubmittedLeadsToEnd was violated.", why: "Without fairness a submitted batch may wait forever: the leads-to property catches it." }
        - { id: t2, text: "Fail no longer counts its tries (tries' = tries)", answer: true, key_line: "[q7 t2] Error: Temporal property SubmittedLeadsToEnd was violated.", why: "Fail can now repeat forever, and Settle is enabled only between failures: the property catches the loop." }
        - { id: t3, text: "Fail is allowed while tries < 3", answer: false, key_line: "[q7 t3] Model checking completed. No error has been found.", why: "Settle stays enabled once Fail runs out, so every submitted batch still ends: no error." }
    evidence: { type: restatement, scenarios: *v3-sound-scenarios }
    key_run: RUN-tlc-kind-exemplars
    key_lines: ["[q7] Model checking completed. No error has been found.", "[q7 t2] Error: Temporal property SubmittedLeadsToEnd was violated."]
    explain: "SubmittedLeadsToEnd is a leads-to property, checked as one: a batch that loops between Submit and Fail, or stays submitted forever, would be a counterexample. With weak fairness on Submit and on Settle or GiveUp there is none in 10 distinct states."

