  - id: v5-sound
    pair: v5
    operator: restate-property-kind
    artifact: refund-request
    key: none
    claim: "TLC finds no deadlock, so every refund request is answered."
    description: "Adds the TLC configuration for the refund request model. TLC finds no deadlock and no error."
    statement: |
      ---- MODULE RefundAsk ----
      EXTENDS Naturals
      VARIABLES st, n
      vars == <<st, n>>
      Init == st = "open" /\ n = 0
      Ask    == st = "open"  /\ st' = "asked" /\ UNCHANGED n
      Info   == st = "asked" /\ n < 3 /\ st' = "open" /\ n' = n + 1
      Grant  == st = "asked" /\ st' = "granted" /\ UNCHANGED n
      Refuse == st = "asked" /\ st' = "refused" /\ UNCHANGED n
      Done   == st \in {"granted", "refused"} /\ UNCHANGED vars
      Next == Ask \/ Info \/ Grant \/ Refuse \/ Done
      Spec == Init /\ [][Next]_vars /\ WF_vars(Ask) /\ WF_vars(Grant \/ Refuse)
      Answered == <>(st \in {"granted", "refused"})
      ====
      \* RefundAsk.cfg, checked with TLC's default flags
      SPECIFICATION Spec
      PROPERTY Answered
    diff: |
      --- /dev/null
      +++ b/specs/RefundAsk.cfg
      @@ -0,0 +1,2 @@
      +SPECIFICATION Spec
      +PROPERTY Answered
    receipt: |
      [q11] Model checking completed. No error has been found.
      [q11] 24 states generated, 16 distinct states found, 0 states left on queue.
    restatement:
      run: RUN-tlc-kind-exemplars
      scenarios: &v5-sound-scenarios
        - { id: t1, text: "The fairness conditions are deleted from Spec", answer: true, key_line: "[q11 t1] Error: Temporal property Answered was violated.", why: "Without fairness a request may wait forever: the temporal property catches it." }
        - { id: t2, text: "Done is deleted from Next", answer: true, key_line: "[q11 t2] Error: Deadlock reached.", why: "The answered states have no next step: TLC stops at a deadlock." }
        - { id: t3, text: "Info no longer counts its requests (n' = n)", answer: true, key_line: "[q11 t3] Error: Temporal property Answered was violated.", why: "Ask and Info can now loop forever, with Grant and Refuse enabled only between them: the property catches the loop." }
    evidence: { type: restatement, scenarios: *v5-sound-scenarios }
