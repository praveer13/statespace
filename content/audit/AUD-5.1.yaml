    key_lines: ["[q11] Model checking completed. No error has been found.", "[q11 t3] Error: Temporal property Answered was violated."]
    explain: "Answered is checked as a temporal property, so a request that loops or waits forever would show up as a counterexample. With weak fairness on Ask and on Grant or Refuse there is none in 16 distinct states."

