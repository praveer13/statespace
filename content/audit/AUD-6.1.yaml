# AUD-6.1 · S6 · G11 Test presented as proof (docs/AUDIT-DESK.md section 3.2). The format is content/audit/README.md's.
# Every case is keyed by RUN-drt-transfers, the spine's key run: the compiled transfer on PostgreSQL 18.6 against the
# reference semantics, 200 seeded commands, under each observer and for the shipped compiler and five mutants (m1-m5),
# then the one-command fixture test. The course's reference interpreter is not built yet; the run's reference.py
# stands in for it, and its statements show the run's own code. Tags are neutral: q1-q4 observers, m1-m5 mutants.
id: AUD-6.1
stage: S6
class: G11
medium: sql
artifact: differential-suite
subject: "a differential test of the compiled transfer (Python, SQL)"
claim: "The compiled transfer matches the reference: every generated command agrees."
requirement: >-
  The receipt states what the differential suite establishes and no more: which commands ran, how many, from which
  generator, on which engine, and the stamp the method earns.
scenario_question: "Does the run's output, as printed, establish this?"
scheduled_after: [LAB-6.4]
kcs: [KC-6.differential-testing]
based_on:
  incident: "CIDR 2026: about 32% of the SQL rewrites produced by language models changed the query's results."
  date: "2026-01"
  date_marks: "the conference (CIDR 2026)"
  source: https://www.cidrdb.org/cidr2026/papers/p33-narasayya.pdf

cases:
  - id: sound
    key: none
    description: "Adds the differential suite's result to the receipt table: 200 of 200 generated commands agree."
    statement: |
      # tests/drt.py: the compiled transfer on PostgreSQL 18.6 against reference.py
      N, SEED = 200, 7
      IDS = [1, 2, 3, 9]  # 9 is no account

      def agree_q1(m, d):
          return (m.outcome, m.balances) == (d.outcome, d.balances)

      # RECEIPTS.md
      | compiled transfer | tests/drt.py, n = 200, seed 7 | [T] · n = 200 · seed 7 · ok 22, refused 178 · PostgreSQL 18.6 |
    diff: |
      --- a/RECEIPTS.md
      +++ b/RECEIPTS.md
      @@ -4,1 +4,2 @@
       | NoOverspend | Withdraw.cfg | [M] · constants · complete |
      +| compiled transfer | tests/drt.py, n = 200, seed 7 | [T] · n = 200 · seed 7 · ok 22, refused 178 · PostgreSQL 18.6 |
    receipt: |
      server: PostgreSQL 18.6 (Debian 18.6-1.pgdg13+2) on x86_64-pc-linux-gnu, compiled by gcc (Debian 14.2.0-19) 14.2.0, 64-bit
      generator n=200 seed=7: ok 22, insufficient 46, no-such-account 74, self-transfer 27, bad-amount 31
      [q1 shipped] agree 200 of 200
    restatement:
      run: RUN-drt-transfers
      scenarios: &scenarios
        - { id: s1, text: "The 200 generated commands agree, in outcome class and in balances", answer: true, key_line: "[q1 shipped] agree 200 of 200", why: "That is what the suite ran and what it printed." }
        - { id: s2, text: "Every transfer command agrees", answer: false, key_line: "generator n=200 seed=7: ok 22, insufficient 46, no-such-account 74, self-transfer 27, bad-amount 31", why: "200 commands from one seed, 22 of them applied: a sample, not every command." }
        - { id: s3, text: "A compiled guard written as > instead of >= would make this suite disagree", answer: false, key_line: "[q1 m3] agree 200 of 200", why: "The run tried that mutant: it agrees on all 200, because no generated command moved a sender's whole balance." }
        - { id: s4, text: "A compiled transfer that reports success when it updated no rows would make this suite disagree", answer: true, key_line: "[q1 m1] agree 22 of 200", why: "The outcome-class observer sees it on the first command, a transfer from account 9." }
    evidence: { type: restatement, scenarios: *scenarios }
    key_run: RUN-drt-transfers
    key_lines: ["[q1 shipped] agree 200 of 200"]
    explain: "Differential testing with no disagreement earns [T] with n, the generator's statistics and the engine named, which is the stamp in the table. The run also shows what that stamp leaves open: a boundary mutant (m3) agrees on all 200 commands."

  - id: flawed
    key: G11
    description: "Adds the differential suite's result to the receipt table: 200 of 200 generated commands agree."
    statement: |
      # tests/drt.py: the compiled transfer on PostgreSQL 18.6 against reference.py
      N, SEED = 200, 7
      IDS = [1, 2, 3, 9]  # 9 is no account

      def agree_q1(m, d):
          return (m.outcome, m.balances) == (d.outcome, d.balances)

      # RECEIPTS.md
      | compiled transfer | tests/drt.py, n = 200, seed 7 | [P] · the compiled transfer equals the reference on every command |
    diff: |
      --- a/RECEIPTS.md
      +++ b/RECEIPTS.md
      @@ -4,1 +4,2 @@
       | NoOverspend | Withdraw.cfg | [M] · constants · complete |
      +| compiled transfer | tests/drt.py, n = 200, seed 7 | [P] · the compiled transfer equals the reference on every command |
    receipt: |
      server: PostgreSQL 18.6 (Debian 18.6-1.pgdg13+2) on x86_64-pc-linux-gnu, compiled by gcc (Debian 14.2.0-19) 14.2.0, 64-bit
      generator n=200 seed=7: ok 22, insufficient 46, no-such-account 74, self-transfer 27, bad-amount 31
      [q1 shipped] agree 200 of 200
    restatement:
      run: RUN-drt-transfers
      scenarios: *scenarios
    evidence: { type: verdict-line, load_bearing: ["statement:9", "diff:5", "receipt:3"] }
    key_run: RUN-drt-transfers
    key_lines: ["[q1 shipped] agree 200 of 200", "[q1 m3] agree 200 of 200"]
    explain: "200 seeded commands on one engine are a test. [P] claims every command, which no number of agreeing runs establishes: in this very run a compiler with its guard written as > agrees on all 200 too (m3). The method earns [T] · n = 200 · seed 7, with the generator's statistics."

variants:
  - id: v1-sound
    pair: v1
    operator: replace-proof-by-single-db-test
    artifact: fixture-test
    key: none
    claim: "The compiled transfer matches the reference: the fixture test agrees."
    description: "Adds the fixture test's result to the receipt table."
    statement: |
      # tests/drt.py: the fixture test, one command on the fixture database
      fixture, cmd = {1: 100, 2: 50}, (1, 2, 30)
      o, _, b = reference.transfer(dict(fixture), *cmd)
      m = Result('ok' if o == 'ok' else 'zero-rows', b)
      d = db_run(conn, compiled.SHIPPED, compiled.outcome_of, [cmd], fixture)[0]

      # RECEIPTS.md
      | compiled transfer | tests/drt.py, fixture test | [T] · 1 instance · fixture {1: 100, 2: 50} · PostgreSQL 18.6 |
    diff: |
      --- a/RECEIPTS.md
      +++ b/RECEIPTS.md
      @@ -4,1 +4,2 @@
       | NoOverspend | Withdraw.cfg | [M] · constants · complete |
      +| compiled transfer | tests/drt.py, fixture test | [T] · 1 instance · fixture {1: 100, 2: 50} · PostgreSQL 18.6 |
    receipt: |
      [fixture] transfer(1 -> 2, 30) on {1: 100, 2: 50}: reference ok {1: 70, 2: 80}, database ok {1: 70, 2: 80}; agree 1 of 1
    restatement:
      run: RUN-drt-transfers
      scenarios: &v1-scenarios
        - { id: f1, text: "transfer(1 -> 2, 30) on the fixture gives the same outcome and balances in both", answer: true, key_line: "[fixture] transfer(1 -> 2, 30) on {1: 100, 2: 50}: reference ok {1: 70, 2: 80}, database ok {1: 70, 2: 80}; agree 1 of 1", why: "Both apply it: 70 and 80." }
        - { id: f2, text: "A transfer from an account that does not exist gives the same outcome in both", answer: false, key_line: "[fixture] transfer(1 -> 2, 30) on {1: 100, 2: 50}: reference ok {1: 70, 2: 80}, database ok {1: 70, 2: 80}; agree 1 of 1", why: "The test ran one command, from account 1; no other command was run." }
        - { id: f3, text: "Every transfer agrees, on any database contents", answer: false, key_line: "[fixture] transfer(1 -> 2, 30) on {1: 100, 2: 50}: reference ok {1: 70, 2: 80}, database ok {1: 70, 2: 80}; agree 1 of 1", why: "One instance on one database says nothing about the others." }
    evidence: { type: restatement, scenarios: *v1-scenarios }
    key_run: RUN-drt-transfers
    key_lines: ["[fixture] transfer(1 -> 2, 30) on {1: 100, 2: 50}: reference ok {1: 70, 2: 80}, database ok {1: 70, 2: 80}; agree 1 of 1"]
    explain: "One command on one database, stamped as what it is: [T] · 1 instance, with the fixture named."

  - id: v1-flawed
    pair: v1
    operator: replace-proof-by-single-db-test
    artifact: fixture-test
    key: G11
    claim: "The compiled transfer matches the reference: the fixture test agrees."
    description: "Adds the fixture test's result to the receipt table."
    statement: |
      # tests/drt.py: the fixture test, one command on the fixture database
      fixture, cmd = {1: 100, 2: 50}, (1, 2, 30)
      o, _, b = reference.transfer(dict(fixture), *cmd)
      m = Result('ok' if o == 'ok' else 'zero-rows', b)
      d = db_run(conn, compiled.SHIPPED, compiled.outcome_of, [cmd], fixture)[0]

      # RECEIPTS.md
      | compiled transfer | tests/drt.py, fixture test | [P] · the compiled transfer equals the reference |
    diff: |
      --- a/RECEIPTS.md
      +++ b/RECEIPTS.md
      @@ -4,1 +4,2 @@
       | NoOverspend | Withdraw.cfg | [M] · constants · complete |
      +| compiled transfer | tests/drt.py, fixture test | [P] · the compiled transfer equals the reference |
    receipt: |
      [fixture] transfer(1 -> 2, 30) on {1: 100, 2: 50}: reference ok {1: 70, 2: 80}, database ok {1: 70, 2: 80}; agree 1 of 1
    restatement:
      run: RUN-drt-transfers
      scenarios: *v1-scenarios
    evidence: { type: verdict-line, load_bearing: ["statement:8", "diff:5", "receipt:1"] }
    key_run: RUN-drt-transfers
    key_lines: ["[fixture] transfer(1 -> 2, 30) on {1: 100, 2: 50}: reference ok {1: 70, 2: 80}, database ok {1: 70, 2: 80}; agree 1 of 1", "[q1 m1] agree 22 of 200"]
    explain: "One command on one fixture database, stamped [P]. The fixture's one command is a transfer the compiler applies, so it never exercises a refusal; in the same run a compiler that reports success on zero rows (m1) agrees on only 22 of 200 generated commands. One instance earns [T] · 1 instance, never [P]."
