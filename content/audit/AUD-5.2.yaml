        - { id: s2, text: "The provider answers busy every time it can: Capture is never enabled", answer: true, key_line: "[q5 s2] Model checking completed. No error has been found.", why: "Timeout resolves the hold, however often the provider answers busy." }
        - { id: s3, text: "The provider captures every hold it is sent: Busy is never enabled", answer: true, key_line: "[q5 s3] Model checking completed. No error has been found.", why: "Captured or timed out, every hold resolves." }
        - { id: s4, text: "The service never times out: Timeout is never enabled", answer: false, key_line: "[q5 s4] Error: Temporal property EventuallyResolves was violated.", why: "The result rests on the service's own Timeout, and says so in its one fairness conjunct." }
    evidence: { type: restatement, scenarios: *v2-sound-scenarios }
    key_run: RUN-tlc-budget-fairness
    key_lines: ["[q5] Model checking completed. No error has been found.", "[q5 s1] Model checking completed. No error has been found.", "[q5 s2] Model checking completed. No error has been found."]
    explain: "Weak fairness on Timeout, the service's own action: the result holds whatever the provider does, and rests on an assumption the service can keep."

  - id: v2-flawed
    pair: v2
    operator: drop-or-misplace-fairness
    artifact: hold-busy-budget
    key: G7
    claim: "Liveness proved: every hold eventually resolves."
    description: "Replaces Fair == TRUE with the fairness the liveness check needs. TLC reports no error."
    statement: |
      ---- MODULE HoldBudget ----
      EXTENDS Naturals
      VARIABLES st, busy
      vars == <<st, busy>>
      Init == st = "held" /\ busy = 0
      Try     == st = "held"    /\ st' = "pending"  /\ UNCHANGED busy
      Busy    == st = "pending" /\ busy < 2 /\ st' = "held" /\ busy' = busy + 1
      Capture == st = "pending" /\ st' = "captured" /\ UNCHANGED busy
      Timeout == st \in {"held", "pending"} /\ st' = "released" /\ UNCHANGED busy
      Next == Try \/ Busy \/ Capture \/ Timeout
      Fair == WF_vars(Try) /\ WF_vars(Capture)
      Spec == Init /\ [][Next]_vars /\ Fair
