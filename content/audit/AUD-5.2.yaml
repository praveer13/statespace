    explain: "WF_vars(Capture) assumes the provider captures a hold it keeps pending, and the model's Busy, which stops after two busy answers, assumes the provider runs out of them. Both are the provider's behavior, and the claim states neither: with a provider that never answers, or answers busy every time, TLC finds a hold that waits forever."
