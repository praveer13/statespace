      [q6] 15 states generated, 12 distinct states found, 0 states left on queue.
    restatement:
      run: RUN-tlc-budget-fairness
      scenarios:
        - { id: s1, text: "The provider never answers: Busy and Capture are never enabled", answer: false, key_line: "[q6 s1] Error: Temporal property EventuallyResolves was violated.", why: "TLC prints Try, then stuttering: the hold waits forever on a provider that never answers." }
        - { id: s2, text: "The provider answers busy every time it can: Capture is never enabled", answer: false, key_line: "[q6 s2] Error: Temporal property EventuallyResolves was violated.", why: "After two busy answers the hold is pending with Capture off and Timeout unfair: it waits forever." }
        - { id: s3, text: "The provider captures every hold it is sent: Busy is never enabled", answer: true, key_line: "[q6 s3] Model checking completed. No error has been found.", why: "With a provider that always captures, every hold resolves." }
