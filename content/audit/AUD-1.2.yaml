        - id: s2
          text: "a = 10, amount = -5"
          answer: true
          key_line: "[q3 s2 a=10 amount=-5] sat (covered)"
          why: "Without amount > 0 a negative amount meets every premise. Over Int it raises the sender to 15, and so does int64."
        - id: s3
          text: "a = 10, amount = -9223372036854775808"
          answer: true
          key_line: "[q3 s3 a=10 amount=-9223372036854775808] sat (covered)"
          why: "Covered: over Int, subtracting it makes the sender huge. In int64 the run gives a - amount = -9223372036854775798: the subtraction wraps and the sender goes negative."
        - id: s4
          text: "a = 2, amount = 5"
          answer: false
          key_line: "[q3 s4 a=2 amount=5] unsat (not covered)"
          why: "The guard refuses it."
    evidence:
      type: witness
      load_bearing: ["statement:1", "statement:2", "diff:5"]
      reference: { run: RUN-z3-bv64-pairs, line: "[q3 witness i64] a=9079256848778919935 b=0 amount=-9223372036854775807: a-amount=-144115188075855874" }
    key_run: RUN-z3-bv64-pairs
    key_lines: ["[q3 violation] unsat", "[q3 violation i64] sat"]
    explain: "Over Int a negative amount only raises the sender, so the unsat looks harmless. ledger.go's amount is an int64: near its minimum, a - amount wraps, and over 64-bit bit-vectors the same premises admit a sender that ends negative (RUN-z3-bv64-negamt records the same wrap)."

