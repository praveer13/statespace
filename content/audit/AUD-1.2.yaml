          text: "a = 5, b = 9223372036854775802, amount = 5"
          answer: true
          key_line: "[q2 s4 a=5 b=9223372036854775802 amount=5] sat (covered)"
          why: "Covered, and still in range: the run's int64 line gives the recipient 9223372036854775807, the largest int64. One more would wrap."
    evidence:
      type: witness
      load_bearing: ["statement:1", "statement:2", "statement:6"]
      reference: { run: RUN-z3-bv64-pairs, line: "[q2 witness i64] a=9223372036586340139 b=9223372036854775795 amount=9223372036586340133: a-amount=6 b+amount=-268435688" }
    key_run: RUN-z3-bv64
    key_lines: ["[1.5 BitVec64 signed: guarded DESTINATION wrap] sat"]
    explain: "The query is over unbounded Int, and the code is int64. Nothing in the premises keeps b + amount below 2^63, so the unsat says nothing about what ledger.go computes: over 64-bit bit-vectors the same premises admit a recipient that wraps negative. The guard protects the sender, not the recipient."

variants:
