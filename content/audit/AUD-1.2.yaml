# AUD-1.2 · S1 · G4 Encoding and type-semantics slip (docs/AUDIT-DESK.md section 3.2). The format is
# content/audit/README.md's. The flawed member is keyed by RUN-z3-bv64 (spine section 6.2's key run), whose guarded
# DESTINATION wrap is this member's recipient wrap; every receipt, scenario, variant and the sound member are keyed by
# RUN-z3-bv64-pairs, recorded in the Bench image (content/audit/tools/record-keys-s1s2.mjs). That run states each
# case's Int query as the case shows it, then the same premises and violation over signed 64-bit bit-vectors, the
# arithmetic of the int64 code each query stands for. Its tags are neutral: q1 sound member, q2 flawed member,
# q3/q4 variant pair v1 (flawed/sound), q5/q6 variant pair v2 (sound/flawed), q7/q8 variant pair v3 (flawed/sound).
id: AUD-1.2
stage: S1
class: G4
medium: z3py
artifact: recipient-wrap
subject: "a two-party transfer query (Z3Py)"
claim: "No balance can go negative; the transfer is safe."
requirement: >-
  ledger.go keeps every balance as a Go int64, whose arithmetic wraps on overflow. Every transfer it accepts,
  computed as ledger.go computes it, leaves the sender and the recipient at zero or above.
scenario_question: "Does the statement speak about this transfer: do these values meet every premise it checks?"
scheduled_after: [LAB-1, S1.L5]
kcs: [KC-1.encoding-is-the-claim]
based_on:
  incident: "Bitcoin CVE-2010-5139: a transaction's outputs overflowed when summed, so the client's check that outputs do not exceed inputs passed, and the block created about 184 billion bitcoins."
  date: "2010-08-15"
  date_marks: "the block with the overflowing transaction was mined"
  source: https://en.bitcoin.it/wiki/CVE-2010-5139

cases:
  - id: sound
    key: none
    description: "Extends the overdraft check to the recipient. Z3 answers unsat: no balance can go negative."
    statement: |
      # ledger.go keeps balances as int64
      a, b, amount = Ints('a b amount')
      s = Solver()
      s.add(a >= 0, b >= 0)
      s.add(amount > 0, amount <= a)              # ledger.go: the transfer guard
      s.add(amount <= 2**63 - 1 - b)              # ledger.go: the recipient's overflow check
      s.add(Or(a - amount < 0, b + amount < 0))   # the violation: a balance ends below zero
      print(s.check())
    diff: |
      --- a/checks/transfer_query.py
      +++ b/checks/transfer_query.py
      @@ -6,3 +6,3 @@
       s.add(amount <= 2**63 - 1 - b)              # ledger.go: the recipient's overflow check
      -s.add(a - amount < 0)                       # the violation: the sender ends below zero
      +s.add(Or(a - amount < 0, b + amount < 0))   # the violation: a balance ends below zero
       print(s.check())
    receipt: |
      z3 5.3.1 rlimit=5000000
      [q1 violation] unsat
    restatement:
      run: RUN-z3-bv64-pairs
      scenarios: &sound-scenarios
        - id: s1
          text: "a = 10, b = 0, amount = 3"
          answer: true
          key_line: "[q1 s1 a=10 b=0 amount=3] sat (covered)"
          why: "Every premise holds, so the unsat speaks about this transfer. In int64 the run gives the sender 7 and the recipient 3, the same as over Int."
        - id: s2
          text: "a = 10, b = 9223372036854775800, amount = 10"
          answer: false
          key_line: "[q1 s2 a=10 b=9223372036854775800 amount=10] unsat (not covered)"
          why: "The overflow check refuses it: b + amount would pass the largest int64. ledger.go refuses it too, so the statement leaves it out for the right reason."
        - id: s3
          text: "a = 2, b = 0, amount = 5"
          answer: false
          key_line: "[q1 s3 a=2 b=0 amount=5] unsat (not covered)"
          why: "The guard amount <= a refuses an overdraft, so the query never considers it."
        - id: s4
          text: "a = 5, b = 9223372036854775802, amount = 5"
          answer: true
          key_line: "[q1 s4 a=5 b=9223372036854775802 amount=5] sat (covered)"
          why: "The recipient lands exactly on the largest int64, 9223372036854775807 in the run's int64 line: in range, and covered."
    evidence: { type: restatement, scenarios: *sound-scenarios }
    key_run: RUN-z3-bv64-pairs
    key_lines: ["[q1 violation] unsat", "[q1 violation i64] unsat"]
    explain: "The overflow check keeps b + amount inside int64, and the guard keeps a - amount at zero or above, so every operation the query models stays in range and Int arithmetic agrees with ledger.go's. The same premises over 64-bit bit-vectors are unsat too: the claim holds for both parties as ledger.go computes them."

