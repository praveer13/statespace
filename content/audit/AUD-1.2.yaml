        - id: s2
          text: "a = 10, b = 9223372036854775800, amount = 10"
          answer: true
          key_line: "[q2 s2 a=10 b=9223372036854775800 amount=10] sat (covered)"
          why: "Every premise holds, so the unsat speaks about it, over Int, where b + amount is a large positive number. ledger.go computes it in int64, where the run gives b + amount = -9223372036854775806: the recipient wraps negative."
        - id: s3
          text: "a = 2, b = 0, amount = 5"
          answer: false
          key_line: "[q2 s3 a=2 b=0 amount=5] unsat (not covered)"
