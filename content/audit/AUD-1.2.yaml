    operator: change-arithmetic
    artifact: negative-amount
    key: { class: G4, also: [G8] }
    claim: "unsat: no transfer can overdraw the sender."
    description: "Drops amount > 0 from the query: the guard already bounds the amount. Z3 still answers unsat."
    statement: |
      # ledger.go: func transfer(a, b, amount int64) (int64, int64)
      a, amount = Ints('a amount')
      s = Solver()
      s.add(a >= 0)
      s.add(amount <= a)                  # ledger.go: the transfer guard
      s.add(a - amount < 0)               # the violation: the sender ends below zero
      print(s.check())
    diff: |
      --- a/checks/sender_query.py
      +++ b/checks/sender_query.py
      @@ -4,3 +4,2 @@
       s.add(a >= 0)
      -s.add(amount > 0)
       s.add(amount <= a)                  # ledger.go: the transfer guard
    receipt: |
      z3 5.3.1 rlimit=5000000
      [q3 violation] unsat
    restatement:
      run: RUN-z3-bv64-pairs
      scenarios:
        - id: s1
          text: "a = 10, amount = 3"
          answer: true
          key_line: "[q3 s1 a=10 amount=3] sat (covered)"
