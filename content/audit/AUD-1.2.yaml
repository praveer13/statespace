      --- a/checks/transfer.smt2
      +++ b/checks/transfer.smt2
      @@ -7,3 +7,3 @@
       (assert (<= amount (- 9223372036854775807 b)))     ; ledger.go: the recipient's overflow check
      -(assert (< (- a amount) 0))                        ; the violation: the sender ends below zero
