      scenarios: *v2-scenarios
    evidence: { type: witness, load_bearing: ["statement:5", "statement:3"], reference: "RUN-tlc-outbox-timers (g2): Commit, Dispatch, Timeout, Dispatch; Invariant NoDoubleCharge is violated" }
    key_run: RUN-tlc-outbox-timers
    key_lines: ["[q6] Model checking completed. No error has been found.", "[g2] Error: Invariant NoDoubleCharge is violated."]
    explain: "Timeouts = FALSE switches the timer's re-sends off, and the claim's assumptions never say so; the [A] it writes is about the database, which this configuration does not narrow. Allow the timer to re-send an unanswered request and TLC finds a double charge: Commit, Dispatch, Timeout, Dispatch."
