  - id: v2-flawed
    pair: v2
    operator: split-atomic-action
    medium: tla
    artifact: hold-split-model
    key: G9
    claim: "The two-step hold placement implements the atomic action, which TLC checks."
    description: "Splits PlaceHold into Check and Place, the two steps the service takes. The atomic model still checks."
    statement: |
      ---- MODULE Holds ----
      EXTENDS Naturals
      CONSTANTS Bal, Amt, Workers
      VARIABLES held, pc
      vars == <<held, pc>>
      Initial == held = 0 /\ pc = [w \in Workers |-> "check"]
      Check(w) == /\ pc[w] = "check"
                  /\ pc' = [pc EXCEPT ![w] = IF Bal - held >= Amt THEN "place" ELSE "done"]
                  /\ UNCHANGED held
      Place(w) == /\ pc[w] = "place" /\ pc' = [pc EXCEPT ![w] = "done"]
                  /\ held' = held + Amt
      Idle == (\A w \in Workers : pc[w] = "done") /\ UNCHANGED vars
      Next == (\E w \in Workers : Check(w) \/ Place(w)) \/ Idle
      Spec == Initial /\ [][Next]_vars
      NoOverHold == held <= Bal
      ====
    diff: |
      --- a/specs/Holds.tla
      +++ b/specs/Holds.tla
      @@ -7,4 +7,7 @@
      -PlaceHold(w) == /\ pc[w] = "check" /\ pc' = [pc EXCEPT ![w] = "done"]
      -                /\ IF Bal - held >= Amt THEN held' = held + Amt ELSE UNCHANGED held
      +Check(w) == /\ pc[w] = "check"
      +            /\ pc' = [pc EXCEPT ![w] = IF Bal - held >= Amt THEN "place" ELSE "done"]
      +            /\ UNCHANGED held
      +Place(w) == /\ pc[w] = "place" /\ pc' = [pc EXCEPT ![w] = "done"]
      +            /\ held' = held + Amt
       Idle == (\A w \in Workers : pc[w] = "done") /\ UNCHANGED vars
      -Next == (\E w \in Workers : PlaceHold(w)) \/ Idle
      +Next == (\E w \in Workers : Check(w) \/ Place(w)) \/ Idle
    receipt: |
      [a5] Model checking completed. No error has been found.
      [a5] 6 states generated, 4 distinct states found, 0 states left on queue.
    restatement:
      run: RUN-tlc-split-exemplars
      scenarios:
