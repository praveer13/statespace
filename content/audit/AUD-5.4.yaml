      @@ -8,3 +8,5 @@
      -Transfer(w) == /\ pc[w] = "go" /\ bal >= Amt
      -               /\ bal' = bal - Amt /\ spent' = spent + Amt
      -               /\ pc' = [pc EXCEPT ![w] = "done"]
      +Read(w)  == /\ pc[w] = "read" /\ seen' = [seen EXCEPT ![w] = bal]
