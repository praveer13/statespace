  - id: v3-sound
    pair: v3
    operator: split-atomic-action
    medium: tla
    artifact: charge-split-model
    key: none
    claim: "The two-step charge implements the atomic ChargeOnce, which TLC checks."
    description: "Splits ChargeOnce into Check and Charge, the two steps the payment worker takes. The atomic model still checks."
    statement: |
      ---- MODULE Charges ----
      EXTENDS Naturals
      CONSTANTS Workers
      VARIABLES used, charges, pc
      vars == <<used, charges, pc>>
      Initial == used = FALSE /\ charges = 0 /\ pc = [w \in Workers |-> "check"]
      Check(w)  == /\ pc[w] = "check"
                   /\ pc' = [pc EXCEPT ![w] = IF used THEN "done" ELSE "charge"]
                   /\ UNCHANGED <<used, charges>>
      Charge(w) == /\ pc[w] = "charge" /\ pc' = [pc EXCEPT ![w] = "done"]
                   /\ IF used THEN UNCHANGED <<used, charges>> ELSE used' = TRUE /\ charges' = charges + 1
      Idle == (\A w \in Workers : pc[w] = "done") /\ UNCHANGED vars
      Next == (\E w \in Workers : Check(w) \/ Charge(w)) \/ Idle
      Spec == Initial /\ [][Next]_vars
      AtMostOnce == charges <= 1
      ====
    diff: |
      --- a/specs/Charges.tla
      +++ b/specs/Charges.tla
      @@ -7,4 +7,7 @@
      -ChargeOnce(w) == /\ pc[w] = "check" /\ pc' = [pc EXCEPT ![w] = "done"]
      -                 /\ IF used THEN UNCHANGED <<used, charges>> ELSE used' = TRUE /\ charges' = charges + 1
      +Check(w)  == /\ pc[w] = "check"
      +             /\ pc' = [pc EXCEPT ![w] = IF used THEN "done" ELSE "charge"]
      +             /\ UNCHANGED <<used, charges>>
      +Charge(w) == /\ pc[w] = "charge" /\ pc' = [pc EXCEPT ![w] = "done"]
      +             /\ IF used THEN UNCHANGED <<used, charges>> ELSE used' = TRUE /\ charges' = charges + 1
       Idle == (\A w \in Workers : pc[w] = "done") /\ UNCHANGED vars
      -Next == (\E w \in Workers : ChargeOnce(w)) \/ Idle
      +Next == (\E w \in Workers : Check(w) \/ Charge(w)) \/ Idle
    receipt: |
      [a7] Model checking completed. No error has been found.
      [a7] 6 states generated, 4 distinct states found, 0 states left on queue.
    restatement:
      run: RUN-tlc-split-exemplars
      scenarios: &v3-sound-scenarios
