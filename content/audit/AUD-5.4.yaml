        - { id: c2, text: "Bal = 100, Amt = 40, two workers: more than 100 is held", answer: true, key_line: "[q6 c2] Model checking completed. No error has been found.", why: "Two holds of 40 hold 80 at most, so the race does not show at these constants." }
        - { id: c3, text: "Bal = 100, Amt = 40, three workers: more than 100 is held", answer: false, key_line: "[q6 c3] Error: Invariant NoOverHold is violated.", why: "Three checks pass before the places, and 120 is held." }
    evidence: { type: witness, load_bearing: ["statement:11", "diff:10"], reference: "RUN-tlc-split-exemplars [q6 c1]: Check(w1), Check(w2), Place(w1), Place(w2); Invariant NoOverHold is violated" }
    key_run: RUN-tlc-split-exemplars
    key_lines: ["[q6 c1] Error: Invariant NoOverHold is violated.", "[q6 c3] Error: Invariant NoOverHold is violated."]
    explain: "The receipt is the atomic model's run, 4 distinct states and no error; it says nothing about the split. Place adds the hold that its Check approved, whatever has been placed since: TLC on the split itself finds NoOverHold violated by Check(w1), Check(w2), Place(w1), Place(w2)."

