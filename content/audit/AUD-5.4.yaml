  - id: v5-sound
    pair: v5
    operator: change-isolation-level
    medium: sql
    artifact: daily-limit-counter
    key: none
    claim: "Implements the atomic Spend action."
    description: "Lowers the limit check's isolation level from SERIALIZABLE, to cut retries under load. The limit tests pass."
    statement: |
      def spend(conn, acct, amount):          # the caller retries a whole spend on SQLSTATE 40001
          with conn.transaction():
              conn.execute("SET TRANSACTION ISOLATION LEVEL REPEATABLE READ")
              (used,) = conn.execute("SELECT used FROM limits WHERE acct = %s", (acct,)).fetchone()
              if used + amount > 100:
                  return False
              conn.execute("UPDATE limits SET used = %s WHERE acct = %s", (used + amount, acct))
              return True
    diff: |
      --- a/service/limits.py
      +++ b/service/limits.py
      @@ -2,3 +2,3 @@
           with conn.transaction():
      -        conn.execute("SET TRANSACTION ISOLATION LEVEL SERIALIZABLE")
      +        conn.execute("SET TRANSACTION ISOLATION LEVEL REPEATABLE READ")
               (used,) = conn.execute("SELECT used FROM limits WHERE acct = %s", (acct,)).fetchone()
    receipt: |
      [q11 p2] a returned True, b returned False
      [q11 p2] final used=80; spent=80 of 100
    restatement:
      run: RUN-pg-split-exemplars
      scenarios: &v5-sound-scenarios
        - { id: s1, text: "Two concurrent spends of 80 against a daily limit of 100 both succeed", answer: true, key_line: "[q11 p1] a returned True, b returned error could not serialize access due to concurrent update", why: "b's UPDATE waits for a, then fails with 40001: REPEATABLE READ refuses to write over a value b never saw. The caller retries, and the retry sees 80 used." }
        - { id: s2, text: "Run one after the other, two spends of 80 both succeed", answer: true, key_line: "[q11 p2] a returned True, b returned False", why: "The second reads 80 used and refuses." }
        - { id: s3, text: "The counter ends at 80 while 160 has been spent", answer: true, key_line: "[q11 p1] final used=80; spent=80 of 100", why: "Only a's spend went through: 80 used, 80 spent." }
    evidence: { type: restatement, scenarios: *v5-sound-scenarios }
    key_run: RUN-pg-split-exemplars
    key_lines: ["[q11 p1] b: UPDATE limits SET used = %s WHERE acct = %s <... completed> -> ERROR 40001: could not serialize access due to concurrent update", "[q11 p1] final used=80; spent=80 of 100"]
    explain: "At REPEATABLE READ, PostgreSQL refuses an UPDATE of a row another transaction changed since the snapshot (40001), which the caller retries. A lost update cannot happen, so read, check and write keep the atomic step's effect."

