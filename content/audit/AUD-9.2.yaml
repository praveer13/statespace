      scenarios: &v1-sound-scenarios
        - { id: s1, text: "Accounts 1 and 2 at 100 and 50 (the fixture database)", answer: true, key_line: "[q4 s1] same", why: "The one database the report tried: both leave account 2 at 80." }
        - { id: s2, text: "Account 1 at 100, and no account 2", answer: false, key_line: "[q4 s2] differ", why: "The credit touches 0 rows and aborts; the upsert inserts account 2 and commits. The report never claimed this database." }
        - { id: s3, text: "An empty table", answer: false, key_line: "[q4 s3] differ", why: "An abort against a commit; outside the one instance the report tried." }
        - { id: s4, text: "Account 2 alone, at 0", answer: true, key_line: "[q4 s4] same", why: "Account 2 exists: both leave it at 30." }
