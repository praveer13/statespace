        - { id: s3, text: "Accounts 1 and 2 at 10 and 0", answer: true, key_line: "[q10 s3] same", why: "Not enough funds: both abort." }
        - { id: s4, text: "Accounts 1 and 2 at 31 and 0", answer: true, key_line: "[q10 s4] same", why: "Both commit with 1 and 30." }
    evidence: { type: restatement, scenarios: *v4-sound-scenarios }
