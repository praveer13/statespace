# AUD-9.2 · S9 · G11 Test presented as proof (docs/AUDIT-DESK.md section 3.2). The format is content/audit/README.md's.
# The pair and variant v2 are keyed by RUN-pg-validator-pairs, recorded on PostgreSQL 18.6 (the postgres:18 image
# RUN-pg-one-db pins) by content/audit/tools/record-aud9.mjs; variant v1 is SP-9.4 and is keyed by RUN-pg-one-db.
# The run tags its cases q1 to q12 so a receipt line never names a key: q1 sound member, q2 flawed member, q3/q4 variant
# pair v1 (flawed/sound), q5/q6 v2 (sound/flawed), q7/q8 v3, q9/q10 v4 and q11/q12 v5 (each flawed/sound). Variant pair
# v6 is LAB-9.11's own suite: its flawed form, SP-9.2's wrong-account plan, is keyed by the spine's run,
# RUN-sql-shape-validator, and both forms' receipts and scenarios are RUN-pg-shape-pair's (q13 wrong-account, q14
# credit-first), the reference validators run again with neutral tags.
id: AUD-9.2
stage: S9
class: G11
medium: sql
artifact: credit-rewrite
subject: "a validated SQL rewrite (PostgreSQL)"
claim: "Generated SQL validated; equivalent to the source."
requirement: >-
  On every database the schema allows, the generated SQL gives the outcome of what it replaces: it commits or
  aborts alike, and leaves the same table. A validation report says how far its method reaches: every database,
  a stated bound, or a number of instances tried.
scenario_question: "On this database, do the generated SQL and what it is checked against give the same outcome: the same commit or abort and the same table after, or for a query the same result?"
scheduled_after: [S9.L8, LAB-9.11]
kcs: [KC-9.sql-equivalence, KC-9.translation-validation]
based_on:
  incident: "Singh and Bedathur report that LLM judges of SQL query equivalence lean towards answering 'equivalent'; a CIDR 2026 study of LLM SQL rewrites found that about 32% of them changed query results."
  date: "2024-12"
  date_marks: "the first arXiv version of the judges paper"
  source:
    - https://arxiv.org/abs/2412.05561
    - https://www.cidrdb.org/cidr2026/papers/p33-narasayya.pdf

cases:
  - id: sound
    key: none
    description: "Rewrites the compiled credit as an upsert, which the new storage layer prefers. The validator accepts it."
    statement: |
      -- schema: acct (id int PRIMARY KEY, bal bigint NOT NULL CHECK (bal >= 0))
      -- the compiled credit of transfer 30 1 2; the plan aborts unless it touches one row
      UPDATE acct SET bal = bal + 30 WHERE id = 2;
      -- the agent's rewrite
      INSERT INTO acct (id, bal) SELECT id, bal + 30 FROM acct WHERE id = 2
        ON CONFLICT (id) DO UPDATE SET bal = EXCLUDED.bal;
      -- validation report
      method  replay both on every database with ids in {1, 2}, each absent, at 0 or at 50: 9 databases
      stamp   MODEL-CHECKED [M] · ids {1, 2}, bal {0, 50}
    diff: |
      --- a/plan/credit.sql
      +++ b/plan/credit.sql
      @@ -1,2 +1,3 @@
       -- the credit of transfer $amt $from $to
      -UPDATE acct SET bal = bal + $amt WHERE id = $to;
      +INSERT INTO acct (id, bal) SELECT id, bal + $amt FROM acct WHERE id = $to
      +  ON CONFLICT (id) DO UPDATE SET bal = EXCLUDED.bal;
    receipt: |
      [q1 replay] 9 databases, 0 differ
    receipt_run: RUN-pg-validator-pairs
    restatement:
      run: RUN-pg-validator-pairs
      scenarios: &sound-scenarios
        - { id: s1, text: "Accounts 1 and 2 at 100 and 50 (the fixture database)", answer: true, key_line: "[q1 s1] same", why: "Both statements commit and leave account 2 at 80." }
        - { id: s2, text: "Account 1 at 100, and no account 2", answer: true, key_line: "[q1 s2] same", why: "The SELECT finds no row to insert, so the rewrite touches 0 rows, as the UPDATE does: both abort." }
        - { id: s3, text: "An empty table", answer: true, key_line: "[q1 s3] same", why: "No row for account 2: both touch 0 rows and abort." }
        - { id: s4, text: "Account 2 alone, at 0", answer: true, key_line: "[q1 s4] same", why: "Both commit and leave account 2 at 30." }
    evidence: { type: restatement, scenarios: *sound-scenarios }
    key_run: RUN-pg-validator-pairs
    key_lines: ["[q1 replay] 9 databases, 0 differ"]
    explain: "The rewrite takes its row from the table, so it inserts nothing when account 2 is missing and touches 0 rows, as the UPDATE does. The replay finds no difference on the 9 databases of its family, and the report stamps exactly that: [M] with the bound. It is evidence about those databases and says so."

  - id: flawed
    key: { class: G11, also: [G10] }
    description: "Rewrites the compiled credit as an upsert, which the new storage layer prefers. The validator accepts it."
    statement: |
      -- schema: acct (id int PRIMARY KEY, bal bigint NOT NULL CHECK (bal >= 0))
      -- the compiled credit of transfer 30 1 2; the plan aborts unless it touches one row
      UPDATE acct SET bal = bal + 30 WHERE id = 2;
      -- the agent's rewrite
      INSERT INTO acct (id, bal) VALUES (2, 30)
        ON CONFLICT (id) DO UPDATE SET bal = acct.bal + 30;
      -- validation report
      method  shape: the same table, the same key and the same increment as the compiled credit
      stamp   PROVED [P] · equivalent
    diff: |
      --- a/plan/credit.sql
      +++ b/plan/credit.sql
      @@ -1,2 +1,3 @@
       -- the credit of transfer $amt $from $to
      -UPDATE acct SET bal = bal + $amt WHERE id = $to;
      +INSERT INTO acct (id, bal) VALUES ($to, $amt)
      +  ON CONFLICT (id) DO UPDATE SET bal = acct.bal + $amt;
    receipt: |
      [q2 shape] credit: table acct, key 2, bal + 30 | rewrite: table acct, key 2, bal + 30 | accepted
    receipt_run: RUN-pg-validator-pairs
    restatement:
      run: RUN-pg-validator-pairs
      scenarios:
        - { id: s1, text: "Accounts 1 and 2 at 100 and 50 (the fixture database)", answer: true, key_line: "[q2 s1] same", why: "Account 2 exists, so the upsert takes its conflict branch and adds 30, as the UPDATE does." }
        - { id: s2, text: "Account 1 at 100, and no account 2", answer: false, key_line: "[q2 s2] differ", why: "The UPDATE touches 0 rows and the plan aborts. The upsert inserts account 2 at 30 and commits." }
        - { id: s3, text: "An empty table", answer: false, key_line: "[q2 s3] differ", why: "The same: an abort against a commit that creates account 2." }
        - { id: s4, text: "Account 2 alone, at 0", answer: true, key_line: "[q2 s4] same", why: "Account 2 exists: both leave it at 30." }
    evidence: { type: verdict-line, load_bearing: ["statement:8", "statement:9", "receipt:1"] }
    key_run: RUN-pg-validator-pairs
    key_lines:
      - "[q2 shape] credit: table acct, key 2, bal + 30 | rewrite: table acct, key 2, bal + 30 | accepted"
      - "[q2 replay] 9 databases, 3 differ"
      - "[q2 first difference] database empty: credit abort (statement 1 touched 0 rows) | unchanged; rewrite commit | 2:30"
    explain: "The validator read each statement's table, key and increment from its text and never ran either one, yet the report stamps [P]. A replay over the same 9 databases finds 3 that differ: wherever account 2 is missing, the credit aborts and the upsert creates the account and commits. A shape check is weaker than one test, and here it accepted a rewrite that changes results."

variants:
  - id: v1-flawed
    pair: v1
    operator: replace-proof-by-single-db-test
    artifact: upsert-fixture
    claim: "Validated on the fixture database: the rewrite matches the compiled credit."
    key: { class: G11, also: [G10] }
    description: "Rewrites the compiled credit as an upsert. The fixture database and the S6 suite agree with the original."
    statement: |
      -- schema: acct (id int PRIMARY KEY, bal bigint NOT NULL CHECK (bal >= 0))
      -- the compiled credit of transfer 30 1 2; the plan aborts unless it touches one row
      UPDATE acct SET bal = bal + 30 WHERE id = 2;
      -- the agent's rewrite
      INSERT INTO acct (id, bal) VALUES (2, 30)
        ON CONFLICT (id) DO UPDATE SET bal = acct.bal + 30;
      -- validation report
      method  run both on the fixture database: accounts 1 and 2 at 100 and 50
      stamp   PROVED [P] · equivalent
    diff: |
      --- a/plan/credit.sql
      +++ b/plan/credit.sql
      @@ -1,2 +1,3 @@
       -- the credit of transfer $amt $from $to
      -UPDATE acct SET bal = bal + $amt WHERE id = $to;
      +INSERT INTO acct (id, bal) VALUES ($to, $amt)
      +  ON CONFLICT (id) DO UPDATE SET bal = acct.bal + $amt;
    receipt: |
      UPDATE 1
      2 |  80
      INSERT 0 1
      2 |  80
    receipt_run: RUN-pg-one-db
    restatement:
      run: RUN-pg-validator-pairs
      scenarios:
        - { id: s1, text: "Accounts 1 and 2 at 100 and 50 (the fixture database)", answer: true, key_line: "[q3 s1] same", why: "The one database the report tried: both leave account 2 at 80." }
        - { id: s2, text: "Account 1 at 100, and no account 2", answer: false, key_line: "[q3 s2] differ", why: "The credit touches 0 rows and aborts; the upsert inserts account 2 and commits." }
        - { id: s3, text: "An empty table", answer: false, key_line: "[q3 s3] differ", why: "An abort against a commit that creates account 2." }
        - { id: s4, text: "Account 2 alone, at 0", answer: true, key_line: "[q3 s4] same", why: "Account 2 exists: both leave it at 30." }
    evidence: { type: verdict-line, load_bearing: ["statement:8", "statement:9"] }
    key_run: RUN-pg-one-db
    key_lines:
      - { config: fixture, line: "UPDATE 1" }
      - { config: fixture, line: "INSERT 0 1" }
      - { config: cell1, line: "UPDATE 0" }
      - { config: cell1, line: "INSERT 0 1" }
    explain: "One database is one instance: the report's method earns [T] · 1 instance, and it stamps [P]. On a database without account 2, the credit reports UPDATE 0, which the plan turns into an abort, and the upsert reports INSERT 0 1 and leaves account 2 at 30. This is SP-9.4."

