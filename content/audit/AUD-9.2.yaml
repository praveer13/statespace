      -- the agent's rewrite
      INSERT INTO acct (id, bal) VALUES (2, 30)
        ON CONFLICT (id) DO UPDATE SET bal = acct.bal + 30;
      -- validation report
      method  run both on the fixture database: accounts 1 and 2 at 100 and 50
      stamp   TESTED [T] · 1 instance
    diff: |
      --- a/plan/credit.sql
      +++ b/plan/credit.sql
      @@ -1,2 +1,3 @@
       -- the credit of transfer $amt $from $to
      -UPDATE acct SET bal = bal + $amt WHERE id = $to;
      +INSERT INTO acct (id, bal) VALUES ($to, $amt)
      +  ON CONFLICT (id) DO UPDATE SET bal = acct.bal + $amt;
    receipt: |
