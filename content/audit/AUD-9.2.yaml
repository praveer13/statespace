  - id: v4-flawed
    pair: v4
    operator: replace-proof-by-single-db-test
    artifact: funds-guard-rewrite
    claim: "Validated on three databases: the rewrite matches the compiled debit."
    key: { class: G11, also: [G10] }
    description: "Rewrites the debit guard as a subtraction, to match the ledger service. Three test databases agree with the original."
    statement: |
      -- schema: acct (id int PRIMARY KEY, bal bigint NOT NULL CHECK (bal >= 0))
      -- the compiled plan of transfer 30 1 2; it aborts unless each statement touches one row
      UPDATE acct SET bal = bal - 30 WHERE id = 1 AND bal >= 30;
      UPDATE acct SET bal = bal + 30 WHERE id = 2;
      -- the agent's rewrite of the debit
      UPDATE acct SET bal = bal - 30 WHERE id = 1 AND bal - 30 > 0;
      -- validation report
      method  run both plans on three databases: account 1 at 100, 50 or 0, account 2 at 0
      stamp   PROVED [P] · equivalent
    diff: |
      --- a/plan/debit.sql
      +++ b/plan/debit.sql
      @@ -1,2 +1,2 @@
       -- the debit of transfer $amt $from $to
      -UPDATE acct SET bal = bal - $amt WHERE id = $from AND bal >= $amt;
      +UPDATE acct SET bal = bal - $amt WHERE id = $from AND bal - $amt > 0;
    receipt: |
      [q9 tried] 3 databases, 0 differ
    receipt_run: RUN-pg-validator-pairs
    restatement:
      run: RUN-pg-validator-pairs
      scenarios:
        - { id: s1, text: "Accounts 1 and 2 at 100 and 0", answer: true, key_line: "[q9 s1] same", why: "Both plans commit with 70 and 30." }
