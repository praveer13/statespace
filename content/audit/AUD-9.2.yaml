    explain: "The claim and the stamp say what the run shows and no more: the two statements agree on the fixture database, one instance. The rewrite does differ elsewhere (step 3), and the report does not pretend otherwise. Whether to ship it is a separate question, and this stamp is what that question has to work with."

  - id: v2-sound
    pair: v2
    operator: replace-proof-by-single-db-test
    artifact: transfer-plan-emitter
    medium: rust
    key: none
    description: "Reuses the account binding in the SQL emitter: one lookup fewer per command. The validator accepts the generated plan."
    statement: |
      -- schema: acct (id int PRIMARY KEY, bal bigint NOT NULL CHECK (bal >= 0))
      -- the plan generated for transfer 30 1 2; it aborts unless each statement touches one row
      UPDATE acct SET bal = bal - 30 WHERE id = 1 AND bal >= 30;
      UPDATE acct SET bal = bal + 30 WHERE id = 2;
      -- validation report
      method  replay the plan and the source command on every database with accounts 1 and 2 at 0, 30 or 50: 9 databases
      stamp   MODEL-CHECKED [M] · accounts 1 and 2, bal {0, 30, 50}
    diff: |
      --- a/compiler/src/sql.rs
      +++ b/compiler/src/sql.rs
      @@ -10,4 +10,5 @@
           let acct = cmd.from;
      +    let to = cmd.to;
           out.push(debit(acct, cmd.amt));
      -    out.push(credit(cmd.to, cmd.amt));
      +    out.push(credit(to, cmd.amt));
    receipt: |
      [q5 replay] 9 databases, 0 differ
    receipt_run: RUN-pg-validator-pairs
    restatement:
      run: RUN-pg-validator-pairs
      scenarios: &v2-sound-scenarios
        - { id: s1, text: "Accounts 1 and 2 at 100 and 0", answer: true, key_line: "[q5 s1] same", why: "Both commit with account 1 at 70 and account 2 at 30." }
        - { id: s2, text: "Accounts 1 and 2 at 0 and 0", answer: true, key_line: "[q5 s2] same", why: "Not enough funds: the source aborts, and the plan's debit touches 0 rows and aborts." }
        - { id: s3, text: "Accounts 1 and 2 at 30 and 50", answer: true, key_line: "[q5 s3] same", why: "Both commit with account 1 at 0 and account 2 at 80." }
        - { id: s4, text: "Accounts 1 and 2 at 10 and 5", answer: true, key_line: "[q5 s4] same", why: "Both abort." }
    evidence: { type: restatement, scenarios: *v2-sound-scenarios }
    key_run: RUN-pg-validator-pairs
    key_lines: ["[q5 replay] 9 databases, 0 differ"]
    explain: "The emitter still credits cmd.to, through a new binding. The replay runs the plan and the source command on the 9 databases of its family and finds no difference, and the stamp names that bound. The source side here is a hand transcription of S9's source semantics into PL/pgSQL, recorded with the run, until the reference interpreter lands."

  - id: v2-flawed
    pair: v2
    operator: replace-proof-by-single-db-test
    artifact: transfer-plan-emitter
    medium: rust
    key: { class: G11, also: [G10] }
    description: "Reuses the account binding in the SQL emitter: one lookup fewer per command. The validator accepts the generated plan."
    statement: |
      -- schema: acct (id int PRIMARY KEY, bal bigint NOT NULL CHECK (bal >= 0))
      -- the plan generated for transfer 30 1 2; it aborts unless each statement touches one row
      UPDATE acct SET bal = bal - 30 WHERE id = 1 AND bal >= 30;
      UPDATE acct SET bal = bal + 30 WHERE id = 1;
      -- validation report
      method  shape: a debit, then a credit, each an UPDATE of acct keyed by id, bal - <n> then bal + <n>
      stamp   PROVED [P] · equivalent to transfer 30 1 2
    diff: |
      --- a/compiler/src/sql.rs
      +++ b/compiler/src/sql.rs
      @@ -10,4 +10,4 @@
           let acct = cmd.from;
           out.push(debit(acct, cmd.amt));
      -    out.push(credit(cmd.to, cmd.amt));
      +    out.push(credit(acct, cmd.amt));
    receipt: |
      [q6 shape] debit: table acct, key 1, bal - 30 | credit: table acct, key 1, bal + 30 | accepted
    receipt_run: RUN-pg-validator-pairs
    restatement:
      run: RUN-pg-validator-pairs
      scenarios:
        - { id: s1, text: "Accounts 1 and 2 at 100 and 0", answer: false, key_line: "[q6 s1] differ", why: "The source leaves 70 and 30. The plan debits account 1 and credits it back: 100 and 0." }
        - { id: s2, text: "Accounts 1 and 2 at 0 and 0", answer: true, key_line: "[q6 s2] same", why: "Not enough funds: both abort before the credit matters." }
        - { id: s3, text: "Accounts 1 and 2 at 30 and 50", answer: false, key_line: "[q6 s3] differ", why: "The source leaves 0 and 80; the plan leaves 30 and 50." }
        - { id: s4, text: "Accounts 1 and 2 at 10 and 5", answer: true, key_line: "[q6 s4] same", why: "Both abort." }
    evidence: { type: verdict-line, load_bearing: ["statement:6", "statement:7", "receipt:1"] }
    key_run: RUN-pg-validator-pairs
    key_lines:
      - "[q6 shape] debit: table acct, key 1, bal - 30 | credit: table acct, key 1, bal + 30 | accepted"
      - "[q6 replay] 9 databases, 6 differ"
      - "[q6 first difference] database (1,30),(2,0): source commit | 1:0 2:30; plan commit | 1:30 2:0"
    explain: "The shape check sees two UPDATEs keyed by id, a debit and a credit, and cannot see which account a key names: the credit goes back to account 1. It never runs the plan, and the report stamps [P]. A replay against the source command on 9 databases finds 6 that differ; on every one where the transfer goes through, account 2 never receives the 30."

  - id: v3-flawed
    pair: v3
    operator: replace-proof-by-single-db-test
    artifact: hold-guard-rewrite
    claim: "Validated on the fixture database: the rewrite matches the compiled debit."
    key: { class: G11, also: [G10] }
    description: "Rewrites the hold guard with NOT EXISTS, which the planner handles better. The fixture database agrees with the original."
    statement: |
      -- schema: acct (id int PRIMARY KEY, bal bigint NOT NULL CHECK (bal >= 0)); holds (acct_id int), NULL allowed
      -- the compiled debit of transfer 30 1 2; the plan aborts unless it touches one row
      UPDATE acct SET bal = bal - 30 WHERE id = 1 AND bal >= 30
        AND id NOT IN (SELECT acct_id FROM holds);
      -- the agent's rewrite
      UPDATE acct SET bal = bal - 30 WHERE id = 1 AND bal >= 30
        AND NOT EXISTS (SELECT 1 FROM holds h WHERE h.acct_id = acct.id);
      -- validation report
      method  run both on the fixture database: accounts 1 and 2 at 100 and 0, one hold, on account 3
      stamp   PROVED [P] · equivalent
    diff: |
      --- a/plan/debit.sql
      +++ b/plan/debit.sql
      @@ -1,3 +1,3 @@
       -- the debit of transfer $amt $from $to
       UPDATE acct SET bal = bal - $amt WHERE id = $from AND bal >= $amt
      -  AND id NOT IN (SELECT acct_id FROM holds);
      +  AND NOT EXISTS (SELECT 1 FROM holds h WHERE h.acct_id = acct.id);
    receipt: |
      [q7 fixture] same: compiled commit | 1:70 2:0; rewrite commit | 1:70 2:0
    receipt_run: RUN-pg-validator-pairs
    restatement:
      run: RUN-pg-validator-pairs
      scenarios:
        - { id: s1, text: "Accounts 1 and 2 at 100 and 0, one hold on account 3 (the fixture database)", answer: true, key_line: "[q7 s1] same", why: "Neither guard stops account 1: both debit it." }
        - { id: s2, text: "Accounts 1 and 2 at 100 and 0, no holds", answer: true, key_line: "[q7 s2] same", why: "No holds: both debit account 1." }
        - { id: s3, text: "Accounts 1 and 2 at 100 and 0, one hold whose acct_id is NULL", answer: false, key_line: "[q7 s3] differ", why: "id NOT IN (NULL) is never true, so the compiled debit touches 0 rows and aborts; NOT EXISTS finds no match and debits." }
        - { id: s4, text: "Accounts 1 and 2 at 100 and 0, one hold on account 1", answer: true, key_line: "[q7 s4] same", why: "Both guards stop account 1: both abort." }
    evidence: { type: verdict-line, load_bearing: ["statement:9", "statement:10"] }
    key_run: RUN-pg-validator-pairs
    key_lines:
      - "[q7 fixture] same: compiled commit | 1:70 2:0; rewrite commit | 1:70 2:0"
      - "[q7 s3] differ: compiled abort (statement 1 touched 0 rows) | unchanged; rewrite commit | 1:70 2:0"
    explain: "One database is one instance, and the report stamps [P]. holds.acct_id allows NULL, and the fixture has none: on a database with a NULL hold, NOT IN is never true and the compiled debit aborts, while NOT EXISTS debits and commits."

