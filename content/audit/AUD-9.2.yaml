    operator: replace-proof-by-single-db-test
    artifact: upsert-fixture
    claim: "Validated on the fixture database: the rewrite matches the compiled credit."
    key: none
    description: "Rewrites the compiled credit as an upsert. The fixture database and the S6 suite agree with the original."
    statement: |
