  - id: v5-sound
    pair: v5
    operator: edit-code-to-fit-proof
    artifact: voucher-redeem
    medium: smt-lib
    claim: "Z3 found a bug in Redeem; fixed."
    key: none
    description: "Z3's inductive step for redeemed <= issued is sat, and the step that breaks it is a Redeem. Makes Redeem check that an unredeemed voucher is left."
    statement: |
      ; vouchers.smt2: the inductive step for redeemed <= issued. Init: issued, redeemed and outstanding all 0
      (declare-const issued Int)
      (declare-const redeemed Int)
      (declare-const outstanding Int)
      (declare-const issued_p Int)
      (declare-const redeemed_p Int)
      (declare-const outstanding_p Int)
      (assert (<= redeemed issued))
      (assert (or
        (and (= issued_p (+ issued 1)) (= outstanding_p (+ outstanding 1)) (= redeemed_p redeemed))        ; Issue
        (and (> outstanding 0) (= redeemed_p (+ redeemed 1)) (= outstanding_p (- outstanding 1)) (= issued_p issued))  ; Redeem
        (and (> outstanding 0) (= outstanding_p (+ outstanding 1)) (= issued_p issued) (= redeemed_p redeemed))))  ; Split
      (assert (> redeemed_p issued_p))
      (check-sat)
    diff: |
      --- a/models/vouchers.smt2
      +++ b/models/vouchers.smt2
      @@ -10,3 +10,3 @@
         (and (= issued_p (+ issued 1)) (= outstanding_p (+ outstanding 1)) (= redeemed_p redeemed))        ; Issue
      -  (and (> outstanding 0) (= redeemed_p (+ redeemed 1)) (= outstanding_p (- outstanding 1)) (= issued_p issued))  ; Redeem
      +  (and (> outstanding 0) (< redeemed issued) (= redeemed_p (+ redeemed 1)) (= outstanding_p (- outstanding 1)) (= issued_p issued))  ; Redeem
         (and (> outstanding 0) (= outstanding_p (+ outstanding 1)) (= issued_p issued) (= redeemed_p redeemed))))  ; Split
    receipt: |
      [q11 file q11.smt2] sat
      [q11 pre-state] outstanding == issued - redeemed: False
    restatement:
      run: RUN-z3-cti-exemplars
      scenarios: &v5-sound-scenarios
        - { id: s1, text: "issued = 1, redeemed = 1, outstanding = 1", answer: true, key_line: "[q11 s1 issued=1 redeemed=1 outstanding=1] reachable within 6: yes, in 3 steps", why: "Issue, Split, then Redeem: this Split adds an outstanding voucher without issuing it." }
        - { id: s2, text: "issued = 2, redeemed = 1, outstanding = 1", answer: true, key_line: "[q11 s2 issued=2 redeemed=1 outstanding=1] reachable within 6: yes, in 3 steps", why: "Issue, Split, Redeem: reachable." }
        - { id: s3, text: "issued = 1, redeemed = 2, outstanding = 0", answer: true, key_line: "[q11 s3 issued=1 redeemed=2 outstanding=0] reachable within 6: yes, in 4 steps", why: "Issue, Split, Redeem, Redeem: more redeemed than issued, the violation." }
        - { id: s4, text: "issued = 3, redeemed = 3, outstanding = 0", answer: true, key_line: "[q11 s4 issued=3 redeemed=3 outstanding=0] reachable within 6: yes, in 6 steps", why: "Reachable in 6 steps." }
    evidence: { type: restatement, scenarios: *v5-sound-scenarios }
    key_run: RUN-z3-cti-exemplars
    key_lines: ["[q11 search] violation reachable within 6 steps: yes, at step 4", "[q11 edited, file q11e.smt2] unsat", "[q11 edited, search] violation reachable within 6 steps: no"]
    explain: "The violation is reachable at step 4 (Issue, Split, Redeem, Redeem), so this is a bug. With Redeem checking redeemed < issued, the edited file is unsat and the search finds nothing."

