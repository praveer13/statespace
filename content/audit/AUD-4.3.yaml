    statement: |
      # Init: escrow >= 0 and disputed == 0. The invariant to keep: escrow >= 0.
      def step(s, t, n):
          (escrow, disputed), (escrow2, disputed2) = s, t
          return And(n > 0, Or(
              And(n <= escrow - disputed, disputed2 == disputed + n, escrow2 == escrow),      # Dispute(n)
              And(n <= escrow, escrow2 == escrow - n, disputed2 == disputed),                 # Release(n)
              And(n <= disputed, disputed2 == disputed - n, escrow2 == escrow - n)))          # Refund(n)
    diff: |
      --- a/models/escrow.py
      +++ b/models/escrow.py
      @@ -6,2 +6,2 @@
               And(n <= escrow, escrow2 == escrow - n, disputed2 == disputed),                 # Release(n)
      -        And(n <= disputed, disputed2 == disputed - n, escrow2 == escrow - n)))          # Refund(n)
      +        And(n <= disputed, n <= escrow, disputed2 == disputed - n, escrow2 == escrow - n)))   # Refund(n): cover checked
    receipt: |
      [q7 step of escrow >= 0] sat
      [q7 pre-state] 0 <= disputed <= escrow: False
    restatement:
      run: RUN-z3-cti-exemplars
      scenarios: &v3-sound-scenarios
        - { id: s1, text: "escrow = 0, disputed = 2", answer: true, key_line: "[q7 s1 escrow=0 disputed=2] reachable within 6: yes, in 2 steps", why: "Dispute(2), then Release(2) from escrow = 2: this Release checks only n <= escrow, so it pays out money a dispute still claims." }
