    description: "Z3's inductive step for escrow >= 0 is sat, and the step that breaks it is a Refund. Makes Refund check that the escrow covers n."
    statement: |
      # Init: escrow >= 0 and disputed == 0. The invariant to keep: escrow >= 0.
      def step(s, t, n):
          (escrow, disputed), (escrow2, disputed2) = s, t
          return And(n > 0, Or(
              And(n <= escrow - disputed, disputed2 == disputed + n, escrow2 == escrow),      # Dispute(n)
              And(n <= escrow - disputed, escrow2 == escrow - n, disputed2 == disputed),      # Release(n)
              And(n <= disputed, disputed2 == disputed - n, escrow2 == escrow - n)))          # Refund(n)
    diff: |
      --- a/models/escrow.py
      +++ b/models/escrow.py
      @@ -6,2 +6,2 @@
               And(n <= escrow - disputed, escrow2 == escrow - n, disputed2 == disputed),      # Release(n)
      -        And(n <= disputed, disputed2 == disputed - n, escrow2 == escrow - n)))          # Refund(n)
      +        And(n <= disputed, n <= escrow, disputed2 == disputed - n, escrow2 == escrow - n)))   # Refund(n): cover checked
    receipt: |
      [q8 step of escrow >= 0] sat
      [q8 pre-state] 0 <= disputed <= escrow: False
    restatement:
      run: RUN-z3-cti-exemplars
      scenarios:
        - { id: s1, text: "escrow = 0, disputed = 2", answer: false, key_line: "[q8 s1 escrow=0 disputed=2] reachable within 6: no", why: "Release keeps the escrow at or above what is disputed, so disputed never passes escrow. This is the step's pre-state, and it cannot be reached." }
        - { id: s2, text: "escrow = 3, disputed = 1", answer: true, key_line: "[q8 s2 escrow=3 disputed=1] reachable within 6: yes, in 1 steps", why: "One Dispute(1) from escrow = 3." }
        - { id: s3, text: "escrow = -2, disputed = 0", answer: false, key_line: "[q8 s3 escrow=-2 disputed=0] reachable within 6: no", why: "No run within the bound breaks escrow >= 0." }
        - { id: s4, text: "escrow = 5, disputed = 0", answer: true, key_line: "[q8 s4 escrow=5 disputed=0] reachable within 6: yes, in 0 steps", why: "Init, with escrow = 5." }
    evidence: { type: witness, load_bearing: ["statement:6", "diff:6", "receipt:2"], reference: { run: RUN-z3-cti-exemplars, line: "[q8 s1 escrow=0 disputed=2] reachable within 6: no" } }
    key_run: RUN-z3-cti-exemplars
    key_lines: ["[q8 search] violation reachable within 6 steps: no", "[q8 step of escrow >= 0 and 0 <= disputed <= escrow] unsat", "[q8 edited, step of escrow >= 0] sat"]
    explain: "A counterexample to induction: disputed above escrow, which this Release never allows, and no violation within 6 steps. Strengthening to 0 <= disputed <= escrow makes the step unsat with Refund unchanged. The edit changes a command that needed no change, and the inductive step is still sat after it: the induction was never closed."

  - id: v4-flawed
    pair: v4
    operator: edit-code-to-fit-proof
    artifact: settlement-batch
    claim: "Z3 found a bug in Settle; fixed."
    key: { class: G13, also: [G8d] }
    description: "Z3's inductive step for settled <= total is sat, and the step that breaks it is a Settle. Makes Settle check that the batch total covers it."
    statement: |
      # Init: queued == 0, settled == 0 and total == 0. The invariant to keep: settled <= total.
      def step(s, t, n):
          (queued, settled, total), (queued2, settled2, total2) = s, t
          return And(n > 0, Or(
              And(queued2 == queued + n, total2 == total + n, settled2 == settled),            # Enqueue(n)
              And(n <= queued, queued2 == queued - n, settled2 == settled + n, total2 == total),  # Settle(n)
              And(n <= settled, settled2 == settled - n, queued2 == queued + n, total2 == total)))      # Requeue(n)
    diff: |
      --- a/models/settlement.py
      +++ b/models/settlement.py
      @@ -5,3 +5,3 @@
               And(queued2 == queued + n, total2 == total + n, settled2 == settled),            # Enqueue(n)
      -        And(n <= queued, queued2 == queued - n, settled2 == settled + n, total2 == total),  # Settle(n)
      +        And(n <= queued, settled + n <= total, queued2 == queued - n, settled2 == settled + n, total2 == total),  # Settle(n): total checked
               And(n <= settled, settled2 == settled - n, queued2 == queued + n, total2 == total)))      # Requeue(n)
    receipt: |
      [q10 step of settled <= total] sat
      [q10 pre-state] queued + settled == total: False
    restatement:
      run: RUN-z3-cti-exemplars
      scenarios:
        - { id: s1, text: "queued = 2, settled = 0, total = 1", answer: false, key_line: "[q10 s1 queued=2 settled=0 total=1] reachable within 6: no", why: "Every command keeps queued + settled == total, so more queued than the total never happens with nothing settled. This is the step's pre-state, and it cannot be reached." }
        - { id: s2, text: "queued = 1, settled = 1, total = 2", answer: true, key_line: "[q10 s2 queued=1 settled=1 total=2] reachable within 6: yes, in 2 steps", why: "Enqueue(2), then Settle(1)." }
        - { id: s3, text: "queued = 0, settled = 2, total = 1", answer: false, key_line: "[q10 s3 queued=0 settled=2 total=1] reachable within 6: no", why: "No run within the bound breaks settled <= total." }
        - { id: s4, text: "queued = 0, settled = 3, total = 3", answer: true, key_line: "[q10 s4 queued=0 settled=3 total=3] reachable within 6: yes, in 2 steps", why: "Enqueue(3), then Settle(3)." }
    evidence: { type: witness, load_bearing: ["statement:7", "diff:6", "receipt:2"], reference: { run: RUN-z3-cti-exemplars, line: "[q10 s1 queued=2 settled=0 total=1] reachable within 6: no" } }
    key_run: RUN-z3-cti-exemplars
    key_lines: ["[q10 search] violation reachable within 6 steps: no", "[q10 step of settled <= total and queued + settled == total] unsat", "[q10 pre-state] queued + settled == total: False"]
    explain: "A counterexample to induction: queued + settled away from total, which these commands never reach, and no violation within 6 steps. Strengthening to queued + settled == total makes the step unsat with Settle unchanged. The edit changes a command that needed no change."

  - id: v4-sound
