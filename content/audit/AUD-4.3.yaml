  - id: v2-flawed
    pair: v2
    operator: edit-code-to-fit-proof
    artifact: seat-capacity
    claim: "Z3 found a bug in Shrink; fixed."
    key: { class: G13, also: [G8d] }
    description: "Z3's inductive step for free >= 0 is sat, and the step that breaks it is a Shrink. Makes Shrink check that a seat is free."
    statement: |
      # Init: cap >= 0, free == cap and booked == 0. The invariant to keep: free >= 0.
      def step(s, t):
          (free, booked, cap), (free2, booked2, cap2) = s, t
          return Or(
              And(free > 0, free2 == free - 1, booked2 == booked + 1, cap2 == cap),         # Book
              And(booked > 0, free2 == free + 1, booked2 == booked - 1, cap2 == cap),       # Cancel
              And(cap > booked, free2 == free - 1, booked2 == booked, cap2 == cap - 1))     # Shrink
    diff: |
      --- a/models/seats.py
      +++ b/models/seats.py
      @@ -6,2 +6,2 @@
               And(booked > 0, free2 == free + 1, booked2 == booked - 1, cap2 == cap),       # Cancel
      -        And(cap > booked, free2 == free - 1, booked2 == booked, cap2 == cap - 1))     # Shrink
      +        And(cap > booked, free > 0, free2 == free - 1, booked2 == booked, cap2 == cap - 1))     # Shrink: free checked
    receipt: |
      [q6 step of free >= 0] sat
      [q6 pre-state] free == cap - booked: False
    restatement:
      run: RUN-z3-cti-exemplars
      scenarios:
        - { id: s1, text: "free = 0, booked = 0, cap = 1", answer: false, key_line: "[q6 s1 free=0 booked=0 cap=1] reachable within 6: no", why: "Book and Cancel each move one seat between free and booked, and Shrink takes one free seat with the capacity, so free == cap - booked always holds. This is the step's pre-state, and it cannot be reached." }
        - { id: s2, text: "free = 1, booked = 1, cap = 2", answer: true, key_line: "[q6 s2 free=1 booked=1 cap=2] reachable within 6: yes, in 1 steps", why: "One Book from cap = 2." }
        - { id: s3, text: "free = -1, booked = 0, cap = 0", answer: false, key_line: "[q6 s3 free=-1 booked=0 cap=0] reachable within 6: no", why: "No run within the bound breaks free >= 0." }
        - { id: s4, text: "free = 2, booked = 0, cap = 2", answer: true, key_line: "[q6 s4 free=2 booked=0 cap=2] reachable within 6: yes, in 0 steps", why: "Init, with cap = 2." }
    evidence: { type: witness, load_bearing: ["statement:6", "diff:6", "receipt:2"], reference: { run: RUN-z3-cti-exemplars, line: "[q6 s1 free=0 booked=0 cap=1] reachable within 6: no" } }
    key_run: RUN-z3-cti-exemplars
    key_lines: ["[q6 search] violation reachable within 6 steps: no", "[q6 step of free >= 0 and free == cap - booked] unsat", "[q6 pre-state] free == cap - booked: False"]
    explain: "A counterexample to induction: its pre-state has free away from cap - booked, which these commands never reach, and no violation turns up within 6 steps. Strengthening to free == cap - booked makes the step unsat with Shrink unchanged. The edit changes a command that needed no change."

