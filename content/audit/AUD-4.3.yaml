        - { id: s3, text: "escrow = -2, disputed = 0", answer: true, key_line: "[q7 s3 escrow=-2 disputed=0] reachable within 6: yes, in 3 steps", why: "Dispute, Release, then Refund: the violation is reachable." }
        - { id: s4, text: "escrow = 5, disputed = 0", answer: true, key_line: "[q7 s4 escrow=5 disputed=0] reachable within 6: yes, in 0 steps", why: "Init, with escrow = 5." }
    evidence: { type: restatement, scenarios: *v3-sound-scenarios }
    key_run: RUN-z3-cti-exemplars
    key_lines: ["[q7 search] violation reachable within 6 steps: yes, at step 3", "[q7 edited, step of escrow >= 0] unsat", "[q7 edited, search] violation reachable within 6 steps: no"]
    explain: "The violation is reachable at step 3 (Dispute, Release, Refund), so this is a bug. With Refund checking cover, the inductive step for escrow >= 0 is unsat and the search finds nothing."

