  - id: v2-sound
    pair: v2
    operator: drop-declassification
    artifact: open-by-name
    key: none
    description: "Gives Open one answer for both refusals and restates Rel for the sharing release, then re-runs the check. Z3 answers unsat."
    statement: |
      def open_doc(exists, mayread, body):          # one answer for both refusals
          code = If(And(exists, mayread), 2, 0)
          return code, If(code == 2, body, 0)

      def related():
          eL, eR = Bools('exists_L exists_R')
          mL, mR = Bools('mayread_L mayread_R')
          bL, bR = Ints('body_L body_R')
          # Rel: the worlds agree on what Acme may know.
          rel = And(mL == mR, Implies(mL, And(eL == eR, bL == bR)))
          return (eL, mL, bL), (eR, mR, bR), rel

      L, R, rel = related()
      (cL, xL), (cR, xR) = open_doc(*L), open_doc(*R)
      s = Solver()
      s.add(rel, Or(cL != cR, xL != xR))           # the negated conclusion: frank's responses differ
      print(s.check())
    diff: |
      --- a/checks/open_selfcomp.py
      +++ b/checks/open_selfcomp.py
      @@ -1,3 +1,3 @@
      -def open_doc(exists, mayread, body):          # not_found, forbidden or a page
      -    code = If(Not(exists), 0, If(Not(mayread), 1, 2))
      +def open_doc(exists, mayread, body):          # one answer for both refusals
      +    code = If(And(exists, mayread), 2, 0)
           return code, If(code == 2, body, 0)
      @@ -9,2 +9,2 @@
           # Rel: the worlds agree on what Acme may know.
      -    rel = And(mL == mR, eL == eR, Implies(mL, bL == bR))
      +    rel = And(mL == mR, Implies(mL, And(eL == eR, bL == bR)))
    receipt: |
      z3 5.3.1 rlimit=5000000
      [q5 proof] unsat
      [q5 premises] sat
    receipt_run: RUN-z3-declassify-exemplars
    restatement:
