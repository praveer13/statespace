      -    return [W.own_A]
      +    return [W.own_A] + [If(sh, c, HIDDEN) for c, sh in W.docs_B]

       def rel(L, R):                                   # what Acme may know: DCL-7.1, written inline
      -    return L.own_A == R.own_A
      +    return And(L.own_A == R.own_A, And([And(shL == shR, Implies(shL, cL == cR))
