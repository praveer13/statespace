  - id: v3-flawed
    pair: v3
    operator: drop-parentheses
    artifact: open-by-name-smt
    medium: smt-lib
    key: { class: G12, also: [G1] }
    description: "Open now returns a page's body: restates Rel to release it, then re-runs the check. Z3 answers unsat."
    statement: |
      ; Self-composition of Open v1 for frank and layoffs-memo.
      ; _L is the left world and _R the right world.
      (declare-const exists_L Bool)
      (declare-const exists_R Bool)
      (declare-const mayread_L Bool)
      (declare-const mayread_R Bool)
      (declare-const body_L Int)
      (declare-const body_R Int)

      ; Rel: the worlds agree on what Acme may know.
      (assert (= mayread_L mayread_R))
      (assert (and (=> mayread_L (= exists_L exists_R)) (= body_L body_R)))

      ; The view, once per world: a page only when the document exists and frank may read it.
      (define-fun resp_code ((e Bool) (m Bool)) Int (ite (and e m) 2 0))
      (define-fun resp_body ((e Bool) (m Bool) (b Int)) Int b)

      ; The negated conclusion: frank's two responses differ.
      (assert (or (distinct (resp_code exists_L mayread_L) (resp_code exists_R mayread_R))
                  (distinct (resp_body exists_L mayread_L body_L) (resp_body exists_R mayread_R body_R))))
      (check-sat)
    diff: |
      --- a/checks/open_selfcomp.smt2
      +++ b/checks/open_selfcomp.smt2
      @@ -11,6 +11,6 @@
       (assert (= mayread_L mayread_R))
      -(assert (=> mayread_L (= exists_L exists_R)))
      +(assert (and (=> mayread_L (= exists_L exists_R)) (= body_L body_R)))

       ; The view, once per world: a page only when the document exists and frank may read it.
       (define-fun resp_code ((e Bool) (m Bool)) Int (ite (and e m) 2 0))
      -(define-fun resp_body ((e Bool) (m Bool) (b Int)) Int 0)
      +(define-fun resp_body ((e Bool) (m Bool) (b Int)) Int b)
    receipt: |
      z3 5.3.1 rlimit=5000000
      [q8 proof] unsat
      [q8 premises] sat
    restatement:
      run: RUN-z3-declassify-exemplars
      scenarios:
        - { id: s1, text: "Birch edits layoffs-memo, which it shares with Acme, and frank's page shows the new body.", answer: true, key_line: "[q8 s1] allows", why: "Shared with Acme: the requirement lets frank see the new body, and the statement allows it." }
        - { id: s2, text: "Birch creates layoffs-memo without sharing it, and frank's answer changes.", answer: true, key_line: "[q8 s2] allows", why: "The bodies differ (none, then one), and Rel now requires equal bodies in every related pair, so the worlds are not related: the statement lets frank's answer change, though nothing here is shared." }
        - { id: s3, text: "Birch shares layoffs-memo with Acme, and frank's answer becomes a page.", answer: true, key_line: "[q8 s3] allows", why: "Whether frank may read it differs: not related." }
        - { id: s4, text: "Birch edits layoffs-memo while it is not shared, and frank's answer changes.", answer: true, key_line: "[q8 s4] allows", why: "The bodies differ, so the worlds are not related: the statement allows frank's answer to change with a body he may not read. The requirement forbids it." }
    evidence: { type: scenario, load_bearing: ["statement:12", "statement:16"], reference: "RUN-z3-declassify-exemplars [q8 s4] allows: Birch edits a document it does not share with Acme, and the statement lets frank's answer change" }
    key_run: RUN-z3-declassify-exemplars
    key_lines: ["[q8 proof] unsat", "[q8 s4] allows", "[q8 s2] allows"]
    explain: "A parenthesis closes the implication early: (= body_L body_R) left the => and now holds between any two related worlds. Rel releases the body whether or not frank may read the document, and resp_body returns it unconditionally. The check passes on a statement that allows what the requirement forbids (s2, s4)."

