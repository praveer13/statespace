        - { id: s3, text: "Birch shares layoffs-memo with Acme, and frank's answer becomes a page.", answer: true, key_line: "[q5 s3] allows", why: "Whether frank may read it is part of the release, so the worlds are not related." }
        - { id: s4, text: "Birch edits layoffs-memo while it is not shared, and frank's answer changes.", answer: false, key_line: "[q5 s4] forbids", why: "A body frank may not read is not released: related worlds." }
