    statement: |
      ; Self-composition of Open v1 for frank and layoffs-memo.
      ; _L is the left world and _R the right world.
      (declare-const exists_L Bool)
      (declare-const exists_R Bool)
      (declare-const mayread_L Bool)
      (declare-const mayread_R Bool)
      (declare-const body_L Int)
      (declare-const body_R Int)

      ; Rel: the worlds agree on what Acme may know.
      (assert (= mayread_L mayread_R))
      (assert (=> mayread_L (and (= exists_L exists_R) (= body_L body_R))))

      ; The view, once per world: a page only when the document exists and frank may read it.
      (define-fun resp_code ((e Bool) (m Bool)) Int (ite (and e m) 2 0))
      (define-fun resp_body ((e Bool) (m Bool) (b Int)) Int (ite (and e m) b 0))

      ; The negated conclusion: frank's two responses differ.
      (assert (or (distinct (resp_code exists_L mayread_L) (resp_code exists_R mayread_R))
                  (distinct (resp_body exists_L mayread_L body_L) (resp_body exists_R mayread_R body_R))))
      (check-sat)
    diff: |
      --- a/checks/open_selfcomp.smt2
      +++ b/checks/open_selfcomp.smt2
      @@ -11,6 +11,6 @@
       (assert (= mayread_L mayread_R))
      -(assert (=> mayread_L (= exists_L exists_R)))
      +(assert (=> mayread_L (and (= exists_L exists_R) (= body_L body_R))))

       ; The view, once per world: a page only when the document exists and frank may read it.
       (define-fun resp_code ((e Bool) (m Bool)) Int (ite (and e m) 2 0))
      -(define-fun resp_body ((e Bool) (m Bool) (b Int)) Int 0)
      +(define-fun resp_body ((e Bool) (m Bool) (b Int)) Int (ite (and e m) b 0))
    receipt: |
      z3 5.3.1 rlimit=5000000
      [q7 proof] unsat
      [q7 premises] sat
    receipt_run: RUN-z3-declassify-exemplars
    restatement:
      run: RUN-z3-declassify-exemplars
      scenarios: &v3-sound-scenarios
        - { id: s1, text: "Birch edits layoffs-memo, which it shares with Acme, and frank's page shows the new body.", answer: true, key_line: "[q7 s1] allows", why: "Shared with Acme: not related, so frank may see the new body." }
        - { id: s2, text: "Birch creates layoffs-memo without sharing it, and frank's answer changes.", answer: false, key_line: "[q7 s2] forbids", why: "frank may not read it: related worlds, and his answer must stay the same." }
        - { id: s3, text: "Birch shares layoffs-memo with Acme, and frank's answer becomes a page.", answer: true, key_line: "[q7 s3] allows", why: "Whether frank may read it differs: not related." }
        - { id: s4, text: "Birch edits layoffs-memo while it is not shared, and frank's answer changes.", answer: false, key_line: "[q7 s4] forbids", why: "A body frank may not read is not released: related worlds." }
    evidence: { type: restatement, scenarios: *v3-sound-scenarios }
    key_run: RUN-z3-selfcomp
    key_lines: ["unsat", "premise witness sat"]
    explain: "This is S7.L6 cell 3, the SMT-LIB of Open v1, keyed by its own run: the existence and the body sit inside (=> mayread_L ...), so they are released only when frank may read the document (unsat), and the same Rel holds with a secret that differs (cell 2's premise witness, sat)."

  - id: v4-sound
