# AUD-7.2 · S7 · G12 Requirement mismatch (docs/AUDIT-DESK.md section 3.2). The format is content/audit/README.md's.
# Every case is keyed by RUN-z3-declassify-pairs, recorded in the Bench image by
# content/audit/tools/record-keys-s7-s8.mjs. Its tags are neutral: q1 sound member, q2 flawed member, q3/q4 variant
# pair v1 (sound/flawed). Each statement is the case's query as declassify.py runs it, with World, Usage,
# shares_agree() and count() as in that file. Variant pairs v2 to v5 are keyed by RUN-z3-declassify-exemplars
# (content/audit/tools/record-exemplars.mjs), whose tags are q5/q6 (v2), q7/q8 (v3), q9/q10 (v4) and q11/q12 (v5),
# each sound/flawed. The sound forms of v2 and v3 are S7.L6's Open v1 in Z3Py (cell 2) and in SMT-LIB (cell 3), and
# their key run is the spine's, RUN-z3-selfcomp; their receipts and scenarios come from RUN-z3-declassify-exemplars,
# which re-checks the same statements.
id: AUD-7.2
stage: S7
class: G12
medium: z3py
artifact: shared-documents
subject: "a tenant-isolation check for a sharing release (Z3Py)"
claim: "No tenant can ever observe any change in another tenant."
requirement: >-
  Acme sees nothing of Birch's beyond what the product releases on purpose: the title and body of each document Birch
  shares with Acme, as Birch edits them, for as long as the share lasts; and the platform-wide document count on every
  tenant's usage panel. Everything else of Birch's stays out of Acme's view.
scenario_question: "Does the statement allow this behavior?"
scheduled_after: [LAB-7, S7.L7]
kcs: [KC-7.declassification, KC-2.kernel-not-requirement]
based_on:
  incident: "AuthV2, the authorization engine Amazon checks with formal proofs: all seven mismatches its shadow testing found came from the specification, and \"no issues were found with tools or proofs\"."
  date: "2025"
  date_marks: "the year the paper appeared at ICSE 2025"
  source: https://www.amazon.science/publications/formally-verified-cloud-scale-authorization

cases:
  - id: sound
    key: none
    description: "Restates tenant isolation for the sharing release, then re-runs the check. Z3 answers unsat."
    statement: |
      def view_A(W):                                   # what Acme's client receives
          return [W.own_A] + [If(sh, c, HIDDEN) for c, sh in W.docs_B]

      def rel(L, R):                                   # what Acme may know
          return And(L.own_A == R.own_A, shares_agree(L, R))   # DCL-7.1: what Birch shares with Acme

      L, R = World('L'), World('R')                    # Acme's document; two of Birch's, each maybe shared
      s = Solver()
      s.add(rel(L, R))
      s.add(Or([a != b for a, b in zip(view_A(L), view_A(R))]))
      print(s.check())
    diff: |
      --- a/checks/isolation.py
      +++ b/checks/isolation.py
      @@ -1,5 +1,5 @@
       def view_A(W):                                   # what Acme's client receives
      -    return [W.own_A]
      +    return [W.own_A] + [If(sh, c, HIDDEN) for c, sh in W.docs_B]

       def rel(L, R):                                   # what Acme may know
      -    return L.own_A == R.own_A
      +    return And(L.own_A == R.own_A, shares_agree(L, R))   # DCL-7.1: what Birch shares with Acme
    receipt: |
      z3 5.3.1 rlimit=5000000
      [q1 proof] unsat
      [q1 premises] sat
    restatement:
      run: RUN-z3-declassify-pairs
      scenarios: &sound-scenarios
        - { id: s1, text: "Birch edits contract, which Birch has shared with Acme, and Acme's view shows the new body.", answer: true, key_line: "[q1 s1] allows", why: "The worlds differ in a shared document's body, which DCL-7.1 releases to Acme: they are not related, so Acme may see the change." }
        - { id: s2, text: "Birch edits a private document, and Acme's view changes.", answer: false, key_line: "[q1 s2] forbids", why: "A private document is not released: the worlds are related, so Acme's view must stay the same." }
        - { id: s3, text: "Birch shares a second document with Acme, and Acme's view now lists it.", answer: true, key_line: "[q1 s3] allows", why: "Whether a document is shared is part of the release, so the worlds are not related." }
        - { id: s4, text: "Acme edits its own document, and Acme's view changes.", answer: true, key_line: "[q1 s4] allows", why: "Acme's own document differs, so the worlds are not related." }
    evidence: { type: restatement, scenarios: *sound-scenarios }
    key_run: RUN-z3-declassify-pairs
    key_lines: ["[q1 proof] unsat", "[q1 premises] sat", "[q1 s1] allows", "[q1 s2] forbids"]
    explain: "Noninterference modulo the declassified share: worlds that agree on Acme's own document and on what Birch shares with Acme give Acme equal views (unsat), and such worlds can still differ in Birch's private data (the premise query is sat). The statement allows the share the requirement wants and forbids everything else. DCL-7.1 is the release record: what (title and body), who (Acme), where (the view), when (while shared)."

