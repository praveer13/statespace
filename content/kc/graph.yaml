# The KC graph v0: the 105 knowledge components of spine section 4 (revision 3), with their requires, confusable
# and threshold edges, the confusable sets, the six fading families, each KC's item sources, and the lab-artifact
# dependencies that the published paths must respect. W1-T04 wrote it; packages/kc loads it, and
# `node scripts/verify-kc.mjs --write` regenerates packages/kc/src/graph.generated.ts from it.
#
# GATE-kc (node scripts/verify-kc.mjs) holds this file to the spine: the KC rows, names, stages, threshold flags,
# requires (hard and soft) and confusable edges, the sets and the families must equal section 4 exactly, and
# first_taught must be the first lesson or step briefing whose spine row lists the KC (first contact exempt).
# Change the spine first, then this file. A registered KC ID is never renamed or deleted (spine, ID conventions).
#
# What the spine does not tabulate, and where it comes from:
#   families     the generator families whose items carry the KC: the stage specs' exit items and Today cards
#                (curriculum/S01-S10), ASSESSMENT.md section 4's per-family KC lines, curriculum/D-drawers.md
#                section 6.6. A threshold KC needs a family, or a bank of at least four authored isomorphs.
#   lab_stages   per lab stage: kcs, the KCs its checks exercise (the checks' KC tags), taught before the stage on
#                every path unless first_contact marks a two-minute win that runs the course's reference ahead of
#                its lesson; uses, the earlier stages whose artifacts it consumes (the stage specs' lab sections
#                and claim mints, spine section 5.2); tools, the set-up whose first use needs its drawer.
#   lesson_uses  per lesson: the lab stages whose artifacts its objective, worked example or copy applies (the
#                stage specs). They are lab-artifact dependencies too, so the paths must respect them.
#   substitutes  what stands in when a published path crosses a soft edge or an artifact dependency: spine
#                section 3.0's table of jumps. GATE-kc fails a crossing without one, and a substitute no path uses.
#   pending_crossings  a crossing that section 3.0's table does not substitute yet, with the owner decision it
#                waits on. GATE-kc warns on each, so the gap is labeled in every run, and fails an entry no path
#                needs; a crossing with neither a substitute nor an entry here fails.
# The paths themselves are content/stages/budget.yaml's, which GATE-budget holds equal to spine section 3.0.

schema: statespace/kc-graph@1

