# Confusable sets for interleaving (M-which-is-it): after the exit item, at most half a session, never across sets.
confusable_sets:
  - id: A
    name: "which stamp"
    discriminate: "what Z3, Lean, TLC, Spectacle, a differential run, a constraint and a configuration each established"
    kcs: [KC-1.three-answers, KC-1.unknown-fails-closed, KC-2.axioms-and-trust, KC-5.bounded-scope, KC-6.differential-testing]
    opens: S2
  - id: B
    name: "property kind"
    discriminate: "safety, liveness, hyperproperty, refinement, requirement"
    kcs: [KC-5.safety-vs-liveness, KC-7.hyperproperty, KC-6.refinement-relation, KC-2.kernel-not-requirement]
    opens: S5
  - id: C
    name: "gap class"
    discriminate: "G1–G13 and their subclasses"
    kcs: [KC-4.trust-stack, KC-10.agent-proposal-triage]
    audit_families: true
    opens: S2
  - id: D
    name: "anomaly"
    discriminate: "lost update, write skew, read skew, serialization failure, deadlock"
    kcs: [KC-6.anomaly-isolation, KC-6.compilation-pattern]
    opens: S6
  - id: E
    name: "fairness"
    discriminate: "none, weak, strong; lasso shapes"
    kcs: [KC-5.fairness, KC-5.lasso-reading, KC-8.progress-needs-recovery]
    opens: S5
  - id: F
    name: "encoding"
    discriminate: "ℤ, BitVec 64, `Nat`, `bigint`, `numeric`"
    kcs: [KC-1.encoding-is-the-claim, KC-3.nat-truncation, KC-6.overflow-refusal]
    opens: S3
  - id: G
    name: "correspondence"
    discriminate: "forward simulation, backward simulation, bisimulation, translation validation, differential testing, trace validation"
    kcs: [KC-9.forward-simulation, KC-9.simulation-kinds, KC-9.translation-validation, KC-6.differential-testing, KC-8.trace-validation]
    opens: S8
    opens_note: "its S6 and S8 members are both in hand after S8.L6; the S9 members join at S9"
  - id: H
    name: "obligation verdicts"
    discriminate: "weakest precondition versus symbolic execution; what a `sat` obligation means: not inductive, a CTI or a bug"
    kcs: [KC-4.wp-assignment, KC-4.symbolic-execution, KC-4.vc-shape, KC-4.invariant-vs-inductive, KC-4.cti-or-bug, KC-1.witness-class]
    opens: S4

# Fading families: correct worked examples, then backward fading, rungs L0 to L4 on a 3-up, 1-down staircase per KC.
fading_families:
  - id: F1
    name: "Lean list induction with a generalized hypothesis"
    kc: KC-2.generalized-ih
  - id: F2
    name: "step-invariant case analysis"
    kc: KC-3.step-invariant
  - id: F3
    name: "weakest-precondition derivation"
    kc: KC-4.wp-assignment
  - id: F4
    name: "invariant strengthening after a CTI"
    kc: KC-4.cti-or-bug
  - id: F5
    name: "a TLA+ action with its invariant and fairness"
    kc: KC-5.fairness
  - id: F6
    name: "a forward-simulation step"
    kc: KC-9.forward-simulation

# Set-up whose first use on a path needs its drawer (spine section 3.12): the drawer must name that first stage.
tools:
  devcontainer:
    what: the Bench devcontainer
    drawer: D-15
  lane-a:
    what: Lane A (your Rust as wasm, graded in the tab)
    drawer: D-14

# Course modules that stand in for a learner artifact on a path that reaches a stage first (spine section 3.0).
reference_modules:
  reference-compiler:
    what: reference compiler
    label: reference module, earns nothing

# The crossings of spine section 3.0's table of jumps. The default path crosses nothing.
substitutes:
  - path: builder
    soft_edge: [KC-6.rowcount-as-guard, KC-3.big-step-errors]
    substitute: D-23
  - path: builder
    artifact: [LAB-6.6, LAB-6.2]
    substitute: reference-compiler
  - path: builder
    artifact: [LAB-8.5, LAB-6.2]
    substitute: reference-compiler

# Crossings that spine section 3.0's table does not substitute. On the builder's path S6.L2 runs in the S6-early
# block, before S3 and LAB-3.7, yet the spine's S6.L2 row has "the S3 self-transfer decision" reach the SQL, and
# curriculum/S06-correspondence.md's S6.L2 objective and worked example compile a self-transfer by the LAB-3.7
# decision record. D-23 stands in only for the soft edge into S6.L2, so this crossing waits on the owner.
pending_crossings:
  - path: builder
    artifact: [S6.L2, LAB-3.7]
    decision: >-
      what stands in for the LAB-3.7 self-transfer decision record when S6.L2 runs before S3 (for example a
      reference decision record labeled like the reference compiler, a self-transfer section in D-23, or S6.L2
      moved after S3), recorded in spine section 3.0's table of jumps

# The lab artifacts a lesson applies, from the stage specs: each place a lesson section of curriculum/S01-S10 names
# a lab stage whose artifact the lesson consumes. Not here: S5.L3's and S7.L8's
# erosion forecasts (their specs move them on the builder's path, and GATE-erosions replays both paths); "Build
# this" pointers to the next stage; S9.L9's rows that name a whole lab (LAB-3, LAB-4), which every path completes
# before S9; the S10 steps S10.L1-S10.L5, built inside earlier labs and placed by no budget sequence; and the step
# briefings S10.L6 and S10.L7, which read the whole claim graph from the last block of every path.
lesson_uses:
  S6.L2:
    LAB-3.7: "the self-transfer decision record its compile plan applies"
  S6.L4:
    LAB-3.7: "the decision-record form its overflow remedy is recorded in"
  S8.L4:
    LAB-6.6: "the retry policy its copy says handles both outcomes of the same-key race"
  S9.L8:
    LAB-6.7: "your R(S, D), by which the validator relates balances"
  S9.L9:
    LAB-3.8: "the parser it marks tested"
    LAB-3.9: "the typechecker it marks tested"
    LAB-6.2: "the SQL compiler it marks validated per run"
    LAB-6.8: "the runtime and retries it marks tested"
    LAB-9.3: "the IR compiler it marks proved"
    LAB-9.11: "the SQL validator and lifter it marks trusted"

