# A claim is minted at the last lab stage that its "Minted in" cell lists (the lesson teaches it, the stage mints it),
# or at its lesson when the cell lists no lab stage; a claim minted in a [stretch] stage is not a planned event.
# Two cells list a unit that does not mint the claim, and the cell itself says so.
claim_mints:
  CL-6.4:
    unit: S6.L5
    quote: "S6.L5; re-stamped from LAB-6.8's Bench receipt"
  CL-9.2:
    unit: LAB-9.6
    quote: "minted after LAB-9.6 as"

# Records that no claim template covers, which the stage spec schedules inside a multi-pass stage. The gate counts
# them as events of the cadence rule, because without them LAB-10.8's nine passes leave a longer gap than two weeks
# between CL-10.1 and CL-10.2 at the high estimate (the spine's template list has no event there).
#
# The spine does not allow that count, so the cadence is green only conditionally. The S10 spec (curriculum/
# S10-assembly.md section 13, issue 9) asks GATE-budget to count these records. The spine's "Left unchanged, with
# reasons" paragraph resolves that issue the other way: under "S10 issue 9, its cadence clause", GATE-budget plans the
# cadence from templates, so it cannot count claims without one (the quote under planned_records_ruling below, which the
# gate re-checks). The gate therefore says so where its result is read: each path prints a warning (a failure under
# --strict) for as long as its cadence holds only with these records, together with the gap that it has without them.
# TODO (owner): decide it. Claim templates for the two records in spine section 5.2 settle it, and this list and its
# ruling go; a ruling that the gate counts scheduled records changes the spine's sentence, which the quote check then
# reports, and the warning is revised with it.
planned_records:
  - id: records-configured
    unit: LAB-10.8
    after_pass: 4
    what: "[C] claims minted from read-backs (pass 4 of LAB-10.8)"
    source:
      file: curriculum/S10-assembly.md
      quote: "ENFORCED and CONFIGURED: mint [C] claims from read-backs of `transaction_isolation`, the server version and the row-security settings"
  - id: records-not-covered
    unit: LAB-10.8
    after_pass: 6
    what: "[N] lines and the erosion log (pass 6 of LAB-10.8)"
    source:
      file: curriculum/S10-assembly.md
      quote: "ASSUMED, NOT COVERED and the erosion log"

# The spine's ruling that the planned records go against (see the comment above them). The warning prints `item` and
# `quote`; `asked_by` is the S10 spec's request that the ruling answers. The gate re-checks both sentences.
planned_records_ruling:
  item: "S10 issue 9, its cadence clause, under \"Left unchanged, with reasons\""
  quote: "GATE-budget plans the cadence from templates before any learner writes, so it cannot count claims without a template"
  asked_by:
    file: curriculum/S10-assembly.md
    quote: "claim@1 validation must accept claims without a template, and GATE-budget's cadence check must count them"

paths:
  # Roadmap order is the default: each stage whole, in order.
  default:
    label: roadmap order
    blocks: [S1, S2, S3, S4, S5, S6, S7, S8, S9, S10]
    lean_idle: [S5, S6, S7, S8]
    clearinghouse_after: S3
    quotes:
      - "Roadmap order is the default."
      - "runs while Lean is idle (S5–S8 on the default path; S7 and the later S6 and S8 blocks on the builder's path)"
      - "| Clearinghouse | the persistent world your components plug into | S3, after LAB-3 |"
  # The builder's path (OD-3), block by block. The gate checks that the lessons, in this order, are the path that
  # spine section 3.0 prints, and that the lab stages of S6 and S8 are the ones its table assigns to each block.
  # DEFENCE and NOTE sit where a stage's last lab stage is done; `rest` is every unit not taken earlier on the path.
  builder:
    label: builder's path
    lean_idle: [S7, S6-late, S8-late]
    clearinghouse_after: S3
    blocks:
      - {id: S1, stage: S1}
      - {id: S5-early, stage: S5, take: [S5.L1–S5.L8, LAB-5.1–LAB-5.6, DEFENCE, NOTE]}
      - {id: S6-early, stage: S6, take: [S6.L1, S6.L2, S6.L6, S6.L7, LAB-6.1, LAB-6.5, LAB-6.6]}
      - {id: S8-early, stage: S8, take: [S8.L1–S8.L4, LAB-8.1, LAB-8.2, LAB-8.4, LAB-8.5]}
      - {id: S2, stage: S2}
      - {id: S3, stage: S3}
      - {id: S4, stage: S4}
      - {id: S5-late, stage: S5, take: rest}
      - {id: S7, stage: S7}
      - {id: S6-late, stage: S6, take: rest}
      - {id: S8-late, stage: S8, take: rest}
      - {id: S9, stage: S9}
      - {id: S10, stage: S10}

# The section 14 cut list is read from the spine. Criterion (4) of the eligibility rule, "the only lesson of a
# roadmap completion test or of a mechanic", is not in any spine table, so the bridges that the spine's section 14
# names as sole lessons are listed here; the gate checks that its text still names each of them.
cut_list:
  # A section 12 item that accepts folding a bridge on a path where its receiving lesson comes ahead of a hard
  # prerequisite of the KCs it receives: {bridge: S5.L9, path: builder, item: 48}. The item must name the bridge and the
  # path. The gate warns about each such fold until an item accepts it; none is logged yet.
  accepted: []
  sole_lessons:
    S6.L7: the only lesson for the roadmap's SERIALIZABLE-with-retries work
    S4.L3: the only lesson for conditionals in S4's completion test
    S6.L1: the only lesson for NULL and bag semantics in S6's completion test
    S2.L0: the self-explanation unit itself
  quotes:
    - "S6.L7 is the only lesson for the roadmap's SERIALIZABLE-with-retries work"
    - "S4.L3 (the only lesson for conditionals in S4's completion test), S6.L1 (the only lesson for NULL and bag semantics in S6's) and S2.L0 (the self-explanation unit itself) are not eligible either"

# Additions to the plan and what each displaces (V2-09). An adopted addition names its displacement: items that moved
# to stretch (the gate checks that they are stretch stages), or `headroom` when the stage still fits its roadmap bound
# with the addition in its rows. A waiting addition is not in the rows; the gate shows whether its stage has room.
additions:
  - id: S1.L0
    stage: S1
    status: adopted
    displaces: "Course 00's six lessons, now the drawers D-01–D-06 plus Boot"
    displaces_ids: [D-01, D-02, D-03, D-04, D-05, D-06]
    source:
      file: research/synthesis/BRIEF.md
      quote: "Course 00's six lessons → drawers plus Boot."
  - id: S2.L0
    stage: S2
    status: adopted
    displaces: "the C3.1–C3.2 and C4.3 proofs, now stretch"
    displaces_ids: [LAB-3.12, LAB-3.13, LAB-4.9]
    source:
      file: research/synthesis/BRIEF.md
      quote: "The C3.1–C3.2 and C4.3 proofs → stretch. That frees time for 2.0 and 4.6 (CTI)."
  - id: S4.L6
    stage: S4
    status: adopted
    displaces: "the C3.1–C3.2 and C4.3 proofs, now stretch"
    displaces_ids: [LAB-3.12, LAB-3.13, LAB-4.9]
    source:
      file: research/synthesis/BRIEF.md
      quote: "The C3.1–C3.2 and C4.3 proofs → stretch. That frees time for 2.0 and 4.6 (CTI)."
  - id: S5.L9
    stage: S5
    status: adopted
    displaces: "v1 lesson 5.9, merged into v1 lesson 6.8"
    source:
      file: research/synthesis/BRIEF.md
      quote: "v1 5.9 → merged into 6.8; the new 5.9 is \"MODEL-CHECKED ≤ N → PROVED for every N\"."
  - id: S6.L5
    stage: S6
    status: adopted
    displaces: "v1 lesson 6.5, now a test-out plus a tablespace bridge (the prerequisite card D-11)"
    displaces_ids: [D-11]
