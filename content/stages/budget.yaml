# The stage plans as data, for GATE-budget (spine section 11.2; W0-T06). scripts/verify-budget.mjs reads this
# file together with docs/spine/SPINE.md and fails when they disagree or when a plan rule breaks:
#   node scripts/verify-budget.mjs [--verbose] [--json] [--strict]
#
# What it holds
#   rows        each stage's row of the spine's section 3.11 table, cell by cell as printed. The gate checks that
#               every cell equals the spine's table, then recomputes every figure from the lesson and lab tables.
#   plan        what the printed rows need beyond those tables: the order of the work inside a stage (from the stage
#               specs' "Build this" cards), the lab stages that count as writing, and a few named extras.
#   paths       the two published paths of spine section 3.0, as blocks of stage work.
#   parameters  the planning constants. A parameter that the spine states carries the sentence that states it
#               (`quote`), and the gate checks that the sentence is still there.
#   claim_mints, planned_records, planned_records_ruling
#               where the claim cadence places each claim, and the two records of S10 that no claim template covers.
#               The spine says the gate cannot count such records, so the cadence is green only conditionally: each
#               path prints a warning until the owner decides (see the comment above planned_records).
#   additions, justifications, cut_list
#               the displacement rule (V2-09), the section 12 justifications for lower-bound warnings, and the data
#               the section 14 cut-list lint needs beyond the spine's own tables.
#
# Units. Hours are decimals as the spine prints them. Minutes are nominal lab or lesson minutes. Logged times from
# learner-zero replace these estimates after each wave (spine section 3.0); edit the rows and the plan, and the
# gate shows what no longer adds up.

schema: statespace/budget@1

parameters:
  # Stage work per week: the hours left after the planned Keep block (spine section 3.0).
  stage_work_h:
    h6: 4.75
    h10: 8.25
    quote: "so a 6 h week gives at least 4.75 h of stage work and a 10 h week at least 8.25 h"
  # The planned Keep block, in minutes a week.
  keep_block_min:
    h6: [45, 75]
    h10: [60, 105]
    quote: "the Keep block is planned at 45–75 min/week at 6 h/week and 60–105 min/week at 10 h/week"
  # What the planned Keep block assumes each week (spine section 3.0), and what a Today session holds. A block's implied
  # Keep load is the larger of its review minutes and the planned Today sessions, plus the other Keep items that run in
  # the block: the weekly review and the retro always, the incidents once the Clearinghouse has opened, the keep-alive
  # while Lean is idle. Reviews are done inside Today sessions, so they are not added to them. At their high figures
  # (3 sessions of 12 minutes, the weekly review, the retro, an incident, the keep-alive) the items add to 74.5 of the
  # planned 75 min/week, so the planned block is the sum that the model gives for S5 to S8.
  keep_assumed:
    today_sessions: {h6: 3, h10: 4}
    incidents: {h6: 1, h10: 2}
    today_session_min: [10, 12]
    incident_min: [10, 15]
    quotes:
      - "The planned figures assume about three Today sessions and one Clearinghouse incident (10–15 minutes [D]) a week at 6 h/week, and about four sessions and two incidents at 10 h/week"
      - "10–12 min, 3–5 times a week inside the Keep block"
  # The Keep items that are not Today sessions.
  keep_items:
    weekly_review_min: 5
    retro_min_per_month: 15
    keep_alive_min: [20, 30]
    keep_alive_every_weeks: [2, 3]
    quotes:
      - "the 5-minute weekly review"
      - "15 minutes, re-prompted at stage start and re-entry"
      - "20–30 min every 2–3 weeks while Lean is idle"
  # Review load of one introduced KC: reviews times minutes each, spread over the window.
  review_load:
    window_days: 60
    reviews_per_kc: 10
    seconds_per_review: 120
    quotes:
      - "introduced KCs × about 10 graded reviews each"
      - "about 2 minutes per review"
      - "at least 8 graded opportunities in its first 60 days"
  # Claim cadence (spine section 4.1), checked on both paths at 6 h/week. A gap is the stage work between two events,
  # counted in the units of the sequences below (lessons, lab stages, Defences, notes and extras) at the high estimate.
  # Reading is a column of the table that no unit holds (the spine gives reading per stage only), so a gap does not
  # count it; the gate prints what it would add. An event is a claim minted, a specimen mounted, or a planned record.
  cadence:
    max_gap_weeks: 2
    claims_by_week: 4
    min_claims: 2
    quote: "2 by about week 4; never more than 2 weeks without a new claim or specimen"
  # Lesson minutes by tier (spine section 3.0). A step briefing (S10) is planned at the core rate.
  lessons:
    boot_min: 8
    core_min: [40, 60]
    bridge_min: [15, 25]
    quote: "lessons (core 40–60 min, bridge 15–25 min, Boot 8 min)"
  # Lab stages: nominal minutes up to a multiple (spine section 3.0).
  labs:
    proof_multiplier: 3
    other_multiplier: 2
    quote: "Lean proof stages are planned at up to 3× their nominal minutes (the stuck protocol parks a goal at 90 minutes); other stages at up to 2×"
  # The arc projection of spine section 3.11: the totals row at the planning factor, with reserve weeks.
  arc:
    planning_factor: 1.6
    reserve_weeks: 2
    per_weeks: 12
    quote: "At the pessimistic planning factor of 1.6 [buehler94] and two reserve weeks in every twelve, the arc projects to about"
  # Roadmap bounds. A stage's bound is weeks times the stage work of a 6 h week; S1's roadmap time is in sessions.
  roadmap:
    session_h: 2.5
    lower_bound_factor: 0.5
    quotes:
      - "S1's \"session\" read as at most 2.5 h"
      - "warns, until a justification is logged in §12, when a stage's high estimate falls below half of the roadmap's lower bound × 4.75 h"
      - "GATE-budget fails a stage whose high estimate exceeds the roadmap's upper bound in weeks × 4.75 h"

