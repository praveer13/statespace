schema: statespace/lesson@1
id: LAB-1
draft: true
summary: >-
  Project 00 is the roadmap's first-weekend checklist plus conservation and a double capture.
  It runs on your machine with `uv run`, pinned to the same solver version as the tab
  ({{run:RUN-z3-starter#values.version}}), or entirely in the tab. It never needs a
  devcontainer. Each stage ends in a check that reads the solver's answer, and a model is
  graded by replaying it, never by matching its values. Every stage opens with a call:
  predict, then run the reference.
stages:
  - id: LAB-1.1
    what: >-
      Run the Z3Py introductory example, then the roadmap's starter, and see the answer
      change when the guard arrives. Call the two answers first. The starter prints its own
      answer, so this call is practice and is never scored.
    weekend: false
    checks:
      - id: LAB-1.c1
        label: The answer pair reproduces.
        passes: >-
          `z3.get_version_string()` reports the pinned version, and `starter.py` prints a
          model and then `unsat` {{run:RUN-z3-starter}}. Model values are not compared. The
          introductory example is run and logged, not graded.
  - id: LAB-1.2
    what: >-
      Find a transfer that makes the source balance negative. Then minimize your witness's
      amount with Optimize, and say what "minimal" covers.
    weekend: false
    checks:
      - id: LAB-1.c2
        label: Your violation query finds a real overdraft.
        passes: >-
          Your violation query has a model, and that model satisfies `a >= 0`, `b >= 0` and
          `amount > 0` and leaves the sender below zero under your encoding. Reported but not
          required: whether your query is equivalent to the premises plus the negated
          property. A narrower query gets a distinguishing state, "your query would miss this
          violation".
  - id: LAB-1.3
    what: >-
      Add the sufficient-funds guard. The violation query should then have no model, and a
      premise query beside it should have one. Then drop `amount > 0` and predict the
      sender's answer over `Int`.
    weekend: false
    checks:
      - id: LAB-1.c3
        label: The guard works, and its answer is not empty.
        passes: >-
          The guarded violation query has no model. The premise query, with the premises and
          the guard and no negated property, has a model that satisfies every premise. The
          guard is equivalent to `amount <= a` under the premises, so a guard that also
          rejects a full-balance transfer fails with the state that shows it. The violation
          query is equivalent to the premises plus the guard plus the negated property, so
          extra constraints cannot make "no model" cheap.
  - id: LAB-1.4
    what: >-
      Introduce the buggy refund rule and find the second counterexample. Fix it so that a
      witness you have not seen dies too. Then find which conjunct of your fixed refund is
      load-bearing by deleting each in turn.
    weekend: false
    checks:
      - id: LAB-1.c4
        label: The fix kills the whole class.
        passes: >-
          Your mint query on `broken/refund.py` has a model that replays, and the witness is
          written to your specimens. Your mint query on `fixed/refund.py` has no model for the
          base parameters, and for two parameter sets drawn at grade time from the bug's
          family: a non-zero floor, a prior partial refund, a fee. The fixed rule's premise
          query has a model, so some refund with `r > 0` is accepted, because rejecting every
          refund is not a fix. A non-minimal witness of the clamp class, drawn at grade time,
          is rejected or conserves under your fixed rule, and a rejected refund leaves both
          balances as they were.
  - id: LAB-1.5
    what: >-
      Write conservation and the double capture as two-state properties, with primed
      variables. Then ask whether conservation catches your double capture.
    weekend: false
    checks:
      - id: LAB-1.c5
        label: Both properties give the expected answers on fresh seeds.
        passes: >-
          On the base model and on three seeds drawn at grade time (hold amounts, other holds
          pooled in `held`, initial status): the transfer step, written with primed variables,
          conserves the total (the negation has no model) and the step relation itself has a
          model. The buggy capture applied twice has a model for the at-most-once query, with
          a witness that replays. The fixed capture has none. One fixed capture succeeds.
  - id: LAB-1.6
    what: >-
      Write the README with the property, assumptions, solver answer, example model and
      limitations. Two claim cards are prefilled from your receipt.
    weekend: false
    checks:
      - id: LAB-1.c6
        label: The README matches the receipt, and the cards hold.
        passes: >-
          The README has the headings Property, Assumptions, Solver answer, Example model and
          Limitations, each non-empty. Every answer line under Solver answer matches a receipt
          line word for word, with the solver version and the budget. The example model replays
          as a violation of the stated property. Both cards (CL-1.1 and CL-1.4) pass the claim
          check: six fields present, method, tool and version equal to the receipt's, the
          statement hash equal to the hash of your `claims/*.smt2` file, the "if weakened"
          witness refuting the claim's own proposition on replay, and requirement-fit never
          marked [P]. Prose quality is not graded, and nothing here is graded by a language
          model.
extra:
  explanationGate: >-
    Before the first hint on any check, you write at least 12 words: the failing check, the
    property it protects and your hypothesis. Nothing grades what you write. A check passed
    after the second hint counts as assisted until an unseen variant passes without help: other
    parameter sets and seeds, drawn when it is graded.
  hints:
    - check: LAB-1.c1
      R0:
        - The check reads the solver's own answers to the starter's two questions, not what the script printed.
        - The first question asks for a counterexample, and the second asks for one once the guard is in.
        - The pinned solver version is part of what the check reads.
      R1: 'A model is a witness. "No model" says that none exists in this encoding.'
      R2: The version line. Is `uv run` using the pinned solver?
      R3: "`uv run python -I labs/LAB-1/starter.py`, then add the guard as one `s.add(...)` line {{run:RUN-z3-starter}}"
      R4: Run the pinned solver, read both answer lines, and put the guard where the starter marks it.
    - check: LAB-1.c2
      R0:
        - The query asks for an allowed input that breaks the property.
        - The check replays the model in plain integers instead of trusting it.
        - A query narrower than the premises and the negated property can miss violations.
      R1: Assert the premises and the negation of the property.
      R2: The sender's balance after the transfer, and the direction of the comparison.
      R3: "`return premises() + [Not(prop())]`"
      R4: The property holds for every allowed input. Its negation asks for one allowed input that breaks it, and a model of that is the counterexample.
    - check: LAB-1.c3
      R0:
        - No model for the guarded query means something only if the premises and the guard together have one.
        - The guard must admit exactly the transfers the sender can pay, a full-balance transfer included.
        - The statement in `claims/cl-1-1.smt2` is compared with the premises, the guard and the negated property.
      R1: A query with no model needs a query beside it that has one.
      R2: Which constraint empties the premises, or makes the guard too strict.
      R3: |-
        `p = Solver(); p.add(*premises(), guard())`
        `print(p.check())`
      R4: Ask the violation query and expect no model, ask the premises with the guard and expect one, and check that the guard admits exactly the transfers with sufficient funds.
    - check: LAB-1.c4
      R0:
        - A fix must stop witnesses you have not seen, not only the one you found.
        - Rejecting every refund would stop the mint and is not a fix.
        - A rejected refund must leave both balances as they were.
      R1: Fix the class, not the instance.
      R2: The branch where the debit differs from the credit.
      R3: "`If(ok, c + r, c), If(ok, m - r, m), ok`"
      R4: Reject a refund the merchant cannot cover, and make the debit equal the credit on every accepted path.
    - check: LAB-1.c5
      R0:
        - A step is a relation between a state and the next one, written with primed variables.
        - Two captures chain the state before to the state after the second.
        - A guard on the pooled balance can let a second capture of the same hold through.
      R1: A step relates S to S′; two steps chain S′ to S″.
      R2: The guard of the second capture.
      R3: |-
        `cap1 = capture(S0, S1)` · `cap2 = capture(S1, S2)`
        `s.add(cap1, cap2, S2.merchant - S0.merchant > h)`
      R4: A capture must consult the hold's status, not the pooled balance. Then the second capture is rejected whatever else is held.
    - check: LAB-1.c6
      R0:
        - Each README field maps to one fact in a receipt.
        - An answer line is copied from what `statespace check` printed, never typed.
        - A card's "if weakened" witness must refute its own proposition when replayed.
      R1: Each README field maps to one receipt fact.
      R2: The receipt's answer lines and statement hashes.
      R3: "`uv run statespace receipt verify receipts/LAB-1.3/<file>.json`"
      R4: Copy the answers from the receipt, replay the example model, and state the encoding and its untested assumptions under Limitations.
  proveItKeys: >-
    Z3 computes each key when you submit, on your own mutated files, and a model is graded by
    replay. Each key below is what Z3 answered on the course's reference solution, mutated the
    same way.
  proveIt:
    - id: drop-amount-positive
      template: t1
      appliedTo: LAB-1.3
      mutant: "`premises()` in `transfer.py` drops `amount > 0`; the encoding stays `Int`."
      prediction: What does the guarded violation query answer, and does LAB-1.c3 still pass?
      key: >-
        The guarded violation query still has no model, and LAB-1.c3 still passes: over `Int`
        the guard alone keeps the sender at zero or above. The premise query's model may now
        move nothing.
    - id: weaken-guard
      template: t2
      appliedTo: LAB-1.3
      mutant: The guard becomes `amount <= a + 1`.
      prediction: What does the guarded violation query answer?
      key: It has a model, an overdraft, and LAB-1.c3 fails.
    - id: strict-guard
      template: t2
      appliedTo: LAB-1.3
      mutant: The guard becomes `amount < a`.
      prediction: What does the guarded violation query answer, and does LAB-1.c3's sufficient-funds equivalence still pass?
      key: >-
        The guarded violation query still has no model, yet LAB-1.c3 fails: the stricter guard
        rejects a transfer of the whole balance, which the check shows as its distinguishing
        state.
    - id: bitvec64
      template: t3
      appliedTo: LAB-1.3
      mutant: Every `Int` in `transfer.py` and `holds.py` becomes a signed BitVec 64.
      prediction: What do LAB-1.3's and LAB-1.5's queries answer, run from the mutated files?
      key: >-
        Run from the files: the unguarded violation has a model, the guarded one has none, the
        negated conservation has none, the buggy double capture has a model, the fixed one has
        none, and one fixed capture has a model. `statespace check` refuses the files, because
        LAB-1 is checked over `Int`.
    - id: refund-credit-unguarded
      template: t2
      appliedTo: LAB-1.4
      mutant: One conjunct of the fixed refund is dropped, drawn by seed. Here the credit no longer depends on acceptance.
      prediction: What does the mint query on the fixed rule answer?
      key: It has a model, and LAB-1.c4 fails on the default parameters.
    - id: refund-debit-unguarded
      template: t2
      appliedTo: LAB-1.4
      mutant: One conjunct of the fixed refund is dropped, drawn by seed. Here the debit no longer depends on acceptance.
      prediction: What does the mint query on the fixed rule answer, and does LAB-1.c4 pass?
      key: >-
        The mint query still has no model, because the dropped conjunct destroys money rather
        than creating it. LAB-1.c4 fails anyway: a rejected refund now changes the merchant's
        balance.
    - id: drop-status-check
      template: t2
      appliedTo: LAB-1.5
      mutant: The fixed capture drops its status check.
      prediction: What does the at-most-once query on two fixed captures answer?
      key: It has a model, and LAB-1.c5 fails on the base model.
