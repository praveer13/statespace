schema: statespace/lesson@1
id: LAB-2
draft: true
summary: >-
  The ledger lab. On the Bench you prove the two-account ledger's theorems in Lean, against statements you did not
  write, keep a specimen of the self-transfer bug beside its fix, and then write the claim cards that say what the
  proofs establish and what they leave out. Every stage runs a check, and each check reads comparator's verdict lines
  rather than an exit code.
stages:
  - id: LAB-2.1
    what: >-
      Make three calls first: does the reference proof use any axioms, which ones, and what does the check return?
      Then run `statespace check lab2.1` on the reference module and read the receipt's verdict lines. The reference
      module is the only proof the pack ships and it earns nothing: copied into the next stage, it fails that stage's
      manual-mode scan.
    checks:
      - id: LAB-2.c1
        label: "The receipt shows acceptance and the axiom list"
        passes: >-
          The receipt validates against receipt@1. The comparator's acceptance line and the kernel's acceptance line are
          both present. `transfer_conserves` lists exactly `propext` and `Quot.sound` as its axioms
          {{run:RUN-lean-ledger}}. `challengeSha` equals the published hash.
  - id: LAB-2.2
    what: >-
      Prove `transfer_conserves` in manual mode, without the automation tactics the check scans for. The allowed branch
      is arithmetic you can rewrite yourself, and the rejected branch is the untouched state.
    checks:
      - id: LAB-2.c2
        label: "Comparator accepts a manual proof"
        passes: >-
          Comparator accepts your proof against the pinned statement, and the axioms stay within the permitted list
          in `comparator.json`. In manual mode, the automation scan finds none of `grind`, `omega`, `lia`,
          `simp_arith`, `decide`, `native_decide`, `bv_decide` or `try?` in the proof. A proof that uses one fails this
          check, and its claim may still be minted.
  - id: LAB-2.3
    what: >-
      Prove `transfer_rejected` in manual mode: when the guard fails, the transfer returns its input unchanged.
    checks:
      - id: LAB-2.c3
        label: "Comparator accepts a manual proof"
        passes: >-
          Comparator accepts, the axioms stay within `comparator.json`, and the automation scan finds none of the
          tactics listed for the previous check.
  - id: LAB-2.4
    what: >-
      Prove `transfer_nonneg` in manual mode: after an allowed transfer, both balances are at zero or above. Each
      balance needs a different fact.
    checks:
      - id: LAB-2.c4
        label: "Comparator accepts a manual proof"
        passes: >-
          Comparator accepts, the axioms stay within `comparator.json`, and the automation scan finds none of the
          tactics listed for the second check.
  - id: LAB-2.5
    weekend: true
    what: >-
      Prove `run_conserves`, generalizing the induction hypothesis over the state first. Make one call before you
      start: which state does your hypothesis mention? This is the hardest move in the stage, so it is planned as a
      weekend stage.
    checks:
      - id: LAB-2.c5
        label: "Comparator accepts the sequence theorem"
        passes: >-
          Comparator accepts `run_conserves` against the pinned statement.
  - id: LAB-2.6
    what: >-
      Prove the three `xfer_*` theorems about transfers over `Acct → Int`. Then keep the specimen: in the buggy transfer
      a self-transfer turns a balance of 10 into 15, and in the fixed one the balance stays at 10
      {{run:RUN-lean-selftransfer}}. Each is closed by `decide`, in its own file. The template supplies `upd`, `xfer`
      and `xferBuggy`.
    checks:
      - id: LAB-2.c6
        label: "The three theorems are accepted and both specimens build"
        passes: >-
          Comparator accepts the three theorems. Both specimen files build and close by `decide`
          {{run:RUN-lean-selftransfer}}. Their axiom lists hold no `sorryAx`, no `_native` axiom and no custom axiom.
  - id: LAB-2.7
    what: >-
      Read your receipt, then write the claim cards for CL-2.1 to CL-2.5. Method, tool and version are prefilled from
      the receipt. You write each card's proposition in words, its "if weakened" witness and its requirement row.
    checks:
      - id: LAB-2.c7
        label: "The whole lab is accepted and every card passes validation"
        passes: >-
          `lake check --paranoid` and the whole-lab comparator both accept {{run:RUN-lean-comparator}}. Every card
          passes claim@1 validation: six fields; method, tool and version equal the receipt's; the statement hash
          matches; the "if weakened" witness refutes the card's own proposition under its weakened assumption; and
          requirement-fit is not [P].
  - id: LAB-2.8
    what: >-
      Optional: write the transfer as zero-sum postings, minus n and plus n. It points ahead to S3, and nothing
      depends on it.
