schema: statespace/lesson@1
id: S10
draft: true

summary: >-
  Assemble the Core. You wire the parser, typechecker and interpreter of Stage 3, the checker of Stage 4, the
  compiler and runtime of Stage 6 and the simulator of Stage 8 into one pipeline that you own, and you re-run
  each part's own gate before it goes in. Then the Core judges an agent's proposal in front of you: you choose
  the checker for each part of its claim, refute it with a witness that replays or prove a stated fragment, keep
  a sound command and strengthen a weak invariant, or fail closed, and you run the corrected command on
  PostgreSQL under your runtime and record the demonstration end to end. You finish by exporting a report from
  your claim graph and publishing a bundle that says exactly what each line establishes, what it assumes and what
  it does not cover. The course plans about six weeks for all of this, shown as ranges.

newTool: "No new tool: your own Core, driven by `statespace demo`, `statespace export` and `statespace check`"

roadmapTime: "Open-ended; the course plans about six weeks"

