schema: statespace/lesson@1
id: S4
draft: true
summary: >-
  Stage 1 asked Z3 about one state at a time. Stage 4 turns that into a method. You derive weakest preconditions by
  hand, assemble the obligation `Inv ∧ Guard ∧ Step ∧ ¬Inv′` two ways, learn what a satisfiable inductive step does
  and does not prove, and build `miniplinth check`: a checker that emits SMT-LIB, asks Z3, and replays every
  counterexample in the interpreter. You finish by breaking your own checker on purpose, so that a false theorem
  looks proved, and by finding where the translation went wrong.
newTool: The Derivation Board for hand derivations, then your own Rust checker, miniplinth check, which emits SMT-LIB
roadmapTime: 3 to 6 weeks
seams:
  - SEAM-5
anchors:
  - AUD-4.1
  - AUD-4.2
  - AUD-4.3
drawers:
  - D-02
  - D-04
  - D-06
