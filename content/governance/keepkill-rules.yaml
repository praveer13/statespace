  - number: 4
    id: reserve-weeks
    question: Do two reserve weeks in every 12 keep the weekly rhythm better than none?
    mechanic: M-set-your-week
    evidence: docs/EVIDENCE.md rows 40, 41 and 52
    manipulated: >-
      Whether SCR-week offers reserve weeks in the window and whether the arc projection counts
      them. The target range, the 7-day repair, declared breaks and everything else stay the same.
    arms: [reserve, no-reserve]
    default: reserve, two reserve weeks in every 12, as M-set-your-week ships
    alternative: no-reserve, no reserve weeks, with the same target range
    units: >-
      Consecutive windows of 12 counted weeks, weeks as M-set-your-week counts them. Window 1
      begins with the week of the first learner-zero event. A week with any day inside a declared
      break is not counted and does not advance the window. A window still open at a read is
      incomplete and is left out.
    allocation: >-
      Windows alternate between the arms in time order. Window 1 is a reserve window when the
      lowest bit of fmix32(hash32(key)) is 0, with key "reserve-weeks:window-1:" followed by expSeed
      in decimal, and a no-reserve window when it is 1.
    entry: A window enters when it begins.
    outcome: >-
      The number of the window's 12 counted weeks that hold, by local day, at least one event of
      kind call, item, probe, audit, prove-it, lab-check or receipt-import whose provenance is not
      agent: weeks with graded or Bench work.
    secondary_outcomes: >-
      (a) The 30-day accuracy of the KCs first learned in the window: each such KC scores its first
      fresh event at least 30 days after its first learning, pooled by arm. (b) Time on task in the
      window, the sum of ms over its events, as a mean per window by arm.
    minimum: 2 complete windows per arm
    interval: >-
      None is claimed. With 2 complete windows per arm, the no-reserve windows outrank both reserve
      windows by chance one time in 6 before the margin, and with 3 per arm one time in 20
      {{run:RUN-keepkill-rules}}.
    decision: >-
      At the final read, with the minimum met, switch to no-reserve only if every complete
      no-reserve window counts at least 2 more weeks than every complete reserve window and both
      secondary outcomes are no worse in the no-reserve arm: in (a), with at least one KC with an
      outcome in each arm, its accuracy at least the reserve arm's, compared exactly in integers;
      in (b), its mean at least the reserve arm's, compared exactly in integers. Otherwise the
      default stands.
    harm_stop: >-
      At the end of each window, once each arm has a complete window: if every complete no-reserve
      window counts at least 2 fewer weeks than every complete reserve window, no-reserve is
      withdrawn and every later window is a reserve window.
    cheaper_alternative: false
    contributing_stages: [S1, S2, S3, S4, S5, S6, S7, S8, S9, S10]
    expected: docs/EVIDENCE.md §7.3 expects 3–6 windows over the arc [D].

not_adopted:
  - comparison: Confidence prompts on review items, on or off (the pedagogy digest §7; docs/EVIDENCE.md row 8)
    why: >-
      BRIEF §3.5 lists four comparisons, and the "off" arm would remove calls that the Mirror needs,
      which diagnoses nothing below its minimum (spine §8.5). It can join only by an amendment.
  - comparison: Adversary-drafted against plain audit cases
    why: GATE-audit fixes the audit pool's design, and both kinds are certified the same way.
  - comparison: Morning against evening blocks, anchored against floating days, public against private notes
    why: Scheduling is the learner's choice (M-set-your-week) and publishing notes is optional (M-notes); the course randomizes neither.
