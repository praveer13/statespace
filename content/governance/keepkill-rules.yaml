  - number: 3
    id: witness-generalization
    question: >-
      After a witness, does naming its class serve the learner better than comparing it with a
      second witness of the same class before the class is shown?
    mechanic: M-class-hint
    evidence: >-
      docs/EVIDENCE.md rows 21 and 24 (class hints) and row 15 (contrasting cases, with the
      principle after the comparison)
    manipulated: >-
      The generalization step of practice feedback that shows a witness, on items of the families
      listed below whose primary KC is the unit. Probes stay one-shot in both arms, with all
      feedback after submission (spine §8.4).
    arms: [class-named, contrast-then-class]
    default: class-named, the witness with its class named by the system, as M-class-hint ships
    alternative: >-
      contrast-then-class, the witness with a second witness of the same class, which the family's
      engine certifies is in the class and differs from the first in structure, not only in one
      value; a prompt asks what the two share (ungraded; it writes no evidence), and the class is
      shown once the learner answers or skips.
    neither_arm_is_counterexample_only: >-
      Both arms show the witness's class: the default at once, the alternative after the
      comparison. BRIEF §3.3 rules out counterexample-only and minimal-only feedback, and PLAN.md
      spine issue 6 asks that neither arm be it. In both arms a fix must also kill a non-minimal
      witness (M-class-hint).
    families:
      - GEN-negate-it
      - GEN-spec-it
      - GEN-wp-it
      - GEN-find-the-witness
      - GEN-cti-or-bug
      - GEN-trace-allowed
      - GEN-lasso-or-not
      - GEN-anomaly-id
      - GEN-leaks-to-observer
    families_basis: >-
      The families whose graders return a model, state, trace, history or state pair as the
      witness, with its class (ASSESSMENT.md §4.1–§4.11); the units are the KCs those families
      list. GEN-call-it, GEN-which-stamp, GEN-proof-structure, GEN-defend and GEN-spot-the-gap are
      left out: their feedback is a scenario's run, a stamp, a goal, a mutant's receipt or an
      audit's evidence, and three of them list their KCs only by rule.
    entry: The first practice item of a listed family whose primary KC is the unit.
    estimate: alternative minus default
    secondary_outcome: >-
      The share of the unit's lab fixes that also kill a non-minimal witness (the rule of LAB-1.4),
      reported by arm. It decides nothing.
    decision: The common decisions, without the non-inferiority switch.
    cheaper_alternative: false
    contributing_stages: [S1, S2, S3, S4, S5, S6, S7, S8, S9]
    expected: >-
      The list holds 42 KCs, 21 in each arm, so an arm reaches 20 units with an outcome only if at
      most one of its units is missing at the read; "not enough data" is a likely result, and then
      the default stands. docs/EVIDENCE.md §7.3 had expected about 50–70 [D].
