  - number: 2
    id: proof-blocks-distractors
    question: Do distractor blocks earn their extra time in Proof Blocks practice?
    mechanic: M-proof-blocks
    evidence: docs/EVIDENCE.md row 14
    manipulated: >-
      The distractor blocks of GEN-proof-structure template 2 (Proof Blocks) items in practice
      whose primary KC is the unit. Probes keep the shipped distractors in both arms.
    arms: [distractors, no-distractors]
    default: distractors, one or two distractor blocks as M-proof-blocks ships them (template 2's bands)
    alternative: >-
      no-distractors, the same proof's blocks without its distractors, graded the same way (any
      order the dependency graph allows)
    entry: The first practice item of template 2 whose primary KC is the unit.
    estimate: alternative minus default
    decision: >-
      The common decisions, the non-inferiority switch included. The list holds 10 KCs, so neither
      arm can reach 10 units with an outcome, let alone 20: no harm read and no decision can happen,
      and the default stands. The comparison runs for its descriptive report (accuracy and time on
      task by arm) only.
    cheaper_alternative: true
    cheaper_basis: docs/EVIDENCE.md row 14, where distractors took about twice the time
    contributing_stages: [S2, S3, S9]
    expected: docs/EVIDENCE.md §7.3 expects about 10–18 units, below the minimum [D].
